name: Load Saleh Finance UI
on:
  push:
    paths:
      - 'saleh-finance-ui.js'
      - '.github/workflows/load-saleh-finance-ui.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject UI script once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='<script src="./saleh-finance-ui.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit("index.html has no </body>")
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit injection
        run: |
          if git diff --quiet -- index.html; then
            echo "Already injected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load visible PERSONAL FINANCE feature hub"
          git push
