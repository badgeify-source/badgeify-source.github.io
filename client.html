<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#090909;
    --card:#111111;
    --card2:#0D1B2A;
    --gold:#1877F2;
    --gold2:#42A5F5;
    --text:#f5f5f5;
    --muted:#999;

    --orange:#f0a84b;
    --border:rgba(24,119,242,.22);
}

body{
    font-family:Tahoma,Arial,sans-serif;

        radial-gradient(circle at top right,rgba(24,119,242,.12),transparent 30%),

        var(--bg);

    min-height:100vh;
}

.container{
    width:min(1150px,94%);
    margin:auto;
}

.header{
    padding:25px 0 15px;
}

.brand{
    color:var(--gold2);
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;
}

.subtitle{
    color:var(--muted);
    margin-top:5px;
    font-size:13px;
}

.hero{
    margin-top:20px;
    padding:28px;
    border:1px solid var(--border);
    border-radius:24px;
    background:
        linear-gradient(135deg,rgba(24,119,242,.10),rgba(255,255,255,.02)),

}

.hero-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.welcome{
    color:var(--muted);
    font-size:14px;
}

.customer-name{
    margin-top:7px;
    font-size:29px;
    font-weight:900;
    color:#fff;
}

.customer-phone{
    margin-top:8px;
    color:var(--muted);
}

.status-badge{
    padding:10px 17px;
    border-radius:50px;
    border:1px solid rgba(53,201,138,.3);
    color:var(--green);
    background:rgba(53,201,138,.08);
    white-space:nowrap;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:20px;
}

.summary-card{
    background:var(--card2);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
}

.summary-title{
    color:var(--muted);
    font-size:13px;
}

.summary-value{
    margin-top:10px;
    font-size:25px;
    font-weight:900;
    color:var(--gold2);
}

.section{
    margin-top:25px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:13px;
}

.section-title h2{
    font-size:20px;
}

.section-title span{
    color:var(--muted);
    font-size:13px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    padding:20px;
}

.subscription-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.service-name{
    font-size:19px;
    font-weight:900;
    color:var(--gold2);
}

.page-name{
    color:var(--muted);
    margin-top:6px;
    font-size:13px;
}

.status{
    padding:7px 11px;
    border-radius:30px;
    font-size:12px;
    white-space:nowrap;
}

.status-paid{
    color:var(--green);
    background:rgba(53,201,138,.1);
}

.status-overdue{
    color:var(--red);
    background:rgba(255,98,98,.1);
}

.status-today{
    color:var(--orange);
    background:rgba(240,168,75,.1);
}

.status-upcoming{
    color:var(--gold2);
    background:rgba(214,173,85,.1);
}

.status-inactive{
    color:#aaa;
    background:#222;
}

.details{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:18px;
}

.detail{
    background:#0B1624;
    border-radius:13px;
    padding:12px;
}

.detail-label{
    color:#777;
    font-size:11px;
}

.detail-value{

.table-wrap{

    border:1px solid var(--border);
}

table{

th,td{

th{

    background:#102235;
}

td{

    font-size:13px;
}

tr:last-child td{

}

.invoice{

    gap:15px;
}

.invoice-number{

    color:var(--gold2);

.invoice-date{

.invoice-total{

.invoice-status{

    color:var(--muted);

}

.followup{

    gap:15px;
    align-items:flex-start;
}

.followup-date{

    text-align:center;
    background:rgba(24,119,242,.08);
    border:1px solid var(--border);
    border-radius:13px;
    padding:10px;
    color:var(--gold2);
    font-weight:bold;
}

.followup-title{
    font-weight:bold;
}

.followup-notes{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:25px;
}

.btn{
    border:0;
    cursor:pointer;
    padding:13px 20px;
    border-radius:13px;
    font-weight:bold;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.btn-whatsapp{
    background:#1faa67;
    color:#fff;
}

.btn-refresh{
    background:#1a1a1a;
    border:1px solid var(--border);
    color:var(--gold2);
}

.empty{
    text-align:center;
    padding:35px;
    color:var(--muted);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;

.loading{

    align-items:center;
    text-align:center;
}

.loader-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    padding:35px;
    width:min(400px,90%);

.loader-brand{

    font-weight:900;
    color:var(--gold2);
}

.loader-text{
    margin-top:15px;
    color:var(--muted);
}

.error{
    color:var(--red);

.footer{
    text-align:center;
    padding:35px 0;
    color:#666;
    font-size:12px;

@media(max-width:850px){

<script>

const FUNCTION_URL =
    "https://rsvzachgbqsucqgrwguv.supabase.co/functions/v1/customer-portal";

const params = new URLSearchParams(window.location.search);

const TOKEN = params.get("token");

let portalData = null;

function escapeHtml(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function money(value,currency="EGP"){

    const number = Number(value || 0);

    return new Intl.NumberFormat(
        "ar-EG",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ).format(number) + " " + currency;
}

function formatDate(value){

    if(!value){
        return "—";
    }

    const date = new Date(value);

    if(isNaN(date.getTime())){
        return value;
    }

    return new Intl.DateTimeFormat(
        "ar-EG",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    ).format(date);
}

function serviceName(subscription){

    if(
        subscription.app_service &&
        subscription.app_service.service_name
    ){
        return subscription.app_service.service_name;
    }

    if(
        subscription.service &&
        subscription.service.service_name
    ){
        return subscription.service.service_name;
    }

    if(
        subscription.service &&
        subscription.service.name
    ){
        return subscription.service.name;
    }

    return "خدمة";
}

function statusHtml(status){

    if(!status){
        return "";
    }

    const code = status.code;

    let className = "status-upcoming";

    if(code === "paid"){
        className = "status-paid";
    }

    if(code === "overdue"){
        className = "status-overdue";
    }

    if(code === "due_today"){
        className = "status-today";
    }

    if(code === "inactive"){
        className = "status-inactive";
    }

    return `
        <span class="status ${className}">
            ${escapeHtml(status.label)}
        </span>
    `;
}

async function loadPortal(){

    if(!TOKEN){

        showError(
            "رابط العميل غير صحيح أو لا يحتوي على رمز الوصول."
        );

        return;
    }

    try{

        document.getElementById("loading").style.display =
            "flex";

        document.getElementById("app").style.display =
            "none";

        const response = await fetch(
            FUNCTION_URL +
            "?token=" +
            encodeURIComponent(TOKEN),
            {
                method:"GET",
                headers:{
                    "Accept":"application/json"
                },
                cache:"no-store"
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){

            throw new Error(
                data.error ||
                "تعذر تحميل بيانات الحساب."
            );
        }

        portalData = data;

        renderPortal(data);

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("app").style.display =
            "block";

    }catch(error){

        console.error(error);

        showError(
            error.message ||
            "حدث خطأ أثناء تحميل بيانات الحساب."
        );
    }
}

function showError(message){

    document.getElementById("loading").innerHTML = `
        <div class="loader-box">
            <div class="loader-brand">
                BADGEIFY
            </div>

            <div class="error">
                ${escapeHtml(message)}
            </div>
        </div>
    `;
}

function renderPortal(data){

    const customer =
        data.customer || {};

    const summary =
        data.summary || {};

    document.getElementById("customerName").textContent =
        customer.client_name || "عميل BADGEIFY";

    document.getElementById("customerPhone").textContent =
        customer.phone || "";

    if(data.company){

        if(data.company.company_name){

            document.getElementById(
                "companySubtitle"
            ).textContent =
                "بوابة العميل — " +
                data.company.company_name;
        }
    }

    document.getElementById("monthlyTotal").textContent =
        money(
            summary.monthly_total,
            data.company?.currency || "EGP"
        );

    document.getElementById("paidCurrentMonth").textContent =
        money(
            summary.paid_current_month,
            data.company?.currency || "EGP"
        );

    document.getElementById("remainingCurrentMonth").textContent =
        money(
            summary.remaining_current_month,
            data.company?.currency || "EGP"
        );

    document.getElementById("subscriptionsCount").textContent =
        summary.subscriptions_count || 0;

    document.getElementById("billingMonth").textContent =
        summary.current_billing_month || "";

    renderWhatsapp(customer);

    renderSubscriptions(
        data.subscriptions || [],
        data.company?.currency || "EGP"
    );

    renderPayments(
        data.payments || [],
        data.subscriptions || [],
        data.company?.currency || "EGP"
    );

    renderInvoices(
        data.invoices || [],
        data.invoice_items || [],
        data.company?.currency || "EGP"
    );

    renderFollowups(
        data.followups || []
    );
}

function renderWhatsapp(customer){

    const btn =
        document.getElementById("whatsappBtn");

    if(!customer.phone){
        btn.style.display = "none";
        return;
    }

    let phone =
        String(customer.phone)
            .replace(/\D/g,"");

    if(phone.startsWith("01")){
        phone = "20" + phone.substring(1);
    }

    const company =
        portalData?.company?.company_name ||
        "BADGEIFY";

    const message =
        `مرحباً ${customer.client_name || ""}،\n` +
        `نحن سعداء بخدمتك مع ${company}.\n` +
        `يمكنك متابعة اشتراكاتك ومدفوعاتك من بوابة العميل.`;

    btn.href =
        "https://wa.me/" +
        phone +
        "?text=" +
        encodeURIComponent(message);

    btn.style.display = "inline-flex";
}

function renderSubscriptions(
    subscriptions,
    currency
){

    const container =
        document.getElementById("subscriptions");

    if(!subscriptions.length){

        container.innerHTML = `
            <div class="empty">
                لا توجد اشتراكات حالياً.
            </div>
        `;

        return;
    }

    container.innerHTML =
        subscriptions.map(subscription => {

            const service =
                serviceName(subscription);

            const page =
                subscription.page_name ||
                "—";

            const platform =
                subscription.platform ||
                "—";

            const fee =
                money(
                    subscription.monthly_fee,
                    subscription.currency ||
                    currency
                );

            const paymentDay =
                subscription.payment_day ||
                "—";

            return `
                <div class="card">

                    <div class="subscription-head">

                        <div>
                            <div class="service-name">
                                ${escapeHtml(service)}
                            </div>

                            <div class="page-name">
                                ${escapeHtml(page)}
                            </div>
                        </div>

                        ${statusHtml(
                            subscription.payment_status
                        )}

                    </div>

                    <div class="details">

                        <div class="detail">
                            <div class="detail-label">
                                المنصة
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(platform)}
                            </div>
                        </div>

                        <div class="detail">
                            <div class="detail-label">
                                قيمة الاشتراك
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(fee)}
                            </div>
                        </div>

                        <div class="detail">
                            <div class="detail-label">
                                يوم السداد
                            </div>

                            <div class="detail-value">
                                يوم ${escapeHtml(paymentDay)}
                            </div>
                        </div>

                        
                        <div class="detail">
                            <div class="detail-label">
                                الاستحقاق
                            </div>

                            <div class="detail-value">
                                ${escapeHtml(formatDate(subscription.due_date))}
                            </div>
                        </div>

                        ${subscription.page_link ? `
                        <div class="detail" style="grid-column:1/-1">
                            <div class="detail-label">رابط الصفحة</div>
                            <div class="detail-value">
                                <a href="${escapeHtml(subscription.page_link)}" target="_blank" rel="noopener noreferrer" style="color:#63b3ff;text-decoration:none;word-break:break-all">فتح الرابط</a>
                            </div>
                        </div>
                        ` : ""}

                        ${(subscription.visa_last4 || subscription.visa_card_last4 || subscription.visa_last_4 || subscription.visa_name || subscription.visa_card_name || subscription.card_name) ? `
                            <div class="visa-display">
                                <div class="visa-chip"></div>
                                <div class="visa-info">
                                    <div class="visa-title">الفيزا المستخدمة</div>
                                    <div class="visa-name">${escapeHtml(subscription.visa_name || subscription.visa_card_name || subscription.card_name || "فيزا مرتبطة")}</div>
                                    <div class="visa-number">•••• ${escapeHtml(subscription.visa_last4 || subscription.visa_card_last4 || subscription.visa_last_4 || "")}</div>
                                </div>
                            </div>
                        ` : ""}

                        
<div class="detail">
                            <div class="detail-label">
                                الحالة
                            </div>

                            <div class="detail-value">
                                ${
                                    escapeHtml(
                                        subscription
                                            .payment_status
                                            ?.label ||
                                        "—"
                                    )
                                }
                            </div>
                        </div>

                    </div>

                </div>
            `;

        }).join("");
}

function renderPayments(
    payments,
    subscriptions,
    currency
){

    const container =
        document.getElementById("payments");

    if(!payments.length){

        container.innerHTML = `
            <div class="empty">
                لا توجد مدفوعات مسجلة حتى الآن.
            </div>
        `;

        return;
    }

    const subMap = new Map();

    subscriptions.forEach(sub => {

        subMap.set(
            Number(sub.id),
            serviceName(sub)
        );

    });

    container.innerHTML = `
        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>الخدمة</th>
                        <th>المبلغ</th>
                        <th>الشهر</th>
                        <th>تاريخ الدفع</th>
                        <th>ملاحظات</th>
                    </tr>
                </thead>

                <tbody>

                    ${payments.map(payment => `

                        <tr>

                            <td>
                                ${escapeHtml(
                                    subMap.get(
                                        Number(
                                            payment.subscription_id
                                        )
                                    ) || "—"
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    money(
                                        payment.amount,
                                        payment.currency ||
                                        currency
                                    )
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    payment.paid_month ||
                                    "—"
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    formatDate(
                                        payment.payment_date
                                    )
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    payment.notes ||
                                    "—"
                                )}
                            </td>

                        </tr>

                    `).join("")}

                </tbody>

            </table>

        </div>
    `;
}

function renderInvoices(
    invoices,
    invoiceItems,
    currency
){

    const container =
        document.getElementById("invoices");

    if(!invoices.length){

        container.innerHTML = `
            <div class="empty">
                لا توجد فواتير مسجلة حتى الآن.
            </div>
        `;

        return;
    }

    container.innerHTML =
        invoices.map(invoice => {

            const items =
                invoiceItems.filter(
                    item =>
                        Number(item.invoice_id) ===
                        Number(invoice.id)
                );

            const itemsHtml =
                items.length
                    ? `
                        <div style="
                            margin-top:15px;
                            color:#aaa;
                            font-size:12px;
                        ">
                            ${items.map(item => `
                                <div style="
                                    padding:6px 0;
                                ">
                                    ${escapeHtml(
                                        item.service_name
                                    )}
                                    —
                                    ${escapeHtml(
                                        money(
                                            item.total,
                                            invoice.currency ||
                                            currency
                                        )
                                    )}
                                </div>
                            `).join("")}
                        </div>
                    `
                    : "";

            return `
                <div class="card" style="margin-bottom:12px;">

                    <div class="invoice">

                        <div>

                            <div class="invoice-number">
                                ${
                                    escapeHtml(
                                        invoice.invoice_number ||
                                        "فاتورة"
                                    )
                                }
                            </div>

                            <div class="invoice-date">
                                تاريخ الفاتورة:
                                ${
                                    escapeHtml(
                                        formatDate(
                                            invoice.invoice_date
                                        )
                                    )
                                }
                            </div>

                            ${
                                invoice.due_date
                                    ? `
                                    <div class="invoice-date">
                                        الاستحقاق:
                                        ${
                                            escapeHtml(
                                                formatDate(
                                                    invoice.due_date
                                                )
                                            )
                                        }
                                    </div>
                                    `
                                    : ""
                            }

                            ${itemsHtml}

                        </div>

                        <div>

                            <div class="invoice-total">
                                ${
                                    escapeHtml(
                                        money(
                                            invoice.total,
                                            invoice.currency ||
                                            currency
                                        )
                                    )
                                }
                            </div>

                            <div class="invoice-status">
                                الحالة:
                                ${
                                    escapeHtml(
                                        invoice.status ||
                                        "غير محدد"
                                    )
                                }
                            </div>

                        </div>

                    </div>

                </div>
            `;

        }).join("");
}

function renderFollowups(followups){

    const container =
        document.getElementById("followups");

    if(!followups.length){

        container.innerHTML = `
            <div class="empty">
                لا توجد متابعات حالياً.

/* BADGEIFY: force-refresh the portal document without changing the customer token */
(function(){
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const alreadyRefreshed = params.get("__bfv") === "3";
    if(!token || alreadyRefreshed) return;

    const key = "badgeify_client_cache_v3";
    const last = sessionStorage.getItem(key);
    const now = Date.now();
    if(last && now - Number(last) < 15000) return;
    sessionStorage.setItem(key, String(now));

    const separator = window.location.href.includes("?") ? "&" : "?";
    const freshUrl = window.location.href + separator + "__bfv=3&t=" + now;

    fetch(freshUrl, {cache:"no-store", credentials:"same-origin"})
        .then(function(response){
            if(!response.ok) throw new Error("refresh failed");
            return response.text();
        })
        .then(function(html){
            if(!html || html.indexOf("BADGEIFY_CACHE_BUST_V3") === -1) return;
            document.open();
            document.write(html);
            document.close();
        })
        .catch(function(){ /* keep the normal page if refresh is unavailable */ });
})();
