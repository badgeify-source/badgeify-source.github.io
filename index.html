async function openCustomerPortal(customerId){

    try{

        const customer = getCustomer(customerId);

        if(!customer){
            showToast("العميل غير موجود", true);
            return;
        }


        /* البحث عن رابط فعال */

        let result = await db
            .from("customer_portal_tokens")
            .select("id,token,is_active")
            .eq("customer_id", customerId)
            .eq("is_active", true)
            .order("id", {ascending:false})
            .limit(1);

        if(result.error)
            throw result.error;


        let token = result.data?.[0];


        /* إنشاء رابط لو مش موجود */

        if(!token){

            const newToken =
                crypto.randomUUID().replace(/-/g,"") +
                crypto.randomUUID().replace(/-/g,"");


            result = await db
                .from("customer_portal_tokens")
                .insert({
                    customer_id: customerId,
                    token: newToken,
                    is_active: true
                })
                .select()
                .single();


            if(result.error)
                throw result.error;


            token = result.data;

        }


        const portalUrl =
            new URL(
                "client.html",
                window.location.href
            ).href
            +
            "?token="
            +
            encodeURIComponent(token.token);


        openModal(

            "رابط بوابة العميل",

            `
            <div>

                <div style="
                    margin-bottom:10px;
                    color:var(--muted);
                ">
                    العميل
                </div>

                <h3 style="
                    margin-top:0;
                    color:var(--gold2);
                ">
                    ${esc(customer.client_name)}
                </h3>


                <div style="
                    background:var(--panel2);
                    border:1px solid var(--border);
                    border-radius:10px;
                    padding:12px;

                            copyCustomerPortal(
                                '${portalUrl}'
                            )
                        "
                    >
                        <i class="fa-solid fa-copy"></i>
                        نسخ الرابط
                    </button>


                    <button
                        class="ghost-btn"
                        onclick="
                            window.open(
                                '${portalUrl}',
                                '_blank'
                            )
                        "
                    >
                        <i class="fa-solid fa-link"></i>
                        فتح البوابة
                    </button>


                    <button
                        class="ghost-btn"
                        onclick="
                            sendPortalWhatsApp(
                                ${customerId},
                                '${portalUrl}'
                            )
                        "
                    >
                        <i class="fa-brands fa-whatsapp"></i>
                        إرسال واتساب
                    </button>


                    <button
                        class="red-btn"
                        onclick="
                            deactivateCustomerPortal(

                            )

                    >
                        <i class="fa-solid fa-link-slash"></i>

                    </button>

                </div>

            </div>
            `,

            `
            <button
                class="ghost-btn"
                onclick="closeModal()"
            >
                إغلاق
            </button>
            `

        );


    }catch(error){

        console.error(error);

        showToast(

    }

function buildPortalMessage(template, values){

    return String(template || "").replace(
        /{{(client_name|trader_name|portal_link|company_name)}}/g,
        function(_, key){
            return values[key] ?? "";
        }
    );

}

function openWhatsAppBusiness(number, message){

    number = whatsappNumber(number);

    if(!number){
        showToast(
            state.lang==="ar"
            ?"رقم الهاتف غير صحيح"
            :"Invalid phone number",
            true
        );
        return;
    }

    const encodedMessage =
        encodeURIComponent(String(message || ""));

    const normalUrl =
        "https://wa.me/"
        + number
        + "?text="
        + encodedMessage;

    /*
       افتح واتساب من نفس ضغطة المستخدم.
       استخدام location بدل window.open يمنع
       مشكلة حظر النوافذ المنبثقة في Chrome.
    */
    if(/Android/i.test(navigator.userAgent)){

        const businessIntent =
            "intent://send"
            + "?phone=" + number
            + "&text=" + encodedMessage
            + "#Intent;"
            + "scheme=whatsapp;"
            + "package=com.whatsapp.w4b;"
            + "end";

        let fallbackTimer = setTimeout(
            function(){
                window.location.href = normalUrl;
            },
            1500
        );

        try{
            window.location.href = businessIntent;
        }catch(error){
            clearTimeout(fallbackTimer);
            window.location.href = normalUrl;
        }

    }else{

        window.location.href = normalUrl;

    }

}

async function sendPortalWhatsApp(customerId, link){

    const customer = getCustomer(customerId);

    if(!customer.phone){

        return;
    }

    let template = "";

    try{
        const result =
            await db
            .from("app_settings")
            .select("setting_value,updated_at")
            .eq("setting_key","wa_customer_portal")
            .order("updated_at",{ascending:false})
            .limit(1);

    try{

        for(
            const [key,value]
            of Object.entries(values)

            .from("app_settings")
            .upsert(

                    setting_key:key,

        }

        await refresh();

        showToast(t("saved"));

function loanPerson(id){return (state.loanPeople||[]).find(x=>String(x.id)===String(id))||null;}
function loanDirection(loan){return String(loan?.loan_direction||'lent')==='borrowed'?'borrowed':'lent';}
function loanDirectionLabel(loan){return loanDirection(loan)==='borrowed'?'فلوس مستلفها':'فلوس مسلفها';}
function loanPaid(loanId){return (state.loanPayments||[]).filter(x=>String(x.loan_id)===String(loanId)).reduce((s,x)=>s+Number(x.amount||0),0);}
function loanRemaining(loan){return Math.max(0,Number(loan?.amount||0)-loanPaid(loan?.id));}
function loanStatusText(loan){
 const rem=loanRemaining(loan);
 if(rem<=0)return 'مسدد';
 if(loan?.due_date && String(loan.due_date)<isoDate(new Date()))return 'متأخر';
 return loanPaid(loan?.id)>0?'مسدد جزئي':'مفتوح';
}

function financeAccount(type){return (state.financeAccounts||[]).find(x=>x.account_type===type)||null;}
function financeBalance(id){
 const a=(state.financeAccounts||[]).find(x=>String(x.id)===String(id));
 if(!a)return 0;
 const tx=(state.financeTransactions||[]).filter(x=>String(x.account_id)===String(id));
 // الرصيد الافتتاحي محفوظ في الحساب نفسه، لذلك نتجاهل أي قيود افتتاحية قديمة
 // تم إنشاؤها في النسخة السابقة حتى لا يتضاعف الرصيد.
 const movements=tx.filter(x=>x.source_type!=='opening_balance'&&x.source_type!=='opening_balance_reset');
 return Number(a.opening_balance||0)+movements.reduce((s,x)=>s+Number(x.amount||0),0);
}
async function syncSalehPayment(amount,paymentId,customerId,traderId,method,date,notes,customerName){
 try{const map={cash:'cash',vodafone_cash:'vodafone_cash',instapay:'instapay'},type=map[method];if(!type)return;let a=financeAccount(type);

  const e=await db.from('personal_finance_transactions').select('id').eq('source_type','subscription_payment').eq('source_id',String(paymentId)).maybeSingle();if(e.error)throw e.error;if(e.data)return;

 }catch(e){console.warn('Saleh Finance payment sync:',e.message);}
}

function renderPersonalFinance(){
 try{
  const A=state.financeAccounts||[],T=state.financeTransactions||[],cur=(state.settings&&state.settings.currency)||'EGP';
  const bal=id=>financeBalance(id);
  const accountBal=type=>{const a=financeAccount(type);return a?bal(a.id):0;};
  const cash=accountBal('cash'),vod=accountBal('vodafone_cash'),insta=accountBal('instapay');
  const total=A.reduce((s,a)=>s+bal(a.id),0);
  const m=monthKey(new Date());
  const monthRows=T.filter(x=>String(x.transaction_date||'').slice(0,7)===m);
  const income=monthRows.filter(x=>x.transaction_type==='income'&&Number(x.amount)>0).reduce((s,x)=>s+Number(x.amount),0);
  const expense=monthRows.filter(x=>x.transaction_type==='expense'&&Number(x.amount)<0).reduce((s,x)=>s+Math.abs(Number(x.amount)),0);
  const profit=income-expense;
  const activeLoans=(state.loans||[]).filter(x=>x.status!=='cancelled');
  const borrowedLoans=activeLoans.filter(x=>loanDirection(x)==='borrowed');
  const lentLoans=activeLoans.filter(x=>loanDirection(x)==='lent');
  const calcLoanGroup=group=>{
    const total=group.reduce((s,x)=>s+Number(x.amount||0),0);
    const repaid=(state.loanPayments||[]).filter(p=>group.some(l=>String(l.id)===String(p.loan_id))).reduce((s,x)=>s+Number(x.amount||0),0);
    return {total,repaid,remaining:Math.max(0,total-repaid),open:group.filter(x=>loanRemaining(x)>0).length,overdue:group.filter(x=>loanRemaining(x)>0&&x.due_date&&String(x.due_date)<isoDate(new Date())).length};
  };
  const borrowedStats=calcLoanGroup(borrowedLoans);
  const lentStats=calcLoanGroup(lentLoans);

  const cards=[
   ['إجمالي أموالي',total,'fa-wallet','finance-main'],
   ['الكاش / الجيب',cash,'fa-money-bill-wave',''],
   ['Vodafone Cash',vod,'fa-mobile-screen-button',''],
   ['InstaPay',insta,'fa-building-columns','']

  const accountCards=A.map(a=>'<div class="finance-account-card"><div class="finance-account-top"><div class="finance-account-icon"><i class="fa-solid '+(a.account_type==='cash'?'fa-money-bill-wave':a.account_type==='vodafone_cash'?'fa-mobile-screen-button':a.account_type==='instapay'?'fa-building-columns':'fa-wallet')+'"></i></div><div><b>'+esc(a.account_name)+'</b><small>الرصيد الافتتاحي: '+money(Number(a.opening_balance||0))+' '+esc(cur)+'</small></div></div><strong>'+money(bal(a.id))+' <small>'+esc(cur)+'</small></strong><button class="mini-btn" style="margin-top:8px" onclick="openSalehReconcile('+a.id+')">مطابقة الرصيد</button></div>').join('');

async function saveSalehOpeningBalances(){
 const A=state.financeAccounts||[];
 const fields=[
  {id:'salehOpenCash',type:'cash',label:'الكاش / الجيب'},
  {id:'salehOpenInstapay',type:'instapay',label:'InstaPay'},
  {id:'salehOpenVodafone',type:'vodafone_cash',label:'Vodafone Cash'}
 ];
 const values=fields.map(f=>({ ...f, amount:Number(document.getElementById(f.id)?.value||0) }));
 if(values.some(x=>!Number.isFinite(x.amount))){showToast('تأكد من إدخال كل الأرصدة بشكل صحيح.',true);return;}
 try{
  for(const item of values){
   const account=A.find(a=>String(a.account_type||a.type||'').toLowerCase()===item.type);
   if(!account)continue;
   const up=await db.from('personal_finance_accounts')
    .update({opening_balance:item.amount,updated_at:new Date().toISOString()})
    .eq('id',account.id).eq('user_id',currentUser.id);
   if(up.error)throw up.error;
  }
  closeModal();
  await loadFinanceData();
  render();
  showToast('تم حفظ الأرصدة الافتتاحية للكاش وInstaPay وVodafone Cash');
 }catch(e){
  console.error('OPENING BALANCES',e);

 }
}

function renderPersonalFinanceLoans(){

 const groups=[
  {key:'borrowed',title:'فلوس مستلفها',sub:'فلوس عليَّ للناس',icon:'fa-hand-holding-dollar'},
  {key:'lent',title:'فلوس مسلفها',sub:'فلوس ليا عند الناس',icon:'fa-hand-holding-hand'}
 ];
 groups.forEach(group=>{
  const active=loans.filter(x=>loanDirection(x)===group.key);
  const open=active.filter(x=>loanRemaining(x)>0);
  const overdue=open.filter(x=>x.due_date&&String(x.due_date)<isoDate(new Date()));
  const dueSoon=open.filter(x=>{if(!x.due_date)return false;const d=Math.ceil((new Date(x.due_date+'T00:00:00')-new Date(isoDate(new Date())+'T00:00:00'))/86400000);return d>=0&&d<=3;});
  const total=active.reduce((s,x)=>s+Number(x.amount||0),0);
  const repaid=(state.loanPayments||[]).filter(p=>active.some(l=>String(l.id)===String(p.loan_id))).reduce((s,x)=>s+Number(x.amount||0),0);
  const remaining=Math.max(0,total-repaid);
  const rows=active.slice().sort((a,b)=>String(b.loan_date||'').localeCompare(String(a.loan_date||''))).map(x=>{
   const p=loanPerson(x.person_id),paid=loanPaid(x.id),rem=loanRemaining(x),st=loanStatusText(x);
   const actionLabel=group.key==='borrowed'?'تسجيل سداد':'تسجيل تحصيل';
   return '<tr><td><b>'+esc(p?.person_name||'شخص')+'</b><br><small class="muted">'+esc(x.purpose||'بدون غرض')+'</small></td><td>'+money(x.amount)+' '+esc(cur)+'</td><td>'+money(paid)+' '+esc(cur)+'</td><td class="money">'+money(rem)+' '+esc(cur)+'</td><td>'+esc(x.due_date||'بدون موعد')+'</td><td><span class="badge '+(st==='متأخر'?'overdue':st==='مسدد'?'paid':st==='مسدد جزئي'?'due':'upcoming')+'">'+st+'</span></td><td>'+(rem>0?'<button class="mini-btn pay" onclick="openLoanRepayment('+x.id+')">'+actionLabel+'</button>':'<span class="muted">مكتملة</span>')+'</td></tr>';

async function sendTestNotificationToRecipient(role,recipientId,button){
    if(button){
        button.disabled=true;
        button.dataset.originalText=button.textContent;
        button.textContent="جاري الإرسال...";
    }

    try{
        const response=await fetch(
            NOTIFICATION_TEST_URL,
            {
                method:"POST",
                mode:"cors",
                headers:{
                    "Content-Type":"application/json",
                    "apikey":SUPABASE_KEY,
                    "Authorization":"Bearer "+SUPABASE_KEY
                },
                body:JSON.stringify({
                    role:role,
                    recipient_id:String(recipientId),
                    title:"BADGEIFY",
                    body:"تم إرسال إشعار اختبار حقيقي من BADGEIFY."
                })
            }
        );

        const responseText=await response.text();
        let data=null;

        try{
            data=JSON.parse(responseText);
        }catch(e){}

        if(!response.ok || !data || data.success!==true){
            throw new Error(
                (data && data.error) ||
                responseText ||
                ("HTTP "+response.status)
            );
        }

        const sent=Number(data.sent||0);

        if(sent>0){
            showToast("تم إرسال إشعار الاختبار إلى "+sent+" جهاز.");
        }else{
            showToast("لا يوجد جهاز نشط لهذا الشخص حاليًا.",true);
        }

    }catch(error){

        console.error(
            "BADGEIFY TARGETED TEST ERROR:",
            error
        );

        showToast(
            "فشل إرسال الإشعار: "+
            (error?.message||"خطأ غير معروف"),
            true
        );

    }finally{

        if(button){
            button.disabled=false;
            button.textContent=
                button.dataset.originalText ||
                "إرسال اختبار";
        }

    }
}

function urlBase64ToUint8Array(base64String){
    const padding="=".repeat((4-base64String.length%4)%4);
    const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
    const rawData=atob(base64);
    return Uint8Array.from([...rawData].map(char=>char.charCodeAt(0)));
}

function getSubscriptionDueDate(sub){
    if(!sub) return null;
    if(sub.due_date) return new Date(sub.due_date+"T00:00:00");

    const day=Number(sub.payment_day||0);
    if(!day) return null;

    const now=new Date();
    const d=new Date(now.getFullYear(),now.getMonth(),day);
    if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate())){
        d.setMonth(d.getMonth()+1);
    }
    return d;
}

function getSubscriptionAlertState(sub){
    if(!sub || String(sub.status||"").toLowerCase()==="paid") return null;

    const due=getSubscriptionDueDate(sub);
    if(!due || Number.isNaN(due.getTime())) return null;

    const today=new Date();
    const a=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const b=new Date(due.getFullYear(),due.getMonth(),due.getDate());
    const diff=Math.round((b-a)/86400000);

    if(diff<0) return {type:"overdue",days:Math.abs(diff)};
    if(diff===0) return {type:"today",days:0};
    if(diff===1) return {type:"tomorrow",days:1};
    if(diff===2) return {type:"two_days",days:2};
    return null;
}

function buildDueAlerts(){
    const alerts=[];
    (state.subscriptions||[]).forEach(function(sub){
        const alert=getSubscriptionAlertState(sub);
        if(!alert) return;

        const customer=getCustomer(sub.customer_id);
        const name=customer?.client_name || "عميل";
        const amount=Number(sub.monthly_fee||0);
        const currency=sub.currency || state.settings.currency || "EGP";

        let body="";
        if(alert.type==="overdue"){
            body=`اشتراك ${name} متأخر عن السداد منذ ${alert.days} يوم.`;
        }else if(alert.type==="today"){
            body=`اشتراك ${name} مستحق السداد اليوم.`;
        }else if(alert.type==="tomorrow"){
            body=`اشتراك ${name} مستحق السداد غدًا.`;
        }else{
            body=`اشتراك ${name} مستحق السداد بعد يومين.`;
        }

        alerts.push({
            id:String(sub.id)+"_"+alert.type,
            title:"تنبيه BADGEIFY",
            body:amount ? body+" المبلغ: "+amount+" "+currency : body
        });
    });
    return alerts;
}

async function showAutomaticDueNotifications(){
    if(!("Notification" in window) || Notification.permission!=="granted") return;

    const alerts=buildDueAlerts().concat(buildLoanAlerts());
    if(!alerts.length) return;

    const sentKey="badgeify_sent_due_notifications_"+new Date().toISOString().slice(0,10);
    const sent=JSON.parse(localStorage.getItem(sentKey)||"[]");
    const reg=await navigator.serviceWorker.ready;

    for(const alert of alerts){
        if(sent.includes(alert.id)) continue;

        if(reg.active){
            reg.active.postMessage({
                type:"SHOW_NOTIFICATION",
                title:alert.title,
                body:alert.body,
                tag:"badgeify-"+alert.id
            });
        }
        sent.push(alert.id);
    }

    localStorage.setItem(sentKey,JSON.stringify(sent));
}
