function sendPaymentReceiptWhatsApp(){
    const data=window._lastPaymentReceipt;
    if(!data){showToast("لا يوجد إيصال جاهز للإرسال",true);return;}
    let number=String(data.phone||"").replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d))).replace(/\D/g,"");
    if(number.startsWith("00"))number=number.substring(2);
    if(number.startsWith("0"))number="20"+number.substring(1);
    if(number.startsWith("20")&&number.length===12){} 
    if(!number||number.length<10||number.length>15){showToast("رقم واتساب العميل غير موجود أو غير صحيح. افتح بيانات العميل وتأكد من حفظ رقم الهاتف.",true);return;}
    window.location.href="https://wa.me/"+number+"?text="+encodeURIComponent(data.message);
}

async function confirmPayment(subscriptionId,periodKey){

    let savedPaymentId=null;
    let paymentPersisted=false;
    let platformSyncError=null;

    const s=getSubscription(subscriptionId);
    if(!s){
        showToast("الاشتراك غير موجود أو تم تحديث الصفحة. حدّث القائمة وافتح الاشتراك مرة أخرى.",true);
        return;
    }

    const customer=getCustomer(s.customer_id);
    if(!customer){
        showToast("العميل المرتبط بالاشتراك غير موجود. راجع بيانات الاشتراك قبل تأكيد الدفع.",true);
        return;
    }

    const period=getSubscriptionPeriods(s).find(function(p){return p.periodKey===periodKey;}) || getCurrentSubscriptionPeriod(s);
    const due=period ? period.dueDate : subscriptionDueDate(s);

    if(
        paymentExistsForPeriod(
            s,
            due
        )
    ){

        closeModal();

        return;

    }

    const amount=
    Number(
        document.getElementById(
            "paymentAmount"
        ).value||0
    );

    const paymentDate=
    document.getElementById(
        "paymentDate"
    ).value;

    const notes=
    document.getElementById(
        "paymentNotes"
    ).value;

    const paymentMethod=document.getElementById("paymentMethod")?.value||"cash";
    const platformDeductionMethod=document.getElementById("platformDeductionMethod")?.value||"";
    const platformDeductionAmount=Number(document.getElementById("platformDeductionAmount")?.value||0);
    const isPlatformDeduction=!!platformDeductionMethod && platformDeductionAmount>0;
    const methodDetails=document.getElementById("paymentMethodDetails")?.value.trim()||"";
    const payerName=document.getElementById("payerName")?.value.trim()||customer?.client_name||"";
    const payerRelation=document.getElementById("payerRelation")?.value||"subscriber";

    try{

        if(platformDeductionMethod && platformDeductionAmount>0){
            const platformNames={platform_bybit_saleh:'Bybit Saleh',platform_bybit_mahmoud:'Bybit Mahmoud',platform_binance:'Binance'};
            const platformName=platformNames[platformDeductionMethod];
            if(!currentUser || !currentUser.id)throw new Error('انتهت جلسة الدخول. سجّل الدخول مرة أخرى قبل خصم USDT.');
            const platformQuery=await db.from('personal_finance_accounts').select('*').eq('user_id',currentUser.id).eq('account_name',platformName).maybeSingle();
            if(platformQuery.error)throw platformQuery.error;
            if(!platformQuery.data)throw new Error('حساب المنصة '+platformName+' غير موجود في لوحة صالح.');
            if(!Number.isFinite(platformDeductionAmount))throw new Error('اكتب مبلغ USDT صحيح.');
            const platformBalance=window.pfPlatformBalance?Number(window.pfPlatformBalance(platformQuery.data.id)||0):0;
            if(platformBalance+0.0000001<platformDeductionAmount)throw new Error('رصيد '+platformName+' من USDT غير كافٍ.');
        } else if(platformDeductionMethod && platformDeductionAmount<0){
            throw new Error('مبلغ USDT لا يمكن أن يكون بالسالب.');
        }

        const result=
        await db
        .from("subscription_payments")
        .insert({

            subscription_id:
            subscriptionId,

            amount:amount,

            currency: (s.currency || state.settings.currency || "EGP"),

            payment_date:
            paymentDate,

            paid_month:
            periodKey || monthKey(due),

            notes:isPlatformDeduction ? ((notes||'')+' | خصم المنصة '+platformDeductionMethod+': '+platformDeductionAmount+' USDT') : notes

        })
        .select()
        .single();

        if(result.error)
            throw result.error;
        if(!result.data || result.data.id==null){
            throw new Error("تم حفظ الدفعة دون إرجاع رقمها؛ حدّث الصفحة وتحقق من سجل المدفوعات قبل إعادة المحاولة.");
        }
        savedPaymentId=result.data.id;
        paymentPersisted=true;

        if(isPlatformDeduction){
            try{
                await syncSalehPlatformSubscriptionDeduction(platformDeductionMethod,platformDeductionAmount,result.data.id,paymentDate,notes,customer.client_name,(getService(s.app_service_id)||{}).service_name||"اشتراك");
            }catch(syncError){
                platformSyncError=syncError;
                console.error("Subscription payment saved but platform deduction sync failed:",syncError);
            }
        }

        // يسجل الدفع الأساسي بالطريقة المختارة (جنيه/عملة الاشتراك) بشكل طبيعي.
        // خصم USDT الإضافي اختياري ومستقل عن طريقة الدفع الأساسية.
        const financeSync=await syncSalehPayment(
                amount,
                result.data?.id,
                s.customer_id,
                customer?.trader_id||null,
                paymentMethod,
                paymentDate,
                notes,
                customer?.client_name
            );

        await logActivity(
            "PAYMENT",
            "subscription",
            subscriptionId,
            "Confirmed payment"
        );


        closeModal();

        await refresh();

        const outstanding=getCustomerOutstandingForReceipt(s.customer_id,subscriptionId);
        const remainingTotal=outstanding.reduce(function(sum,row){return sum+Number(row.amount||0);},0);
        const relationText={subscriber:"صاحب الاشتراك نفسه",relative:"قريب / أحد أفراد الأسرة",other:"شخص آخر"};

        showPaymentReceiptModal({
            receiptNumber:"RCPT-"+String(savedPaymentId||"").padStart(6,"0"),
            paymentId:savedPaymentId,
            customerName:customer?.client_name||"-",
            phone:customer?.phone||customer?.whatsapp||customer?.whatsapp_number||customer?.mobile||customer?.phone_number||"",
            serviceName:getService(s.app_service_id)?.service_name||s.page_name||"اشتراك",
            amount:amount,
            currency:(s.currency||state.settings.currency||"EGP"),
            paymentMethod:paymentMethod,
            methodDetails:methodDetails,
            dueDate:due,
            paymentDate:paymentDate,
            payerName:payerName,
            payerRelationText:relationText[payerRelation]||payerRelation,
            outstanding:outstanding,
            remainingTotal:remainingTotal,
            notes:notes
        });

        if(platformSyncError){
            showToast("تم حفظ الدفعة، لكن تعذر تسجيل خصم USDT في المنصة: "+(platformSyncError.message||"خطأ غير معروف")+". لا تعِد تأكيد الدفع؛ راجع رصيد المنصة وسجل الحركات أولًا.",true);
        }else if(financeSync && financeSync.ok===false){
            console.error("Badgeify → Saleh Finance:",financeSync.message,financeSync.error);
            showToast("تم تأكيد الدفع، لكن تعذر إضافة المبلغ إلى لوحة صالح: "+(financeSync.message||"خطأ غير معروف"),true);
        }else{
            showToast(t("successPayment"));
        }

    }catch(error){
        if(paymentPersisted){
            console.error("Payment was saved before a later step failed:",savedPaymentId,error);
            try{await refresh();}catch(refreshError){console.error("Refresh after partial payment save failed:",refreshError);}
            showToast("تم حفظ الدفعة بالفعل (رقم "+savedPaymentId+") لكن لم تكتمل كل خطوات المزامنة. لا تعِد تأكيد الدفع؛ راجع سجل الدفعات ورصيد لوحة صالح أولًا. "+(error?.message||""),true);
        }else{
            showToast(error?.message||"تعذر تأكيد الدفع.",true);
        }
    }

}

        ?"هل تريد حذف الدفعة؟ سيتم حذف الحركة المرتبطة بها من لوحة صالح، بما فيها خصم USDT من المنصة إن وجد."
        :"Delete this payment and its linked Saleh Finance movement, including any platform deduction?"
    )) return;

    try{
        const {data:authData,error:authError}=await db.auth.getSession();
        if(authError) throw authError;
        const userId=authData?.session?.user?.id||currentUser?.id;
        if(!userId) throw new Error("جلسة الدخول غير متاحة. سجّل الدخول مرة أخرى قبل حذف الدفعة.");

        // Preflight all linked records before changing either side.
        const paymentCheck=await db.from("subscription_payments")
            .select("id").eq("id",paymentId).maybeSingle();
        if(paymentCheck.error) throw paymentCheck.error;
        if(!paymentCheck.data){
            showToast("الدفعة غير موجودة أو تم حذفها بالفعل. حدّث سجل المدفوعات.",true);
            await refresh();
            return;
        }

        const linked=await db.from("personal_finance_transactions")
            .select("id,source_type")
            .eq("user_id",userId)
            .eq("source_id",String(paymentId))
            .in("source_type",["subscription_payment","platform_deduction"]);
        if(linked.error) throw linked.error;

        const result=await db.from("subscription_payments")
            .delete().eq("id",paymentId).select("id").maybeSingle();
        if(result.error) throw result.error;
        if(!result.data){
            throw new Error("لم يؤكد النظام حذف الدفعة. لم يتم حذف الحركات المالية المرتبطة.");
        }

        // Both ordinary receipts and USDT platform deductions share the payment id.
        // Remove all linked rows for this owner so balances are recalculated correctly.
        const financeResult=await db.from("personal_finance_transactions")
            .delete()
            .eq("user_id",userId)
            .eq("source_id",String(paymentId))
            .in("source_type",["subscription_payment","platform_deduction"]);

        if(financeResult.error){
            console.error("Payment deleted but linked finance cleanup failed:",financeResult.error,linked.data);
            await refresh();
            showToast(
                "تم حذف الدفعة، لكن تعذر تنظيف كل الحركات المرتبطة بها في لوحة صالح. لا تعِد تسجيل الدفعة؛ راجع حركة المصدر "+String(paymentId)+".",
                true
            );
            return;
        }

        await refresh();
        showToast(t("deleted"));

    }catch(error){
        console.error("deletePayment:",error);
        showToast(error?.message||"تعذر حذف الدفعة بأمان.",true);
    }
}

async function savePaymentEdit(paymentId){

    const amount=Number(document.getElementById("editPaymentAmount").value||0);
    const paymentDate=document.getElementById("editPaymentDate").value;
    const notes=document.getElementById("editPaymentNotes").value;

    if(!paymentDate){
        showToast(t("paymentDateRequired"),true);
        return;
    }

    try{
        const result=await db
        .from("subscription_payments")
        .update({
            amount:amount,
            payment_date:paymentDate,
            notes:notes
        })
        .eq("id",paymentId);

        if(result.error) throw result.error;

        const financeEdit=await syncSalehPaymentEdit(
            paymentId,
            amount,
            paymentDate,
            notes
        );

        await logActivity("PAYMENT_EDIT","payment",paymentId,"Edited payment");
        closeModal();
        await refresh();
        if(!financeEdit.ok){

        }else{

    }catch(error){
        showToast(error.message,true);
    }
}

    class="grid"

    repeat(auto-fit,minmax(250px,1fr))
    ">

    ${
    state.traders.slice().sort(function(A,B){

        function traderRank(trader){

            const customerIds=state.customers
                .filter(function(c){
                    return Number(c.trader_id)===Number(trader.id);
                })
                .map(function(c){
                    return Number(c.id);
                });

            const subs=state.subscriptions.filter(function(s){
                return customerIds.includes(Number(s.customer_id))
                    && s.status!=="inactive";
            });

            let best={rank:4,value:0};

            subs.forEach(function(s){

                const st=getPaymentState(s);

                if(st.type==="overdue"){

                    const due=subscriptionDueDate(s);
                    const today=dateOnly(isoDate(new Date()));
                    const days=Math.max(0,Math.round((today-due)/86400000));

                    if(best.rank>0 || (best.rank===0 && days> -best.value))
                        best={rank:0,value:-days};

                }else if(st.type==="due"){

                    if(best.rank>1)
                        best={rank:1,value:0};

                }else if(st.type==="upcoming"){

                    const due=subscriptionDueDate(s);
                    const today=dateOnly(isoDate(new Date()));

                    if(best.rank>2 || (best.rank===2 && days<best.value))
                        best={rank:2,value:days};

                }else if(st.type==="paid"){

                    if(best.rank>3)
                        best={rank:3,value:0};

                }

            });

            return best;
        }

        const a=traderRank(A);
        const b=traderRank(B);

        if(a.rank!==b.rank)
            return a.rank-b.rank;

        if(a.value!==b.value)
            return a.value-b.value;

        return Number(A.id)-Number(B.id);

async function saveService(id){

    const data={

        service_name:
        document.getElementById(
            "serviceName"
        ).value.trim(),

        default_price:
        Number(
            document.getElementById(
                "servicePrice"
            ).value||0
        ),

        currency:
        document.getElementById(
            "serviceCurrency"
        ).value,

        status:
        document.getElementById(
            "serviceStatus"
        ).value,

        description:
        document.getElementById(            "serviceDescription"
        ).value

    };

    try{

        let result;

        if(id){

            result=
            await db
            .from("app_services")
            .update(data)
            .eq("id",id);

        }else{

            result=
            await db
            .from("app_services")
            .insert(data);

        }

        if(result.error)
            throw result.error;

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


async function deleteService(id){

    if(!confirm("Delete service?"))
        return;

    try{

        const result=
        await db
        .from("app_services")
        .delete()
        .eq("id",id);

        if(result.error)
            throw result.error;

        await refresh();

        showToast(t("deleted"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

function openCombinedInvoiceModal(scope, fixedEntityType){

    const isOverdue = scope === "overdue";
    const title = fixedEntityType === "trader" && isOverdue
        ? "فاتورة مجمعة للتاجر المتأخرة"
        : (isOverdue
            ? "الفواتير المجمعة - المتأخرات"
            : "الفواتير المجمعة - كل الاشتراكات");

    openModal(
        title,
        `
        <input type="hidden" id="combinedInvoiceScope" value="${scope}">
        <input type="hidden" id="combinedInvoiceFixedEntityType" value="${fixedEntityType || ""}">
        <div class="form-grid">
            <div class="field" ${fixedEntityType ? 'style="display:none"' : ""}>
                <label>نوع الحساب</label>
                <select id="combinedInvoiceEntityType" onchange="loadCombinedInvoiceEntities()">
                    <option value="customer">عميل</option>
                    <option value="trader">تاجر</option>
                </select>
            </div>
            <div class="field">
                <label id="combinedInvoiceEntityLabel">${fixedEntityType === "trader" ? "اختار التاجر" : "اختار العميل"}</label>
                <select id="combinedInvoiceEntity" onchange="loadCombinedInvoiceSubscriptions()">
                    <option value="">اختار</option>
                </select>
            </div>
        </div>
        <div id="combinedInvoiceSubscriptions" style="margin-top:14px">
            <div class="empty">اختار العميل أو التاجر لعرض الاشتراكات</div>
        </div>
        <div id="combinedInvoiceTotal" class="money" style="font-size:20px;margin-top:15px"></div>
        `,
        `
        <button class="ghost-btn" onclick="closeModal()">إلغاء</button>
        <button class="gold-btn" onclick="createCombinedInvoice('${scope}')">
            <i class="fa-solid fa-file-pdf"></i>
            إنشاء الفاتورة
        </button>
        `
    );

    loadCombinedInvoiceEntities();
}

function loadCombinedInvoiceEntities(){

    const type = document.getElementById("combinedInvoiceFixedEntityType")?.value
        || document.getElementById("combinedInvoiceEntityType")?.value
        || "customer";
    const select = document.getElementById("combinedInvoiceEntity");
    const label = document.getElementById("combinedInvoiceEntityLabel");
    if(!select) return;

    const rows = type === "trader" ? state.traders : state.customers;
    if(label) label.textContent = type === "trader" ? "اختار التاجر" : "اختار العميل";

    select.innerHTML = `
        <option value="">اختار</option>
        ${rows.map(function(row){
            const id = row.id;
            const name = type === "trader" ? row.trader_name : row.client_name;
            return `<option value="${esc(id)}">${esc(name || "-")}</option>`;
        }).join("")}
    `;

    loadCombinedInvoiceSubscriptions();
}

function getCombinedInvoiceRows(scope, entityType, entityId){

    let customers = [];
    if(entityType === "customer"){
        const customer = getCustomer(entityId);
        if(customer) customers = [customer];
    }else{
        customers = state.customers.filter(function(customer){
            return Number(customer.trader_id) === Number(entityId);
        });
    }

    const customerIds = customers.map(function(customer){ return Number(customer.id); });
    const activeSubscriptions = state.subscriptions.filter(function(subscription){
        return subscription.status !== "inactive"
            && subscription.subscription_type !== "personal"
            && customerIds.includes(Number(subscription.customer_id));
    });

    const rows = [];
    activeSubscriptions.forEach(function(subscription){
        const service = getService(subscription.app_service_id);
        const customer = getCustomer(subscription.customer_id);
        const amount = Math.max(0, Number(subscription.monthly_fee || 0));

        if(scope === "overdue"){
            getSubscriptionPeriods(subscription).filter(function(period){
                return period.periodType === "overdue";
            }).forEach(function(period){
                rows.push({
                    subscription: subscription,
                    customer: customer,
                    service: service,
                    periodKey: period.periodKey,
                    periodLabel: period.monthLabel || period.periodKey,
                    amount: amount,
                    overdue: true
                });
            });
        }else{
            rows.push({
                subscription: subscription,
                customer: customer,
                service: service,
                periodKey: "",
                periodLabel: "",
                amount: amount,
                overdue: false
            });
        }
    });

    return rows;
}

function loadCombinedInvoiceSubscriptions(){

    const type = document.getElementById("combinedInvoiceFixedEntityType")?.value
        || document.getElementById("combinedInvoiceEntityType")?.value
        || "customer";
    const entityId = Number(document.getElementById("combinedInvoiceEntity")?.value || 0);
    const container = document.getElementById("combinedInvoiceSubscriptions");
    const totalElement = document.getElementById("combinedInvoiceTotal");
    if(!container || !totalElement) return;

    if(!entityId){
        container.innerHTML = '<div class="empty">اختار العميل أو التاجر لعرض الاشتراكات</div>';
        totalElement.textContent = "";
        return;
    }

    const scope = document.getElementById("combinedInvoiceScope")?.value === "overdue" ? "overdue" : "all";
    const rows = getCombinedInvoiceRows(scope, type, entityId);

    container.innerHTML = `
        <div class="card"><div class="card-body">
            <div class="muted" style="margin-bottom:10px">
                ${scope === "overdue" ? "الاشتراكات المتأخرة فقط" : "كل الاشتراكات النشطة"}
            </div>
            ${rows.map(function(row,index){
                const value = String(row.subscription.id) + "|" + row.periodKey;
                const detail = [
                    row.customer?.client_name || "-",
                    row.service?.service_name || "اشتراك",
                    row.subscription.platform || "",
                    row.periodLabel
                ].filter(Boolean).join(" — ");
                return `
                    <label class="list-item" style="cursor:pointer">
                        <div>
                            <b>${esc(row.customer?.client_name || "-")}</b>
                            <div class="muted">${esc(row.service?.service_name || "اشتراك")}${row.subscription.platform ? " — " + esc(row.subscription.platform) : ""}${row.periodLabel ? " — " + esc(row.periodLabel) : ""}</div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <span class="money">${money(row.amount)} ${esc(row.subscription.currency || state.settings.currency || "EGP")}</span>
                            <input type="checkbox" class="combinedInvoiceCheck" checked value="${esc(value)}" data-amount="${row.amount}" onchange="calculateCombinedInvoiceTotal()">
                        </div>
                    </label>
                `;
            }).join("") || '<div class="empty">لا توجد اشتراكات مطابقة لهذا الاختيار</div>'}
        </div></div>
    `;

    calculateCombinedInvoiceTotal();
}

function calculateCombinedInvoiceTotal(){

    const total = [...document.querySelectorAll(".combinedInvoiceCheck:checked")].reduce(function(sum,check){
        return sum + Math.max(0, Number(check.dataset.amount || 0));
    }, 0);

    const totalElement = document.getElementById("combinedInvoiceTotal");
    if(totalElement) totalElement.textContent = "الإجمالي: " + money(total) + " " + (state.settings.currency || "EGP");
}

async function createCombinedInvoice(scope){

    const entityType = document.getElementById("combinedInvoiceFixedEntityType")?.value
        || document.getElementById("combinedInvoiceEntityType")?.value
        || "customer";
    const entityId = Number(document.getElementById("combinedInvoiceEntity")?.value || 0);
    const checks = [...document.querySelectorAll(".combinedInvoiceCheck:checked")];

    if(!entityId){
        showToast(entityType === "trader" ? "اختار التاجر" : "اختار العميل", true);
        return;
    }
    if(!checks.length){
        showToast("اختار اشتراكًا واحدًا على الأقل", true);
        return;
    }

    const rows = getCombinedInvoiceRows(scope, entityType, entityId);
    const selectedKeys = new Set(checks.map(function(check){ return check.value; }));
    const selectedRows = rows.filter(function(row){
        return selectedKeys.has(String(row.subscription.id) + "|" + row.periodKey);
    });

    if(!selectedRows.length){
        showToast("لم يتم العثور على الاشتراكات المحددة. حدّث الصفحة وحاول مرة أخرى.", true);
        return;
    }

    const customer = entityType === "customer" ? getCustomer(entityId) : null;
    const trader = entityType === "trader" ? getTrader(entityId) : null;
    const total = selectedRows.reduce(function(sum,row){ return sum + row.amount; }, 0);
    const currency = state.settings.currency || "EGP";
    const invoiceNumber = generateInvoiceNumber(scope === "overdue" ? "LATE" : "COMB");
    const notes = scope === "overdue"
        ? "COMBINED:OVERDUE"
        : "COMBINED:ALL";

    try{
        const invoiceResult = await db.from("invoices").insert({
            invoice_number: invoiceNumber,
            customer_id: customer ? customer.id : null,
            trader_id: trader ? trader.id : null,
            subscription_id: null,
            invoice_type: entityType,
            invoice_date: isoDate(new Date()),
            due_date: selectedRows.map(function(row){return row.dueDate;}).filter(Boolean).sort()[0] || null,
            subtotal: total,
            discount: 0,
            total: total,
            currency: currency,
            status: "unpaid",
            notes: notes
        }).select().single();

        if(invoiceResult.error) throw invoiceResult.error;

        const invoiceItems = selectedRows.map(function(row){
            const descriptionParts = [];
            if(entityType === "trader") descriptionParts.push(row.customer?.client_name || "");
            if(row.periodLabel) descriptionParts.push(row.periodLabel);
            return {
                invoice_id: invoiceResult.data.id,
                subscription_id: row.subscription.id,
                service_name: row.service?.service_name || "اشتراك",
                description: descriptionParts.filter(Boolean).join(" — "),
                quantity: 1,
                unit_price: row.amount,
                discount: 0,
                total: row.amount
            };
        });

        const itemsResult = await db.from("invoice_items").insert(invoiceItems);
        if(itemsResult.error) throw itemsResult.error;

        await logActivity("CREATE", "combined_invoice", invoiceResult.data.id, invoiceNumber);
        closeModal();
        await refresh();
        showToast("تم إنشاء الفاتورة المجمعة بنجاح");
    }catch(error){
        console.error("Combined invoice error:", error);
        showToast("تعذر إنشاء الفاتورة: " + (error.message || "خطأ غير معروف"), true);
    }
}

async function saveCustomerInvoice(){

    const customerId=
    Number(
        document.getElementById(
            "invoiceCustomer"
        ).value
    );

    const subscriptionId=
    document.getElementById(
        "invoiceSubscription"
    ).value
    ||
    null;

    const amount=
    Number(
        document.getElementById(
            "invoiceAmount"
        ).value||0
    );

    const discount=
    Number(
        document.getElementById(
            "invoiceDiscount"
        ).value||0
    );

    const total=
    Math.max(
        0,
        amount-discount
    );

            true

        return;

            subtotal:amount,

            discount:discount,

            total:total,

            document.getElementById(
                "invoiceStatus"
            ).value,

            notes:
            document.getElementById(
                "invoiceNotes"
            ).value

        })
        .select()
        .single();

        if(result.error)
            throw result.error;


        if(subscriptionId){

            const s=
            getSubscription(

            );

            await db
            .from("invoice_items")
            .insert({

                invoice_id:
                result.data.id,

                service_name:
                getService(

                "Service",

                quantity:1,

                unit_price:amount,

                discount:discount,

        }

        closeModal();

        await refresh();

        showToast(t("saved"));

            error.message,

function loadTraderInvoiceSubscriptions(){

function calculateTraderInvoice(){

    const checks=
    document.querySelectorAll(
        ".traderInvoiceCheck:checked"
    );

    let total=0;

    checks.forEach(function(check){

        total+=
        Number(
            check.dataset.amount||0
        );

    });

    document.getElementById(
        "traderInvoiceTotal"
    ).textContent=
    `${t("total")}: ${money(total)} ${state.settings.currency||"EGP"}`;

}


async function createTraderInvoice(){

    const traderId=
    Number(
        document.getElementById(
            "combinedTrader"
        ).value
    );

    const checks=
    [...document.querySelectorAll(
        ".traderInvoiceCheck:checked"
    )];

    if(!traderId){

        showToast(
            t("chooseTrader"),
            true
        );

        return;

    }

    if(!checks.length){

        showToast(
            t("selectSubscriptions"),
            true
        );

        return;

    }

    const subscriptions=
    checks.map(
        check=>
        getSubscription(
            check.value
        )
    ).filter(Boolean);

    const subtotal=
    subscriptions.reduce(
        (sum,s)=>
        sum+Number(s.monthly_fee||0),
        0
    );

    try{

        const number=
        generateInvoiceNumber("TR");

        const invoice=
        await db
        .from("invoices")
        .insert({

            invoice_number:number,

            customer_id:null,

            trader_id:traderId,

            subscription_id:null,

            invoice_type:"trader",

            invoice_date:
            isoDate(new Date()),

            subtotal:subtotal,

            discount:0,

            total:subtotal,

            currency:
            state.settings.currency||"EGP",

            status:"unpaid",

            notes:
            "Combined trader invoice"

        })
        .select()
        .single();

        if(invoice.error)
            throw invoice.error;


        const items=
        subscriptions.map(function(s){

            return {

                invoice_id:
                invoice.data.id,

                subscription_id:
                s.id,

                service_name:
                getService(
                    s.app_service_id
                )?.service_name
                ||
                "Service",

                description:
                getCustomer(
                    s.customer_id
                )?.client_name
                ||
                "",

                quantity:1,

                unit_price:
                Number(s.monthly_fee||0),

                discount:0,

                total:
                Number(s.monthly_fee||0)

            };

        });


        const itemsResult=
        await db
        .from("invoice_items")
        .insert(items);

        if(itemsResult.error)
            throw itemsResult.error;


        await logActivity(
            "CREATE",
            "trader_invoice",
            invoice.data.id,
            number
        );

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


function generateInvoiceNumber(prefix="INV"){

    const date=
    new Date();

    return prefix
    +"-"
    +date.getFullYear()
    +String(
        date.getMonth()+1
    ).padStart(2,"0")
    +"-"
    +Date.now()
    .toString()
    .slice(-6);

}


/* =========================================
   INVOICE FILE NAME
   اسم الملف الافتراضي عند طباعة/حفظ PDF
========================================= */

function cleanInvoiceFileName(value){

    return String(value || "")
        .replace(/[\\/:*?"<>|]/g,"-")
        .replace(/[\x00-\x1F]/g,"")
        .replace(/\\s+/g," ")
        .trim()
        .replace(/^[. ]+|[. ]+$/g,"")
        .slice(0,180);

}

function getInvoiceFileName(invoice){

    const trader = getTrader(invoice.trader_id);
    const customer = getCustomer(invoice.customer_id);
    const items = state.invoiceItems.filter(function(item){
        return Number(item.invoice_id) === Number(invoice.id);
    });
    const totalPart = money(invoice.total) + " " + (invoice.currency || "EGP");

    if(String(invoice.notes || "").startsWith("COMBINED:")){
        const scope = String(invoice.notes).includes("OVERDUE") ? "المتأخرات" : "كل الاشتراكات";
        if(trader){
            return cleanInvoiceFileName([
                "فاتورة مجمعة",
                scope,
                trader.trader_name || "تاجر",
                totalPart
            ].join(" - ")) || ("فاتورة-" + invoice.id);
        }
        return cleanInvoiceFileName([
            "فاتورة مجمعة",
            scope,
            customer?.client_name || "عميل",
            totalPart
        ].join(" - ")) || ("فاتورة-" + invoice.id);
    }

    if(invoice.invoice_type === "trader" || trader){
        const customerNames = [...new Set(items.map(function(item){
            return getCustomer(item.customer_id)?.client_name
                || getCustomer(getSubscription(item.subscription_id)?.customer_id)?.client_name
                || item.description
                || "";
        }).filter(Boolean))];
        return cleanInvoiceFileName([
            trader?.trader_name || "تاجر",
            customerNames.join(" - ") || "عملاء",
            totalPart
        ].join(" - ")) || ("فاتورة-" + invoice.id);
    }

    const subscription = getSubscription(invoice.subscription_id);
    const customerName = customer?.client_name
        || getCustomer(subscription?.customer_id)?.client_name
        || "عميل";
    const serviceName = getService(subscription?.app_service_id)?.service_name || "";
    const pageName = subscription?.page_name || "";
    const detail = pageName || serviceName || "اشتراك";

    return cleanInvoiceFileName([
        customerName,
        detail,
        totalPart
    ].filter(Boolean).join(" - ")) || ("فاتورة-" + invoice.id);

}

async function saveFollowup(){

    const data={

        customer_id:
        Number(
            document.getElementById(
                "followCustomer"
            ).value
        ),

        followup_date:
        document.getElementById(
            "followDate"
        ).value,

        followup_type:
        document.getElementById(
            "followType"
        ).value,

        title:
        document.getElementById(
            "followTitle"
        ).value,

        notes:
        document.getElementById(
            "followNotes"
        ).value,

        status:"pending"

    };

    if(!data.customer_id)
        return;

    try{

        const result=
        await db
        .from("followups")
        .insert(data);

        if(result.error)
            throw result.error;

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


async function completeFollowup(id){

    try{

        const result=
        await db
        .from("followups")
        .update({

            status:"completed",

            completed_at:
            new Date().toISOString()

        })
        .eq("id",id);

        if(result.error)
            throw result.error;

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

/* =========================================
   CUSTOMER PORTAL
========================================= */

async function openCustomerPortal(customerId){

    try{

        const customer = getCustomer(customerId);

        if(!customer){
            showToast("العميل غير موجود", true);
            return;
        }


        /* البحث عن رابط فعال */

        let result = await db
            .from("customer_portal_tokens")
            .select("id,token,is_active")
            .eq("customer_id", customerId)
            .eq("is_active", true)
            .order("id", {ascending:false})
            .limit(1);

        if(result.error)
            throw result.error;


        let token = result.data?.[0];


        /* إنشاء رابط لو مش موجود */

        if(!token){

            const newToken =
                crypto.randomUUID().replace(/-/g,"") +
                crypto.randomUUID().replace(/-/g,"");


            result = await db
                .from("customer_portal_tokens")
                .insert({
                    customer_id: customerId,
                    token: newToken,
                    is_active: true
                })
                .select()
                .single();


            if(result.error)
                throw result.error;


            token = result.data;

        }


        const portalUrl =
            new URL(
                "client.html",
                window.location.href
            ).href
            +
            "?token="
            +
            encodeURIComponent(token.token);


        openModal(

            "رابط بوابة العميل",

            `
            <div>

                <div style="
                    margin-bottom:10px;
                    color:var(--muted);
                ">
                    العميل
                </div>

                <h3 style="
                    margin-top:0;
                    color:var(--gold2);
                ">
                    ${esc(customer.client_name)}
                </h3>


                <div style="
                    background:var(--panel2);
                    border:1px solid var(--border);
                    border-radius:10px;
                    padding:12px;
                    word-break:break-all;
                    direction:ltr;
                    text-align:left;
                    margin-bottom:15px;
                ">
                    ${esc(portalUrl)}
                </div>


                <div style="
                    display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:8px;
                ">

                    <button
                        class="gold-btn"
                        onclick="
                            copyCustomerPortal(
                                '${portalUrl}'
                            )
                        "
                    >
                        <i class="fa-solid fa-copy"></i>
                        نسخ الرابط
                    </button>


                    <button
                        class="ghost-btn"
                        onclick="
                            window.open(
                                '${portalUrl}',
                                '_blank'
                            )
                        "
                    >
                        <i class="fa-solid fa-link"></i>
                        فتح البوابة
                    </button>


                    <button
                        class="ghost-btn"
                        onclick="
                            sendPortalWhatsApp(
                                ${customerId},
                                '${portalUrl}'
                            )
                        "
                    >
                        <i class="fa-brands fa-whatsapp"></i>
                        إرسال واتساب
                    </button>


                    <button
                        class="red-btn"
                        onclick="
                            deactivateCustomerPortal(
                                ${customerId}
                            )
                        "
                    >
                        <i class="fa-solid fa-link-slash"></i>
                        إلغاء الرابط
                    </button>

                </div>

            </div>
            `,

            `
            <button
                class="ghost-btn"
                onclick="closeModal()"
            >
                إغلاق
            </button>
            `

        );


    }catch(error){

        console.error(error);

        showToast(
            "حدث خطأ: " + error.message,
            true
        );

    }

}

/* =========================================
   PORTAL WHATSAPP MESSAGES
========================================= */

function buildPortalMessage(template, values){

    return String(template || "").replace(
        /{{(client_name|trader_name|portal_link|company_name)}}/g,
        function(_, key){
            return values[key] ?? "";
        }
    );

}

function openWhatsAppBusiness(number, message){

    number = whatsappNumber(number);

    if(!number){
        showToast(
            state.lang==="ar"
            ?"رقم الهاتف غير صحيح"
            :"Invalid phone number",
            true
        );
        return;
    }

    const encodedMessage =
        encodeURIComponent(String(message || ""));

    const normalUrl =
        "https://wa.me/"
        + number
        + "?text="
        + encodedMessage;

    /*
       افتح واتساب من نفس ضغطة المستخدم.
       استخدام location بدل window.open يمنع
       مشكلة حظر النوافذ المنبثقة في Chrome.
    */
    if(/Android/i.test(navigator.userAgent)){

        const businessIntent =
            "intent://send"
            + "?phone=" + number
            + "&text=" + encodedMessage
            + "#Intent;"
            + "scheme=whatsapp;"
            + "package=com.whatsapp.w4b;"
            + "end";

        let fallbackTimer = setTimeout(
            function(){
                window.location.href = normalUrl;
            },
            1500
        );

        try{
            window.location.href = businessIntent;
        }catch(error){
            clearTimeout(fallbackTimer);
            window.location.href = normalUrl;
        }

    }else{

        window.location.href = normalUrl;

    }

}


/* إرسال رابط العميل على واتساب */

async function sendPortalWhatsApp(customerId, link){

    const customer = getCustomer(customerId);

    if(!customer){
        showToast("العميل غير موجود", true);
        return;
    }

    const customerPhone=customer.phone||customer.whatsapp||customer.whatsapp_number||customer.mobile||customer.phone_number||"";
    if(!customerPhone){
        showToast("لا يوجد رقم هاتف محفوظ للعميل", true);
        return;
    }

    let template = "";

    try{
        const result =
            await db
            .from("app_settings")
            .select("setting_value,updated_at")
            .eq("setting_key","wa_customer_portal")
            .order("updated_at",{ascending:false})
            .limit(1);

        if(result.error)
            throw result.error;

        template =
            result.data?.[0]?.setting_value
            || state.settings.wa_customer_portal
            || "";
    }catch(error){
        template = state.settings.wa_customer_portal || "";
    }

    if(!template){
        template =
            "السلام عليكم {{client_name}}\n\nيمكنك متابعة اشتراكاتك والمدفوعات الخاصة بك من خلال بوابة العميل:\n\n{{portal_link}}\n\nBADGEIFY";
    }

    const message = buildPortalMessage(
        template,
        {
            client_name: customer.client_name || "",
            trader_name: "",
            portal_link: link,
            company_name: state.settings.company_name || "BADGEIFY"
        }
    );

    openWhatsAppBusiness(customerPhone, message);

}

/* /* إلغاء رابط العميل */

async function deactivateCustomerPortal(customerId){

    if(
        !confirm(
            "هل تريد إلغاء تفعيل رابط العميل؟"
        )
    ){
        return;
    }


    try{

        const result =
            await db
            .from("customer_portal_tokens")
            .update({
                is_active:false
            })
            .eq("customer_id",customerId)
            .eq("is_active",true);


        if(result.error)
            throw result.error;


        closeModal();

        showToast(
            "تم إلغاء تفعيل رابط العميل"
        );


    }catch(error){

        console.error(error);

        showToast(
            "حدث خطأ: " + error.message,
            true
        );

    }

}

async function saveCompanySettings(){

    const values={

        company_name:
        document.getElementById(
            "settingCompanyName"
        ).value,

        company_phone:
        document.getElementById(
            "settingCompanyPhone"
        ).value,

        company_whatsapp:
        document.getElementById(
            "settingCompanyWhatsapp"
        ).value,

        currency:
        document.getElementById(
            "settingCurrency"
        ).value

    };

    try{

        for(
            const [key,value]
            of Object.entries(values)
        ){

            const result=
            await db
            .from("app_settings")
            .upsert(
                {
                    setting_key:key,
                    setting_value:value,
                    updated_at:
                    new Date().toISOString()
                },
                {
                    onConflict:"setting_key"
                }
            );

                throw result.error;

        }

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

function loanPerson(id){return (state.loanPeople||[]).find(x=>String(x.id)===String(id))||null;}
function loanDirection(loan){return String(loan?.loan_type||loan?.loan_direction||'lent')==='borrowed'?'borrowed':'lent';}
function loanDirectionLabel(loan){return loanDirection(loan)==='borrowed'?'فلوس مستلفها':'فلوس مسلفها';}
function loanPaid(loanId){return (state.loanPayments||[]).filter(x=>String(x.loan_id)===String(loanId)).reduce((s,x)=>s+Number(x.amount||0),0);}
function loanRemaining(loan){return Math.max(0,Number(loan?.amount||0)-loanPaid(loan?.id));}
function loanStatusText(loan){
 const rem=loanRemaining(loan);
 if(rem<=0)return 'مسدد';
 if(loan?.due_date && String(loan.due_date)<isoDate(new Date()))return 'متأخر';
 return loanPaid(loan?.id)>0?'مسدد جزئي':'مفتوح';
}

function financeAccount(type){return (state.financeAccounts||[]).find(x=>x.account_type===type)||null;}
function financeBalance(id){
 const a=(state.financeAccounts||[]).find(x=>String(x.id)===String(id));
 if(!a)return 0;
 const tx=(state.financeTransactions||[]).filter(x=>String(x.account_id)===String(id));
 // الرصيد الافتتاحي محفوظ في الحساب نفسه، لذلك نتجاهل أي قيود افتتاحية قديمة
 // تم إنشاؤها في النسخة السابقة حتى لا يتضاعف الرصيد.
 const movements=tx.filter(x=>x.source_type!=='opening_balance'&&x.source_type!=='opening_balance_reset');
 return Number(a.opening_balance||0)+movements.reduce((s,x)=>s+Number(x.amount||0),0);
}
async function syncSalehPayment(amount,paymentId,customerId,traderId,method,date,notes,customerName){
    const map={cash:'cash',vodafone_cash:'vodafone_cash',instapay:'instapay'};
    const type=map[String(method||'').toLowerCase()];
    if(!type) return {ok:true,skipped:true};

    try{
        if(!currentUser?.id) throw new Error('لم يتم التعرف على مستخدم لوحة صالح.');

        // نبحث في قاعدة البيانات مباشرة، لأن state قد تكون قديمة.
        let accountQuery=await db
            .from('personal_finance_accounts')
            .select('*')
            .eq('user_id',currentUser.id)
            .eq('account_type',type)
            .maybeSingle();

        if(accountQuery.error) throw accountQuery.error;

        let a=accountQuery.data;

        if(!a){
            const accountName=
                type==='cash' ? 'الكاش / الجيب' :
                type==='vodafone_cash' ? 'Vodafone Cash' :
                'InstaPay';

            const created=await db
                .from('personal_finance_accounts')
                .insert({
                    user_id:currentUser.id,
                    account_name:accountName,
                    account_type:type,
                    opening_balance:0
                })
                .select('*')
                .single();

            // لو الحساب اتعمل في نفس اللحظة من جلسة أخرى، نعيد قراءته.
            if(created.error){
                const retry=await db
                    .from('personal_finance_accounts')
                    .select('*')
                    .eq('user_id',currentUser.id)
                    .eq('account_type',type)
                    .maybeSingle();

                if(retry.error || !retry.data) throw created.error;
                a=retry.data;
            }else{
                a=created.data;
            }
        }

        const existing=await db
            .from('personal_finance_transactions')
            .select('id,account_id,amount')
            .eq('user_id',currentUser.id)
            .eq('source_type','subscription_payment')
            .eq('source_id',String(paymentId))
            .maybeSingle();

        if(existing.error) throw existing.error;

        if(existing.data){
            return {ok:true,duplicate:true};
        }

        const payload={
            user_id:currentUser.id,
            account_id:a.id,
            amount:Number(amount),
            transaction_type:'income',
            category:'مقبوضات العمل',
            description:'مبلغ مستلم من '+(customerName||'عميل'),
            source_type:'subscription_payment',
            source_id:String(paymentId),
            customer_id:customerId||null,
            trader_id:traderId||null,
            payment_id:paymentId||null,
            payment_method:String(method),
            transaction_date:date||isoDate(new Date()),
            notes:notes||null
        };

        let inserted=await db
            .from('personal_finance_transactions')
            .insert(payload)
            .select('id')
            .single();

        if(inserted.error){
            // لو حصل رفض بسبب ربط customer_id / trader_id من نوع مختلف،
            // نعيد المحاولة بدون حقول الربط الاختيارية. الحركة المالية نفسها
            // تظل مرتبطة بالدفعة عن طريق source_type + source_id + payment_id.
            const fallbackPayload={...payload};
            delete fallbackPayload.customer_id;
            delete fallbackPayload.trader_id;

            const fallback=await db
                .from('personal_finance_transactions')
                .insert(fallbackPayload)
                .select('id')
                .single();

            if(!fallback.error){
                return {ok:true,id:fallback.data?.id,fallback:true};
            }

            // في حالة أن الحركة أضيفت بالفعل من محاولة سابقة، لا نعتبرها فشلًا.
            const check=await db
                .from('personal_finance_transactions')
                .select('id,account_id,amount')
                .eq('user_id',currentUser.id)
                .eq('source_type','subscription_payment')
                .eq('source_id',String(paymentId))
                .maybeSingle();

            if(!check.error && check.data){
                return {ok:true,duplicate:true};
            }

            const firstError=inserted.error?.message||String(inserted.error);
            const fallbackError=fallback.error?.message||String(fallback.error);
            throw new Error(firstError+" | إعادة المحاولة: "+fallbackError);
        }

        return {ok:true,id:inserted.data?.id};
    }catch(e){
        console.error('Saleh Finance payment sync:',e);
        return {
            ok:false,
            error:e,
            message:e?.message||'تعذر تسجيل الحركة المالية'
        };
    }
}

async function syncSalehPaymentEdit(paymentId,amount,date,notes){
    try{
        const {data:authData,error:authError}=await db.auth.getSession();
        if(authError) throw authError;
        const userId=authData?.session?.user?.id||currentUser?.id;
        if(!userId) throw new Error('جلسة الدخول غير متاحة لمزامنة الحركة المالية.');

        const lookup=await db.from('personal_finance_transactions')
            .select('id,source_type,amount,notes')
            .eq('user_id',userId)
            .eq('source_id',String(paymentId))
            .in('source_type',['subscription_payment','platform_deduction']);
        if(lookup.error) throw lookup.error;
        const rows=lookup.data||[];
        if(!rows.length) return {ok:true,skipped:true};

        for(const row of rows){
            const isPlatform=row.source_type==='platform_deduction';
            let updatedNotes=notes||null;
            if(isPlatform){
                let metadata={};
                try{
                    const parsed=JSON.parse(row.notes||'{}');
                    if(parsed&&typeof parsed==='object'&&!Array.isArray(parsed)) metadata=parsed;
                    else if(row.notes) metadata={legacy_notes:row.notes};
                }catch(_){
                    if(row.notes) metadata={legacy_notes:row.notes};
                }
                metadata.notes=notes||'';
                metadata.currency=metadata.currency||'USDT';
                updatedNotes=JSON.stringify(metadata);
            }

            const update=await db.from('personal_finance_transactions')
                .update({
                    amount:isPlatform?-Math.abs(Number(amount)):Math.abs(Number(amount)),
                    transaction_date:date,
                    notes:updatedNotes,
                    updated_at:new Date().toISOString()
                })
                .eq('user_id',userId)
                .eq('id',row.id);
            if(update.error) throw update.error;
        }
        return {ok:true,updated:rows.length};
    }catch(e){
        console.error('Saleh Finance payment edit sync:',e);
        return {ok:false,error:e,message:e?.message||'تعذر مزامنة الحركة المالية'};
    }
}

window.saveSalehTransactionEdit=async function(){
 try{
  const row=window.salehEditingTransaction;
  const {data:authData,error:authError}=await db.auth.getSession();
  if(authError)throw authError;
  const userId=authData?.session?.user?.id||currentUser?.id||null;
  if(!row)throw new Error('تعذر تحديد الحركة. اقفل نافذة التعديل وافتح الحركة من سجل الحركات مرة أخرى.');
  if(!userId)throw new Error('جلسة الدخول غير متاحة في Supabase. سجّل الدخول مرة أخرى.');
  const amount=Number(document.getElementById('salehEditTxAmount')?.value||0);
  const account=document.getElementById('salehEditTxAccount')?.value;
  const date=document.getElementById('salehEditTxDate')?.value;
  const category=document.getElementById('salehEditTxCategory')?.value.trim()||'حركة مالية';
  const description=document.getElementById('salehEditTxDescription')?.value.trim()||category;
  const notes=document.getElementById('salehEditTxNotes')?.value||'';
  if(!Number.isFinite(amount)||amount<=0||!account||!date)throw new Error('أدخل مبلغًا صحيحًا واختر الحساب والتاريخ.');
  const base={transaction_date:date,category,description,notes};
  if(row.source_type==='maksab_tax')throw new Error('لتعديل إيداع مكسب، افتح طرف التحويل المرتبط به؛ لا تعدّل سطر الضريبة منفردًا.');
  if(row.transaction_type==='transfer'&&row.source_id){
   const q=await db.from('personal_finance_transactions').select('id,amount,account_id,source_type,notes').eq('user_id',userId).eq('source_id',row.source_id);
   if(q.error)throw q.error;
   if((q.data||[]).length<2)throw new Error('لم يتم العثور على طرفي التحويل؛ لم يتم حفظ أي تغيير.');
   const rows=q.data||[],taxRow=rows.find(part=>part.source_type==='maksab_tax'),transferRows=rows.filter(part=>part.source_type==='transfer');
   if(transferRows.length<2)throw new Error('لم يتم العثور على طرفي التحويل؛ لم يتم حفظ أي تغيير.');
   const isMaksabDeposit=!!taxRow||rows.some(part=>{try{return JSON.parse(part.notes||'{}').kind==='maksab_deposit';}catch(_e){return false;}});
   const tax=isMaksabDeposit?5:0,net=amount-tax;
   if(isMaksabDeposit&&net<=0)throw new Error('مبلغ إيداع مكسب يجب أن يكون أكبر من 5 جنيه.');
   for(const part of transferRows){
    const payload={...base,amount:Number(part.amount)<0?-Math.abs(isMaksabDeposit?net:amount):Math.abs(isMaksabDeposit?net:amount)};
    if(String(part.id)===String(row.id))payload.account_id=account;
    if(isMaksabDeposit)payload.notes=JSON.stringify({kind:'maksab_deposit',gross_amount:amount,tax_amount:tax,net_amount:net,detail:notes||''});
    const upd=await db.from('personal_finance_transactions').update(payload).eq('id',part.id).eq('user_id',userId);
    if(upd.error)throw upd.error;
   }
   if(taxRow){
    const sourcePart=transferRows.find(part=>Number(part.amount)<0);
    const sourceAccountId=String(row.id)===String(sourcePart?.id)?account:(sourcePart?.account_id||taxRow.account_id);
    const taxUpdate=await db.from('personal_finance_transactions').update({account_id:sourceAccountId,amount:-tax,transaction_date:date,category:'ضريبة مكسب',description:'ضريبة إيداع مكسب (ثابتة 5 جنيه)',notes:JSON.stringify({kind:'maksab_fixed_tax',gross_amount:amount,tax_amount:tax,net_amount:net,related_transfer_id:row.source_id}),updated_at:new Date().toISOString()}).eq('id',taxRow.id).eq('user_id',userId);
    if(taxUpdate.error)throw taxUpdate.error;
   }
  }else{
   const signedAmount=row.transaction_type==='expense'?-Math.abs(amount):Number(row.amount)<0?-Math.abs(amount):Math.abs(amount);
   const upd=await db.from('personal_finance_transactions').update({...base,account_id:account,amount:signedAmount}).eq('id',row.id).eq('user_id',userId);
   if(upd.error)throw upd.error;
  }
  closeModal();await refresh();showToast('تم تعديل الحركة المالية.');
 }catch(e){console.error('save finance transaction edit',e);showToast(e.message||'تعذر حفظ تعديل الحركة.',true);}
};

window.deleteSalehTransaction=async function(transactionId){
 try{
  const {data:authData,error:authError}=await db.auth.getSession();
  if(authError)throw authError;
  const userId=authData?.session?.user?.id||currentUser?.id||null;
  if(!userId)throw new Error('جلسة الدخول غير متاحة في Supabase. سجّل الدخول مرة أخرى.');
  let row=(state.financeTransactions||[]).find(x=>String(x.id)===String(transactionId));
  if(!row){
   const lookup=await db.from('personal_finance_transactions').select('*').eq('user_id',userId).eq('id',transactionId).maybeSingle();
   if(lookup.error)throw lookup.error;
   row=lookup.data||null;
  }
  if(!row)throw new Error('الحركة غير موجودة. حدّث سجل الحركات وافتحه مرة أخرى.');
  const linked=(String(row.transaction_type||'')==='transfer'||row.source_type==='maksab_tax')&&row.source_id;
  const detail=linked?'سيتم حذف طرفي التحويل المرتبطين معًا حتى يرجع الرصيد في الحسابين.':'سيتم حذف سجل الحركة المحدد وتحديث الرصيد.';
  if(!confirm('هل تريد حذف الحركة «'+String(row.description||row.category||'حركة مالية')+'»؟\n'+detail+'\nلا يمكن التراجع عن الحذف.'))return;
  let q;
  if(linked){
   q=await db.from('personal_finance_transactions').delete().eq('user_id',userId).eq('source_id',row.source_id).in('source_type',['transfer','maksab_tax']);
  }else if(row.source_type==='platform_deduction'&&row.source_id){
   q=await db.from('personal_finance_transactions').delete().eq('user_id',userId).eq('source_type','platform_deduction').eq('source_id',row.source_id);
  }else{
   q=await db.from('personal_finance_transactions').delete().eq('user_id',userId).eq('id',row.id);
  }
  if(q.error)throw q.error;
  if(typeof loadFinanceData==='function')await loadFinanceData();
  if(typeof renderPersonalFinance==='function')renderPersonalFinance();
  showToast('تم حذف الحركة وتحديث الأرصدة.');
 }catch(e){console.error('delete finance transaction',e);showToast(e.message||'تعذر حذف الحركة.',true);}
};

async function refresh(retriedAfterJwt=false){

    let refreshStep="تحميل بيانات الموقع";
    try{

        await loadData();
        refreshStep="تحميل بيانات لوحة صالح";
        await loadFinanceData();
        refreshStep="تحميل بيانات السلف";
        await loadLoanData();

        refreshStep="عرض الصفحة وتحديث العناصر";
        render();

        refreshStep="تحديث الإشعارات";
        updateNotificationUI();

        setTimeout(function(){
            showAutomaticDueNotifications().catch(function(error){
                console.warn("BADGEIFY notification check:",error);
            });
        },300);

    }catch(error){
        const errorMessage=error?.message||String(error);
        if(/JWT issued at future/i.test(errorMessage)&&!retriedAfterJwt){
            try{
                const refreshed=await db.auth.refreshSession();
                if(refreshed.error)throw refreshed.error;
                const session=refreshed.data?.session;
                if(!session?.user?.id)throw new Error("تعذر تجديد جلسة الدخول.");
                currentUser=session.user;
                console.warn("BADGEIFY: refreshed session after JWT issued at future; retrying data load once.");
                return await refresh(true);
            }catch(sessionError){
                console.error("BADGEIFY JWT recovery failed:",sessionError);
                showToast("تعذر تجديد جلسة الدخول بعد خطأ توقيت JWT. تأكد من ضبط ساعة الجهاز تلقائيًا ثم سجّل الدخول من جديد.",true);
                return;
            }
        }
        console.error("BADGEIFY refresh failed at:",refreshStep,error);
        showToast("خطأ أثناء "+refreshStep+": "+errorMessage,true);
    }

}

function urlBase64ToUint8Array(base64String){
    const padding="=".repeat((4-base64String.length%4)%4);
    const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
    const rawData=atob(base64);
    return Uint8Array.from([...rawData].map(char=>char.charCodeAt(0)));
}

function getSubscriptionDueDate(sub){
    if(!sub) return null;
    if(sub.due_date) return new Date(sub.due_date+"T00:00:00");

    const day=Number(sub.payment_day||0);
    if(!day) return null;

    const now=new Date();
    const d=new Date(now.getFullYear(),now.getMonth(),day);
    if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate())){
        d.setMonth(d.getMonth()+1);
    }
    return d;
}

function getSubscriptionAlertState(sub){
    if(!sub || String(sub.status||"").toLowerCase()==="paid") return null;

    const due=getSubscriptionDueDate(sub);
    if(!due || Number.isNaN(due.getTime())) return null;

    const today=new Date();
    const a=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const b=new Date(due.getFullYear(),due.getMonth(),due.getDate());
    const diff=Math.round((b-a)/86400000);

    if(diff<0) return {type:"overdue",days:Math.abs(diff)};
    if(diff===0) return {type:"today",days:0};
    if(diff===1) return {type:"tomorrow",days:1};
    if(diff===2) return {type:"two_days",days:2};
    return null;
}

function buildDueAlerts(){
    const alerts=[];
    (state.subscriptions||[]).forEach(function(sub){
        const alert=getSubscriptionAlertState(sub);
        if(!alert) return;

        const customer=getCustomer(sub.customer_id);
        const name=customer?.client_name || "عميل";
        const amount=Number(sub.monthly_fee||0);
        const currency=sub.currency || state.settings.currency || "EGP";

        let body="";
        if(alert.type==="overdue"){
            body=`اشتراك ${name} متأخر عن السداد منذ ${alert.days} يوم.`;
        }else if(alert.type==="today"){
            body=`اشتراك ${name} مستحق السداد اليوم.`;
        }else if(alert.type==="tomorrow"){
            body=`اشتراك ${name} مستحق السداد غدًا.`;
        }else{
            body=`اشتراك ${name} مستحق السداد بعد يومين.`;
        }

        alerts.push({
            id:String(sub.id)+"_"+alert.type,
            title:"تنبيه BADGEIFY",
            body:amount ? body+" المبلغ: "+amount+" "+currency : body
        });
    });
    return alerts;
}

async function showAutomaticDueNotifications(){
    if(!("Notification" in window) || Notification.permission!=="granted") return;

    const alerts=buildDueAlerts().concat(buildLoanAlerts());
    if(!alerts.length) return;

    const sentKey="badgeify_sent_due_notifications_"+new Date().toISOString().slice(0,10);
    const sent=JSON.parse(localStorage.getItem(sentKey)||"[]");
    const reg=await navigator.serviceWorker.ready;

    for(const alert of alerts){
        if(sent.includes(alert.id)) continue;

        if(reg.active){
            reg.active.postMessage({
                type:"SHOW_NOTIFICATION",
                title:alert.title,
                body:alert.body,
                tag:"badgeify-"+alert.id
            });
        }
        sent.push(alert.id);
    }

    localStorage.setItem(sentKey,JSON.stringify(sent));
}

// Keep the Supabase auth callback synchronous; restore the saved session explicitly on startup.
let badgeifyLastSessionUserId = null;
function applyBadgeifySession(session, eventName) {
    const user = session?.user || null;
    // A late INITIAL_SESSION/null callback must not erase a session already restored by getSession().
    // Only an explicit SIGNED_OUT event or the authoritative startup check may clear that state.
    if (!user && eventName !== "SIGNED_OUT" && eventName !== "RESTORE_CHECK" &&
        badgeifyLastSessionUserId && currentUser?.id === badgeifyLastSessionUserId) {
        return;
    }
    currentUser = user;
    if (user) {
        badgeifyLastSessionUserId = user.id;
        document.getElementById("loginView")?.classList.add("hidden");
        document.getElementById("appView")?.classList.remove("hidden");
        // Avoid overlapping refresh calls from INITIAL_SESSION and SIGNED_IN.
        if (!window.__badgeifyRefreshRunning) {
            window.__badgeifyRefreshRunning = true;
            Promise.resolve().then(() => refresh()).catch(err => {
                console.error("BADGEIFY refresh after session restore:", err);
            }).finally(() => { window.__badgeifyRefreshRunning = false; });
        }
    } else {
        if (window.__badgeifyLoginInProgress) return;
        badgeifyLastSessionUserId = null;
        document.getElementById("loginView")?.classList.remove("hidden");
        document.getElementById("appView")?.classList.add("hidden");
    }
}

db.auth.onAuthStateChange(function(event, session) {
    applyBadgeifySession(session, event);
});

// Independent startup check: recover the persisted session even if the initial auth event
// is missed or arrives before the login/app elements are ready.
db.auth.getSession().then(({ data, error }) => {
    if (error) {
        console.error("BADGEIFY session restore failed:", error);
        const msg = document.getElementById("loginMsg");
        if (msg && !currentUser) msg.textContent = "تشخيص الجلسة: تعذرت قراءة الجلسة المحفوظة. افتح Console لو تقدر وابعت صورة الخطأ فقط.";
        return;
    }
    const session = data?.session || null;
    applyBadgeifySession(session, "RESTORE_CHECK");
    if (!session?.user) {
        // Diagnostic only: never read or display the actual token/session contents.
        let savedAuthKeyCount = 0;
        try {
            savedAuthKeyCount = Object.keys(window.localStorage || {}).filter(key => key.includes("auth-token")).length;
        } catch (_) {}
        const msg = document.getElementById("loginMsg");
        if (msg && !currentUser) {
            msg.textContent = savedAuthKeyCount
                ? "تشخيص الجلسة: بيانات دخول محفوظة في المتصفح لكن Supabase لم يسترجع الجلسة. عدد مفاتيح الجلسة: " + savedAuthKeyCount + "."
                : "تشخيص الجلسة: لا يوجد مفتاح جلسة محفوظ في تخزين Chrome بعد التحديث.";
        }
        console.warn("BADGEIFY session diagnostic:", { sessionFound: false, savedAuthKeyCount });
    }
}).catch(err => {
    console.error("BADGEIFY getSession failed:", err);
    const msg = document.getElementById("loginMsg");
    if (msg && !currentUser) msg.textContent = "تشخيص الجلسة: حصل خطأ أثناء استرجاع الجلسة. ابعتلي صورة الرسالة الظاهرة.";
});

<script id="badgeify-session-visible-diagnostic">
(function () {
  const msg = document.getElementById("loginMsg");
  let startupCheckFinished = false;
  let lastRestoredUserId = null;

  function showApp(user) {
    if (!user) return;
    try { currentUser = user; } catch (_) {}
    lastRestoredUserId = user.id || null;
    document.getElementById("loginView")?.classList.add("hidden");
    document.getElementById("appView")?.classList.remove("hidden");
    if (!window.__badgeifyRefreshRunning && typeof refresh === "function") {
      window.__badgeifyRefreshRunning = true;
      Promise.resolve().then(() => refresh()).catch(error => {
        console.error("BADGEIFY session UI recovery refresh failed:", error);
      }).finally(() => { window.__badgeifyRefreshRunning = false; });
    }
  }

  function showLogin() {
    document.getElementById("loginView")?.classList.remove("hidden");
    document.getElementById("appView")?.classList.add("hidden");
  }

  async function restoreSessionUI() {
    try {
      if (typeof db === "undefined" || !db || !db.auth) {
        if (msg) msg.textContent = "التشخيص: كود تسجيل الدخول الرئيسي لم يكتمل تشغيله. ابعتلي صورة الصفحة بعد التحديث.";
        return;
      }
      const result = await db.auth.getSession();
      startupCheckFinished = true;
      if (result.error) {
        if (msg) msg.textContent = "التشخيص: Supabase رجّع خطأ أثناء استرجاع الجلسة. ابعتلي صورة الخطأ فقط.";
        console.error("BADGEIFY session UI recovery:", result.error);
        return;
      }

      const session = result.data?.session || null;
      if (session?.user) {
        showApp(session.user);
        if (msg) msg.textContent = "تم استرجاع جلسة الدخول المحفوظة.";
        console.info("BADGEIFY restored saved session and corrected the login screen.");
        return;
      }

      let savedCount = 0;
      try {
        savedCount = Object.keys(window.localStorage || {}).filter(key => key.includes("auth-token")).length;
      } catch (_) {}
      if (msg) {
        msg.textContent = savedCount
          ? "التشخيص: فيه مفتاح جلسة محفوظ في Chrome لكن Supabase لم يسترجع جلسة. عدد المفاتيح: " + savedCount + "."
          : "التشخيص: لا يوجد مفتاح جلسة محفوظ في Chrome بعد التحديث.";
      }
      showLogin();
    } catch (error) {
      startupCheckFinished = true;
      if (msg) msg.textContent = "التشخيص: حصل خطأ أثناء استرجاع الجلسة. ابعتلي صورة الرسالة دي.";
      console.error("BADGEIFY session UI recovery failed:", error);
    }
  }

  // A late null INITIAL_SESSION event must not override a session restored by getSession().
  try {
    db.auth.onAuthStateChange(function (event, session) {
      if (session?.user) {
        showApp(session.user);
      } else if (event === "SIGNED_OUT") {
        lastRestoredUserId = null;
        showLogin();
      } else if (!startupCheckFinished) {
        // Wait for the explicit startup getSession() check before showing login.
      }
    });
  } catch (error) {
    console.warn("BADGEIFY session UI recovery listener could not start:", error);
  }

  if (msg) msg.textContent = "جاري استرجاع جلسة الدخول...";
  window.setTimeout(restoreSessionUI, 250);
})();
</script>

  window.saveSalehPersonLoanEdit=async function(id){
    try{
      if(!currentUser||!currentUser.id)throw new Error('جلسة الدخول غير موجودة؛ سجّل الدخول مرة أخرى.');
      const l=(state.loans||[]).find(x=>String(x.id)===String(id));if(!l)throw new Error('عملية السلفة غير موجودة.');
      const amount=Number(document.getElementById('personLoanEditAmount')?.value||0);
      const direction=document.getElementById('personLoanEditDirection')?.value;
      const account=document.getElementById('personLoanEditAccount')?.value;
      const date=document.getElementById('personLoanEditDate')?.value||isoDate(new Date());
      const purpose=document.getElementById('personLoanEditPurpose')?.value.trim()||null;
      const notes=document.getElementById('personLoanEditNotes')?.value||null;
      const paid=(state.loanPayments||[]).filter(x=>String(x.loan_id)===String(id)).reduce((n,x)=>n+Number(x.amount||0),0);
      if(!Number.isFinite(amount)||amount<=0||amount<paid)throw new Error('المبلغ يجب أن يكون موجبًا ولا يقل عن إجمالي المسدد/المحصل ('+money(paid)+').');
      if(!['lent','borrowed'].includes(direction)||!account)throw new Error('اختر نوع العملية والحساب.');
      const txs=await personLedgerTx('loan',id);if(!txs.length)throw new Error('لم يتم العثور على قيد رصيد الحساب المرتبط؛ لم يتم تعديل أي بيانات لتجنب اختلاف الرصيد.');
      const person=loanPerson(l.person_id),borrowed=direction==='borrowed';
      const txPatch={account_id:account,amount:borrowed?Math.abs(amount):-Math.abs(amount),transaction_type:'adjustment',category:borrowed?'استلام سلفة':'إعطاء سلفة',description:(borrowed?'مبلغ مستلف من ':'مبلغ مسلف لـ ')+(person?.person_name||'شخص'),transaction_date:date,notes,updated_at:new Date().toISOString()};
      for(const tx of txs){const u=await db.from('personal_finance_transactions').update(txPatch).eq('id',tx.id).eq('user_id',currentUser.id);if(u.error)throw u.error;}
      const status=paid>=amount?'paid':paid>0?'partially_paid':'open';
      const u=await db.from('personal_finance_loans').update({amount,loan_type:direction,loan_direction:direction,wallet_account_id:account,loan_date:date,purpose,notes,status}).eq('id',id).eq('user_id',currentUser.id);
      if(u.error)throw u.error;
      closeModal();await refresh();showToast('تم تعديل العملية وتحديث رصيد الحساب.');window.openSalehPersonStatement(l.person_id);
    }catch(e){personLedgerToast(e);}
  };
  window.deleteSalehPersonLoan=async function(id){
    try{
      if(!currentUser||!currentUser.id)throw new Error('جلسة الدخول غير موجودة؛ سجّل الدخول مرة أخرى.');
      const l=(state.loans||[]).find(x=>String(x.id)===String(id));if(!l)throw new Error('عملية السلفة غير موجودة.');
      if((state.loanPayments||[]).some(x=>String(x.loan_id)===String(id)))throw new Error('لا يمكن إزالة أصل السلفة قبل إزالة عمليات السداد/التحصيل المرتبطة بها من الكشف.');
      const isRecharge=String(l.purpose||'').includes('شحن رصيد موبايل للعميل [شحن آجل]');
      if(!confirm(isRecharge?'تأكيد حذف مديونية شحن الرصيد؟ سيتم حذف قيد المديونية، مع محاولة حذف حركات الشحن المرتبطة بها.':'تأكيد إزالة أصل السلفة؟ سيتم حذف قيدها المرتبط برصيد الحساب أيضًا.'))return;
      const txs=await personLedgerTx('loan',id);
      if(!txs.length&&!isRecharge)throw new Error('لم يتم العثور على قيد رصيد الحساب؛ لم يتم حذف أي شيء.');
      for(const tx of txs){const d=await db.from('personal_finance_transactions').delete().eq('id',tx.id).eq('user_id',currentUser.id);if(d.error)throw d.error;}
      // Recharge debts do not use the normal loan ledger entry. Find any matching collected-income row that records this loan ID, then remove both transaction rows by their shared source ID.
      if(isRecharge){
        const linked=await db.from('personal_finance_transactions').select('id,source_id,source_type').eq('user_id',currentUser.id).eq('source_type','mobile_recharge').ilike('notes','%'+String(id)+'%');
        if(linked.error)throw linked.error;
        const sourceIds=[...new Set((linked.data||[]).map(x=>x.source_id).filter(Boolean))];
        for(const sid of sourceIds){
          const del=await db.from('personal_finance_transactions').delete().eq('user_id',currentUser.id).eq('source_type','mobile_recharge').eq('source_id',sid);
          if(del.error)throw del.error;
        }
      }
      const d=await db.from('personal_finance_loans').delete().eq('id',id).eq('user_id',currentUser.id);if(d.error)throw d.error;
      await refresh();showToast('تم حذف العملية وتحديث الرصيد.');window.openSalehPersonStatement(l.person_id);
    }catch(e){personLedgerToast(e);}
  };
