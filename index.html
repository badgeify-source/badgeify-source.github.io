    const outstanding=(state.loans||[]).filter(l=>String(l.person_id)===String(personId)&&l.status!=='cancelled'&&loanDirection(l)==='lent'&&loanRemaining(l)>0);
    if(!outstanding.length){
      showToast('لا توجد سلفة مسجلة لك عند هذا الشخص عليها مبلغ متبقٍ. لو دي فلوس جديدة استلفتها منه، اختر «أنا استلفت منه فلوس».',true);
      return;
    }
    if(outstanding.length===1){openLoanRepayment(outstanding[0].id);return;}
    const options=outstanding.map(l=>'<option value="'+esc(l.id)+'">'+esc(l.purpose||l.notes||'سلفة')+' — المتبقي '+money(loanRemaining(l))+' '+esc(cur())+' — '+esc(l.loan_date||'بدون تاريخ')+'</option>').join('');
    const body='<div class="form-grid"><div class="field full"><label>اختار السلفة اللي رجّع منها فلوس</label><select id="personCollectLoanId">'+options+'</select></div><p class="muted">المبلغ اللي هتدخله هيتسجل تحصيلًا من السلفة المختارة، ويقلل المتبقي منها.</p></div>';
    openModal('استلام مبلغ من الشخص',body,'<button type="button" class="ghost-btn" onclick="closeModal()">إلغاء</button><button type="button" class="gold-btn" onclick="continuePersonCollectPayment()">متابعة التحصيل</button>');
  };
  window.continuePersonCollectPayment=function(){
    const id=document.getElementById('personCollectLoanId')?.value;
    const loan=(state.loans||[]).find(l=>String(l.id)===String(id));
    if(!loan||loanDirection(loan)!=='lent'||loanRemaining(loan)<=0){showToast('السلفة المختارة غير صالحة للتحصيل.',true);return;}
    closeModal();
    openLoanRepayment(loan.id);
  };

  window.sendSalehPersonWhatsApp=function(personId){
    const p=loanPerson(personId);if(!p)return showToast('الشخص غير موجود.',true);
    const phone=digitsForWhatsApp(p.phone);
    if(!phone||phone.length<10||phone.length>15)return showToast('أضف رقم موبايل صحيح للشخص أولًا، ثم افتح كشف الحساب واضغط واتساب.',true);
    const t=totals(personId),c=cur(),loans=t.loans;
    const lines=['كشف حساب: '+(p.person_name||'الشخص'),'تاريخ الكشف: '+isoDate(new Date()),'','فلوس ليا عنده: '+money(t.lent)+' '+c,'فلوس عليا له: '+money(t.borrowed)+' '+c,'الصافي: '+money(Math.abs(t.net))+' '+c+' ('+(t.net>0?'ليا عنده':t.net<0?'عليا له':'الحساب متساوي')+')','','تفاصيل الحركات:'];
    if(!loans.length)lines.push('لا توجد حركات مالية مسجلة حتى الآن.');
    loans.forEach(l=>{
      const lent=loanDirection(l)==='lent',paid=loanPaid(l.id),rem=loanRemaining(l);
      lines.push('- '+(l.loan_date||'-')+' | '+(lent?'أعطيته فلوس (ليا عنده)':'أخذت منه فلوس (عليا له)')+' | أصل: '+money(l.amount)+' '+c+' | المسدد/المحصل: '+money(paid)+' '+c+' | المتبقي: '+money(rem)+' '+c+(l.purpose?' | '+l.purpose:''));
      (state.loanPayments||[]).filter(x=>String(x.loan_id)===String(l.id)).forEach(x=>lines.push('  • '+(x.payment_date||'-')+' — '+money(x.amount)+' '+c+(x.notes?' — '+x.notes:'')));
    });
    lines.push('','تم إعداد الكشف من نظام الحسابات.');
    const url='https://wa.me/'+phone+'?text='+encodeURIComponent(lines.join('\n'));
    window.open(url,'_blank','noopener');
  };
  window.openSalehLoanForPerson=function(personId,direction){openSalehLoan(personId,direction);};
  window.salehPeopleDirect=window.openSalehPeople;
  const oldRender=window.renderPersonalFinance;
  if(typeof oldRender==='function'){
    window.renderPersonalFinance=function(){
      oldRender.apply(this,arguments);
      if(state.page==='personalFinance')window.renderSalehPeople();
    };
  }
  const oldSaveLoan=window.saveSalehLoan;
  let loanSaving=false;
  if(typeof oldSaveLoan==='function'){
    window.saveSalehLoan=async function(){
      if(loanSaving)return showToast('جاري حفظ السلفة، انتظر لحظة.',true);
      loanSaving=true;
      try{
        const select=document.getElementById('loanPerson')?.value||'';
        const newName=(document.getElementById('loanNewPerson')?.value||'').trim();
        const phone=(document.getElementById('loanPhone')?.value||'').trim();
        if(!select&&newName){
          const q=await db.from('personal_finance_loan_people').select('id,person_name,phone').eq('user_id',currentUser?.id);
          if(q.error)throw q.error;
          const dup=(q.data||[]).find(p=>normName(p.person_name)===normName(newName)&&normPhone(p.phone)===normPhone(phone));
          if(dup){showToast('الشخص موجود بالفعل. اختره من القائمة بدل إنشاء شخص مكرر.',true);return;}
          if(!phone){showToast('رقم الموبايل مطلوب عند إنشاء شخص جديد من شاشة السلفة.',true);return;}
        }
        return await oldSaveLoan.apply(this,arguments);
      }catch(e){showToast(e.message||'تعذر حفظ السلفة.',true);}
      finally{loanSaving=false;}
    };
  }
  const oldSavePayment=window.saveLoanRepayment;
  let paymentSaving=false;
  if(typeof oldSavePayment==='function'){
    window.saveLoanRepayment=async function(){
      if(paymentSaving)return showToast('جاري حفظ السداد، انتظر لحظة.',true);
      paymentSaving=true;
      try{return await oldSavePayment.apply(this,arguments);}
      finally{paymentSaving=false;}
    };
  }
})();

</script>
<script id="saleh-opening-loan-balances">
(function(){
'use strict';
const tag='[رصيد افتتاحي]';
const escv=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
window.openSalehOpeningBalances=async function(){
 try{
  if(!currentUser?.id)throw new Error('سجّل الدخول أولًا.');
  const [pr,lr]=await Promise.all([
   db.from('personal_finance_loan_people').select('id,person_name').eq('user_id',currentUser.id).order('person_name'),
   db.from('personal_finance_loans').select('id,person_id,loan_direction,amount,wallet_account_id,loan_date,purpose,notes').eq('user_id',currentUser.id).ilike('purpose','%[رصيد افتتاحي]%')
  ]);
  if(pr.error)throw pr.error;if(lr.error)throw lr.error;
  const people=pr.data||[],openings=lr.data||[],accounts=state.financeAccounts||[];
  if(!people.length){showToast('أضف الأشخاص أولًا ثم أدخل أرصدتهم الافتتاحية.',true);return;}
  if(!accounts.length)throw new Error('لا توجد حسابات مالية. افتح قسم الحسابات وحدّث البيانات أولًا.');
  window.salehOpeningRows=openings;window.salehOpeningPeople=people;
  const options=people.map(p=>'<option value="'+escv(p.id)+'">'+escv(p.person_name)+'</option>').join('');
  const body='<div class="finance-modal-shell"><div class="finance-form-intro"><div class="finance-form-icon"><i class="fa-solid fa-scale-balanced"></i></div><div><h4>الأرصدة الافتتاحية للأشخاص</h4><p>اختار شخص واحد من القائمة، وعدّل رصيده القديم فقط. مش هيتم تغيير رصيد الخزنة أو المحافظ.</p></div></div><div class="field"><label>اختار الشخص</label><select id="salehOpeningPerson" onchange="renderSalehOpeningPerson()">'+options+'</select></div><div class="field"><label>حساب مرجعي للسجل فقط (لن يتغير رصيده)</label><select id="salehOpeningAccount">'+accounts.map(a=>'<option value="'+escv(a.id)+'">'+escv(a.account_name)+'</option>').join('')+'</select></div><div id="salehOpeningPersonFields" style="margin-top:12px"></div><div class="muted" style="font-size:12px;margin-top:8px">الأشخاص الآخرون وأرصدتهم لن تتغير إلا عند اختيارهم وتعديلهم بشكل منفصل.</div></div>';
  openModal('الأرصدة الافتتاحية',body,'<button type="button" class="ghost-btn" onclick="closeModal()">إلغاء</button><button type="button" class="gold-btn" onclick="saveSalehOpeningBalances()">حفظ رصيد الشخص</button>');
  renderSalehOpeningPerson();
 }catch(e){console.error('opening balances',e);showToast(e.message||'تعذر فتح الأرصدة الافتتاحية.',true);}
};
window.renderSalehOpeningPerson=function(){
 const id=document.getElementById('salehOpeningPerson')?.value,host=document.getElementById('salehOpeningPersonFields');
 if(!host||!id)return;
 const p=(window.salehOpeningPeople||[]).find(x=>String(x.id)===String(id));
 const lent=(window.salehOpeningRows||[]).find(x=>String(x.person_id)===String(id)&&x.loan_direction==='lent');
 const borrowed=(window.salehOpeningRows||[]).find(x=>String(x.person_id)===String(id)&&x.loan_direction==='borrowed');
 host.innerHTML='<div class="saleh-opening-person-card"><b><i class="fa-solid fa-user-check"></i> '+escv(p?.person_name||'الشخص المحدد')+'</b><div class="form-grid" style="margin-top:12px"><div class="field opening-lent-field"><label>فلوس ليا عنده (جنيه)</label><input type="number" id="salehOpeningLent" min="0" step="0.01" value="'+(lent?Number(lent.amount):0)+'"></div><div class="field opening-borrowed-field"><label>فلوس عليا له (جنيه)</label><input type="number" id="salehOpeningBorrowed" min="0" step="0.01" value="'+(borrowed?Number(borrowed.amount):0)+'"></div></div><small class="muted">اترك الاتجاه اللي مفيهوش رصيد بصفر. ده تسجيل للمديونية القديمة فقط، مش حركة إيداع أو سحب.</small></div>';
};
window.saveSalehOpeningBalances=async function(){
 try{
  if(!currentUser?.id)throw new Error('سجّل الدخول مرة أخرى.');
  const personId=document.getElementById('salehOpeningPerson')?.value;
  const selectedAccount=document.getElementById('salehOpeningAccount')?.value;
  const existingRows=(window.salehOpeningRows||[]).filter(x=>String(x.person_id)===String(personId));
  const account=selectedAccount||existingRows.find(x=>x.wallet_account_id)?.wallet_account_id||(state.financeAccounts||[]).find(x=>x.id!=null)?.id;
  if(!personId)throw new Error('اختار الشخص المراد تعديل رصيده.');
  if(!account)throw new Error('مفيش حساب مرجعي متاح. افتح قسم الحسابات وحدّث البيانات، ثم جرّب مرة أخرى.');
  const lent=Number(document.getElementById('salehOpeningLent')?.value||0),borrowed=Number(document.getElementById('salehOpeningBorrowed')?.value||0);
  if(!Number.isFinite(lent)||!Number.isFinite(borrowed)||lent<0||borrowed<0)throw new Error('تأكد أن الأرصدة أرقام موجبة أو صفر.');
  for(const [direction,amount] of [['lent',lent],['borrowed',borrowed]]){
   const existing=(window.salehOpeningRows||[]).find(x=>String(x.person_id)===String(personId)&&x.loan_direction===direction);
   if(amount===0){if(existing){const del=await db.from('personal_finance_loans').delete().eq('id',existing.id).eq('user_id',currentUser.id);if(del.error)throw del.error;}continue;}
   const payload={user_id:currentUser.id,person_id:personId,loan_type:direction,loan_direction:direction,amount,wallet_account_id:account,loan_date:'2000-01-01',purpose:tag,notes:'رصيد افتتاحي مستقل — لا يؤثر على أرصدة الحسابات المالية'};
   if(existing){const upd=await db.from('personal_finance_loans').update(payload).eq('id',existing.id).eq('user_id',currentUser.id);if(upd.error)throw upd.error;}
   else{const ins=await db.from('personal_finance_loans').insert(payload);if(ins.error)throw ins.error;}
  }
  closeModal();if(typeof refresh==='function')await refresh();if(typeof renderPersonalFinance==='function')renderPersonalFinance();
  showToast('تم حفظ الرصيد الافتتاحي للشخص المحدد دون تغيير أرصدة المحافظ.');
 }catch(e){console.error('save opening balances',e);showToast(e.message||'تعذر حفظ الرصيد الافتتاحي.',true);}
};
})();
</script>

<script id="badgeify-login-emergency-handler">
(function () {
  function install() {
    const btn = document.getElementById("loginBtn");
    if (!btn || btn.dataset.emergencyLoginInstalled === "1") return;
    btn.dataset.emergencyLoginInstalled = "1";
    btn.addEventListener("click", async function (event) {
      event.preventDefault();
      event.stopImmediatePropagation();
      const email = (document.getElementById("loginEmail")?.value || "").trim();
      const password = document.getElementById("loginPassword")?.value || "";
      const msg = document.getElementById("loginMsg");
      const show = value => { if (msg) msg.textContent = value; };
      if (!email || !password) { show("اكتب البريد الإلكتروني وكلمة المرور."); return; }
      btn.disabled = true;
      window.__badgeifyLoginInProgress = true;
      show("جاري تسجيل الدخول...");
      try {
        if (!window.supabase || typeof window.supabase.createClient !== "function") {
          throw new Error("تعذر تحميل خدمة تسجيل الدخول. حدّث الصفحة وجرب مرة أخرى.");
        }
        const client = (typeof db !== "undefined" && db?.auth) ? db : (window.__badgeifyEmergencyClient || (window.__badgeifyEmergencyClient = window.supabase.createClient(
          "https://rsvzachgbqsucqgrwguv.supabase.co",
          "sb_publishable_jn8QNpKQ8v7awUj2wYANdw_wcliO986",
          { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
        )));
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (!data?.session?.user) throw new Error("لم يتم إنشاء جلسة دخول. حاول مرة أخرى.");

        // Confirm the session is actually persisted before allowing the auth UI to change.
        const check = await client.auth.getSession();
        const activeSession = check?.data?.session || data.session;
        if (check?.error) throw check.error;
        if (!activeSession?.user?.id) throw new Error("تم تسجيل الدخول لكن الجلسة لم تُحفظ. حدّث الصفحة وحاول مرة أخرى.");

        try { if (typeof currentUser !== "undefined") currentUser = activeSession.user; } catch (_) {}
        document.getElementById("loginView")?.classList.add("hidden");
        document.getElementById("appView")?.classList.remove("hidden");
        show("تم تسجيل الدخول. جاري تحميل اللوحة...");
        if (typeof refresh === "function") {
          await refresh();
          show("");
        } else {
          show("تم تسجيل الدخول لكن كود تحميل اللوحة لم يعمل. ابعتلي صورة الخطأ من Console.");
        }
        window.__badgeifyLoginInProgress = false;
      } catch (err) {
        window.__badgeifyLoginInProgress = false;
        console.error("BADGEIFY login:", err);
        show(err?.message || "تعذر تسجيل الدخول. حاول مرة أخرى.");
      } finally {
        btn.disabled = false;
      }
    }, true);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", install, { once: true });
  else install();
})();
</script>

<script id="badgeify-official-service-logo-replacer">
(function(){
 const logos={
  instapay:'https://commons.wikimedia.org/wiki/Special:FilePath/InstaPay_Logo.png',
  vodafone:'https://upload.wikimedia.org/wikipedia/commons/7/7a/Vodafone_icon.svg',
  pubg:'https://www.pubgmobile.com/images/event/brandassets/down-logo1.png'
 };
 function addLogo(el,key,alt,cls){
  if(!el||el.querySelector('img.saleh-logo-img'))return;
  const img=document.createElement('img');img.className='saleh-logo-img '+cls;img.src=logos[key];img.alt=alt;img.loading='lazy';
  img.onerror=function(){this.style.display='none';};
  el.insertBefore(img,el.firstChild);
 }
 function replace(){
  document.querySelectorAll('button').forEach(btn=>{
   const t=(btn.textContent||'').trim();
   if(t.includes('شحن ببجي')){const icon=btn.querySelector('i');if(icon)icon.style.display='none';addLogo(btn,'pubg','PUBG Mobile','pubg');}
   if(t.includes('شحن رصيد الموبايل')){const icon=btn.querySelector('i');if(icon)icon.style.display='none';addLogo(btn,'vodafone','شحن رصيد الموبايل','vodafone');}
  });
  document.querySelectorAll('label').forEach(label=>{
   const t=(label.textContent||'').trim();
   if(t==='InstaPay'){label.querySelector('.saleh-instapay-mark')?.remove();addLogo(label,'instapay','InstaPay','instapay');}

window.saveSalehQuickCashEntry=async function(personId,kind){
 try{
  if(!currentUser||!currentUser.id)throw new Error('جلسة الدخول غير موجودة؛ سجّل الدخول مرة أخرى.');
  const p=getPerson(personId);if(!p)throw new Error('الشخص غير موجود.');

  if(!account)throw new Error('اختار الحساب المالي.');

   const l=await db.from('personal_finance_loans').insert({user_id:currentUser.id,person_id:personId,loan_type:'lent',loan_direction:'lent',amount,wallet_account_id:account,loan_date:date,purpose:'حركة كناش: أديته فلوس'}).select('*').single();
   if(l.error)throw l.error;
   const tx=await db.from('personal_finance_transactions').insert({user_id:currentUser.id,account_id:account,amount:-Math.abs(amount),transaction_type:'adjustment',category:'إعطاء سلفة',description:'أديته فلوس — '+p.person_name,source_type:'loan',source_id:String(l.data.id),transaction_date:date,notes:'تسجيل سريع من كناش الشخص'});

   for(const l of loans){

    const st=await db.from('personal_finance_loans').update({status:paid>=Number(l.amount||0)?'paid':'partially_paid'}).eq('id',l.id).eq('user_id',currentUser.id);

    if(tx.error)throw new Error('تم تسجيل أصل الحركة لكن تعذر تحديث رصيد الحساب: '+tx.error.message);
   }
  }
  closeModal();await refresh();showToast('تم تسجيل الحركة وتحديث الحساب.');window.openSalehPersonStatement(personId);
 }catch(e){console.error('saleh quick ledger',e);showToast(e.message||'تعذر تسجيل الحركة.',true);}

  const description=desc||(kind==='income'?'مبلغ مستلم من '+label:'تكلفة '+label);
  if(kind==='expense'){
   const result=await db.from('personal_finance_transactions').insert({user_id:userId,account_id:accountObj.id,amount:-Math.abs(amount),transaction_type:'expense',category:label,description,source_type:sourceType,source_id:sourceId,transaction_date:date,notes:'تكلفة '+label+' — تسجل مرة واحدة.'});
   if(result.error)throw result.error;
   closeModal();await refresh();showToast('تم تسجيل تكلفة '+label);return;
  }
  let paidAmount=amount,personId=null,person=null,status='paid';
  if(!isPubg){
   personId=document.getElementById('salehRechargePerson')?.value||'';
   status=document.getElementById('salehMobilePaymentStatus')?.value||'paid';
   if(!personId)throw new Error('اختار اسم العميل من قسم الأشخاص قبل حفظ شحن الرصيد.');
   const pq=await db.from('personal_finance_loan_people').select('id,person_name,phone').eq('id',personId).eq('user_id',userId).maybeSingle();
   if(pq.error)throw pq.error;
   person=pq.data;
   if(!person)throw new Error('الشخص المحدد غير موجود في حسابك. حدّث القائمة واختاره مرة أخرى.');
   if(!['paid','later','partial'].includes(status))throw new Error('اختار حالة الدفع.');
   paidAmount=status==='paid'?amount:status==='later'?0:Number(document.getElementById('salehMobilePaidAmount')?.value||0);
   if(!Number.isFinite(paidAmount)||paidAmount<0||paidAmount>amount)throw new Error('المبلغ المدفوع لازم يكون من صفر إلى قيمة الشحن.');
   if(status==='partial'&&paidAmount>=amount)throw new Error('لو العميل دفع المبلغ بالكامل، اختار «دفع المبلغ بالكامل».');
  }
  const dueAmount=isPubg?0:Math.max(0,amount-paidAmount);
  // Mobile recharge is a real cost even when the customer pays later. Record the outgoing recharge cost separately from any cash actually collected.
  let rechargeCostTxId=null;
  if(!isPubg){
   const costTx=await db.from('personal_finance_transactions').insert({user_id:userId,account_id:accountObj.id,amount:-Math.abs(rechargeCost),transaction_type:'expense',category:'تكلفة شحن رصيد الموبايل',description:'تكلفة شحن رصيد الموبايل'+(person?' — العميل: '+person.person_name:''),source_type:sourceType,source_id:sourceId,transaction_date:date,notes:'تكلفة الشحن الفعلية: '+rechargeCost.toFixed(2)+' ج.م؛ قيمة العميل '+amount.toFixed(2)+' ج.م؛ المحصل فعليًا '+paidAmount.toFixed(2)+' ج.م؛ لا تعتمد على حالة سداد العميل.'}).select('id').single();
   if(costTx.error)throw costTx.error;
   rechargeCostTxId=costTx.data?.id||null;
  }
  let loanId=null;
  if(dueAmount>0){
   const loan=await db.from('personal_finance_loans').insert({user_id:userId,person_id:personId,loan_type:'lent',loan_direction:'lent',amount:dueAmount,wallet_account_id:accountObj.id,loan_date:date,purpose:'شحن رصيد موبايل للعميل [شحن آجل]',notes:'قيمة الشحن: '+amount.toFixed(2)+' جنيه؛ المدفوع: '+paidAmount.toFixed(2)+' جنيه؛ المتبقي على العميل: '+dueAmount.toFixed(2)+' جنيه. '+(desc||'')}).select('id').single();
   if(loan.error){if(rechargeCostTxId)await db.from('personal_finance_transactions').delete().eq('id',rechargeCostTxId).eq('user_id',userId);throw loan.error;}
   loanId=loan.data.id;
   if(rechargeCostTxId){
    const costNote=await db.from('personal_finance_transactions').select('notes').eq('id',rechargeCostTxId).eq('user_id',userId).maybeSingle();
    if(costNote.error)throw costNote.error;
    const noteText=String(costNote.data?.notes||'')+'؛ سجل مديونية العميل: '+loanId;
    const noteUpdate=await db.from('personal_finance_transactions').update({notes:noteText}).eq('id',rechargeCostTxId).eq('user_id',userId);
    if(noteUpdate.error)throw noteUpdate.error;
   }
  }
  if(paidAmount>0){
   const incomeTx=await db.from('personal_finance_transactions').insert({user_id:userId,account_id:accountObj.id,amount:Math.abs(paidAmount),transaction_type:'income',category:label,description:description+(person?' — العميل: '+person.person_name:''),source_type:sourceType,source_id:sourceId,transaction_date:date,notes:!isPubg?'قيمة الشحن: '+amount.toFixed(2)+'؛ المحصل فعليًا: '+paidAmount.toFixed(2)+'؛ المتبقي على العميل: '+dueAmount.toFixed(2)+'؛ سجل المديونية: '+(loanId||'لا يوجد'):'حركة '+label+' — تسجل مرة واحدة ضمن الحساب الرئيسي.'});
   if(incomeTx.error){
    if(loanId)await db.from('personal_finance_loans').delete().eq('id',loanId).eq('user_id',userId);
    if(rechargeCostTxId)await db.from('personal_finance_transactions').delete().eq('id',rechargeCostTxId).eq('user_id',userId);
    throw incomeTx.error;
   }
  }
  closeModal();await refresh();
  if(!isPubg&&dueAmount>0)showToast('تم تسجيل الشحن على حساب '+person.person_name+'؛ المدفوع '+paidAmount.toFixed(2)+' ج.م والمتبقي عليه '+dueAmount.toFixed(2)+' ج.م.');
  else showToast('تم تسجيل المبلغ المستلم من '+label);
 }catch(e){console.error('save Saleh recharge transaction',e);showToast(e?.message||'تعذر تسجيل حركة الشحن.',true);}
 finally{saving=false;}
};
})();
</script>


<script id="saleh-live-statement-share">
window.sendSalehStatementLinkWhatsApp=async function(personId){
 try{
  const p=loanPerson(personId);if(!p)throw new Error('الشخص غير موجود.');
  let phone=String(p.phone||'').replace(/[٠-٩]/g,function(d){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d));}).replace(/[^0-9]/g,'');
  if(phone.startsWith('00'))phone=phone.slice(2);
  if(phone.startsWith('0'))phone='20'+phone.slice(1);
  if(!phone||phone.length<10||phone.length>15)throw new Error('أضف رقم موبايل صحيح للشخص أولًا.');
  const uid=(typeof currentUser!=='undefined'&&currentUser&&currentUser.id)||(window.currentUser&&window.currentUser.id);
  if(!uid)throw new Error('انتهت جلسة الدخول. سجّل الدخول مرة أخرى.');
  const result=await db.from('personal_finance_loan_statement_shares').insert({user_id:uid,person_id:Number(personId)}).select('token').single();
  if(result.error)throw result.error;
  const url=new URL('statement.html',location.href);url.searchParams.set('token',result.data.token);
  const link=url.toString();
  const message='السلام عليكم '+(p.person_name||'')+'، ده رابط كشف حسابك تقدر تفتحه في أي وقت:\n'+link;
  const encodedMessage=encodeURIComponent(message);
  const wa='https://wa.me/'+phone+'?text='+encodedMessage;
  // Android: اطلب فتح WhatsApp Business تحديدًا. على الكمبيوتر لا توجد وصلة ويب عامة مضمونة تميّز Business عن الشخصي.
  if(/Android/i.test(navigator.userAgent)){
    const businessIntent='intent://send?phone='+phone+'&text='+encodedMessage+'#Intent;scheme=whatsapp;package=com.whatsapp.w4b;end';
    const opened=window.open(businessIntent,'_blank');
    if(!opened)window.location.href=wa;
  }else{
    window.open('https://web.whatsapp.com/send?phone='+phone+'&text='+encodedMessage,'_blank','noopener');
  }
 }catch(e){console.error('statement link WhatsApp',e);showToast((e.message||'تعذر إنشاء رابط الكشف.')+' لو الميزة غير مفعّلة، شغّل ملف supabase_live_person_statement.sql في SQL Editor مرة واحدة.',true);}
};

<script id="badgeifyContactPicker">
(function(){
  'use strict';
  const selector = 'input:not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"])';
  const phoneHint = /phone|mobile|whatsapp|tel|رقم.?الهاتف|رقم.?الموبايل|رقم.?الواتس|واتساب|موبايل|الهاتف|تليفون|تلفون/i;
  const styledParents = new WeakSet();
  function isPhoneField(input){
    if(!input || input.disabled || input.readOnly || input.dataset.badgeifyContactReady === '1') return false;
    const attrs = [input.type,input.name,input.id,input.placeholder,input.getAttribute('aria-label'),input.autocomplete].filter(Boolean).join(' ');
    if(input.type === 'tel' || phoneHint.test(attrs)) return true;
    const label = input.labels && Array.from(input.labels).map(x=>x.textContent||'').join(' ');
    return !!(label && phoneHint.test(label));
  }
  function addPicker(input){
    if(!isPhoneField(input)) return;
    input.dataset.badgeifyContactReady = '1';
    const parent = input.parentElement;
    if(!parent) return;
    if(!styledParents.has(parent)){
      const computed = window.getComputedStyle(parent);
      if(computed.position === 'static') parent.style.position = 'relative';
      styledParents.add(parent);
    }
    input.style.paddingInlineEnd = '46px';
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'badgeify-contact-picker';
    button.title = 'اختيار رقم من جهات الاتصال';
    button.setAttribute('aria-label','اختيار رقم واتساب من جهات الاتصال');
    button.innerHTML = '<svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20v-1.5A5.5 5.5 0 0 1 8.5 13h1"></path><path d="M16 13v8m-4-4h8"></path><path d="M16 3.5a4 4 0 0 1 0 8"></path></svg>';
    button.style.cssText = 'position:absolute;inset-inline-end:7px;top:50%;transform:translateY(-50%);z-index:5;width:34px;height:34px;border:1px solid #64748b55;border-radius:9px;background:var(--card-bg,#fff);color:var(--text-color,#334155);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 1px 4px #00000012;';
    button.addEventListener('click', async function(){
      if(!navigator.contacts || typeof navigator.contacts.select !== 'function'){
        alert('اختيار جهة الاتصال متاح حاليًا على الأجهزة والمتصفحات الداعمة، وأفضلها Chrome على أندرويد. تقدر تكتب الرقم يدويًا في الخانة.');
        return;
      }
      try{
        const contacts = await navigator.contacts.select(['name','tel'], {multiple:false});
        const contact = contacts && contacts[0];
        const numbers = contact && contact.tel;
        if(!numbers || !numbers.length) { alert('جهة الاتصال المختارة لا تحتوي على رقم هاتف.'); return; }
        input.value = numbers[0];
        input.dispatchEvent(new Event('input',{bubbles:true}));
        input.dispatchEvent(new Event('change',{bubbles:true}));
        input.focus();
      }catch(error){
        if(error && error.name !== 'AbortError') console.warn('BADGEIFY contact picker:',error);
      }
    });
    parent.appendChild(button);
  }
  function scan(root){
    if(root && root.matches && root.matches(selector)) addPicker(root);
    if(root && root.querySelectorAll) root.querySelectorAll(selector).forEach(addPicker);
  }
  function start(){
    scan(document);
    const observer = new MutationObserver(function(records){
      records.forEach(function(record){
        record.addedNodes.forEach(function(node){
          if(node.nodeType === 1) scan(node);
        });
      });
    });
    observer.observe(document.documentElement,{childList:true,subtree:true});
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>

.badgeify-contact-picker:hover{filter:brightness(.96)}
</style>
