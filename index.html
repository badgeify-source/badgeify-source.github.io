<style>

:root{
    --bg:#090b0f;
    --panel:#11151b;
    --panel2:#171c23;
    --border:#252c35;
    --text:#f4f5f7;
    --muted:#9299a5;
    --gold:#1877f2;
    --gold2:#5aa7ff;
    --green:#35c98a;
    --red:#ef6262;
    --blue:#42a5f5;
    --shadow:0 18px 50px rgba(0,0,0,.28);
}

body.light{
    --bg:#f3f4f6;
    --panel:#ffffff;
    --panel2:#f0f2f5;
    --border:#dfe3e8;
    --text:#17191d;
    --muted:#69717d;
    --shadow:0 12px 35px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Cairo,sans-serif;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;

    background:
    radial-gradient(
        circle at 20% 20%,
        rgba(24,119,242,.14),
        transparent 35%
    ),
    var(--bg);
}

.login-box{
    width:min(430px,100%);
    padding:35px;

    background:var(--panel);
    border:1px solid var(--border);
    border-radius:25px;

    box-shadow:var(--shadow);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:30px;
}

.logo-icon{
    width:48px;
    height:48px;

    border-radius:15px;

    display:grid;
    place-items:center;

    background:
    linear-gradient(
        135deg,
        var(--gold2),
        var(--gold)
    );

    color:#111;
    font-size:22px;
    font-weight:900;
}

.logo-title{
    font-size:22px;
    font-weight:800;
}

.logo-sub{
    color:var(--muted);
    font-size:11px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:11px 12px;

    border:1px solid var(--border);
    border-radius:10px;

    outline:none;

    background:var(--panel2);
    color:var(--text);
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:var(--blue);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.full{
    grid-column:1/-1;
}

/* APP */

.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;

    right:0;
    top:0;
    bottom:0;

    width:270px;

    background:var(--panel);
    border-left:1px solid var(--border);

    padding:20px 15px;

    z-index:20;

    overflow:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;

    padding:7px 8px 22px;
}

.brand .logo-icon{
    width:44px;
    height:44px;
}

.brand-name{
    font-weight:800;
    font-size:20px;
}

.brand-sub{
    color:var(--muted);
    font-size:10px;
}

.nav-title{
    color:var(--muted);
    font-size:10px;
    margin:15px 10px 7px;
}

.nav button{
    width:100%;

    border:0;

    background:transparent;
    color:var(--muted);

    padding:11px 13px;

    border-radius:11px;

    display:flex;
    align-items:center;
    gap:11px;

    text-align:right;

    margin:3px 0;
}

.nav button:hover,
.nav button.active{
    background:rgba(24,119,242,.12);
    color:var(--gold2);
}

.nav i{
    width:19px;
    text-align:center;
}

.main{
    width:calc(100% - 270px);
    margin-right:270px;
}

.topbar{
    height:74px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    position:sticky;
    top:0;

    background:rgba(9,11,15,.90);

    backdrop-filter:blur(15px);

    z-index:10;
}

body.light .topbar{
    background:rgba(243,244,246,.90);
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-btn,
.ghost-btn,
.gold-btn,
.red-btn,
.mini-btn{
    border:1px solid var(--border);

    border-radius:10px;

    background:var(--panel);
    color:var(--text);

    padding:9px 12px;
}

.icon-btn{
    width:42px;
    height:42px;
    padding:0;
}

.gold-btn{
    background:
    linear-gradient(
        135deg,
        var(--gold2),
        var(--gold)
    );

    border-color:transparent;

    color:#111;
    font-weight:800;
}

.red-btn{
    background:var(--red);
    color:white;
    border-color:transparent;
}

.ghost-btn:hover,
.icon-btn:hover,
.mini-btn:hover{
    border-color:var(--gold);
}

.content{
    max-width:1500px;
    margin:auto;
    padding:28px;
}

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:20px;
}

.page-head h1{
    margin:0;
    font-size:27px;
}

.page-head p{
    margin:5px 0 0;

    color:var(--muted);
    font-size:12px;
}

.page-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* CARDS */

.grid{
    display:grid;
    gap:16px;
}

.stats{
    grid-template-columns:repeat(4,1fr);
}

.stat{
    background:var(--panel);

    border:1px solid var(--border);

    border-radius:17px;

    padding:20px;

    box-shadow:var(--shadow);
}

.stat-icon{
    width:42px;
    height:42px;

    border-radius:12px;

    display:grid;
    place-items:center;

    background:rgba(214,179,90,.12);

    color:var(--gold2);

    margin-bottom:13px;
}

.stat h2{
    margin:0;
    font-size:26px;
}

.stat p{
    margin:4px 0 0;

    color:var(--muted);
    font-size:11px;
}

.card{
    background:var(--panel);

    border:1px solid var(--border);

    border-radius:17px;

    box-shadow:var(--shadow);
}

.card-head{
    padding:16px 18px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.card-head h3{
    margin:0;
    font-size:14px;
}

.card-body{
    padding:18px;
}

.cols{
    grid-template-columns:1.4fr 1fr;
}

/* TABLE */

.table-wrap{
    overflow:auto;
}

.table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

.table th,
.table td{
    padding:12px;

    border-bottom:1px solid var(--border);

    text-align:right;

    font-size:11px;

    vertical-align:middle;
}

.table th{
    color:var(--muted);
}

.table tr:hover td{
    background:rgba(214,179,90,.035);
}

.actions{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.mini-btn{
    padding:6px 8px;
    font-size:10px;
}

.mini-btn.wa{
    color:#36d995;
}

.mini-btn.pay{
    color:var(--gold2);
}

.badge{
    display:inline-flex;

    padding:5px 9px;

    border-radius:999px;

    font-size:9px;

    font-weight:700;
}

.badge.paid{
    background:rgba(53,201,138,.13);
    color:var(--green);
}

.badge.overdue{
    background:rgba(239,98,98,.13);
    color:var(--red);
}

.badge.due{
    background:rgba(214,179,90,.13);
    color:var(--gold2);
}

.badge.upcoming{
    background:rgba(93,168,255,.12);
    color:var(--blue);
}

.badge.inactive{
    background:rgba(140,150,165,.13);
    color:var(--muted);
}


/* BADGEIFY SUBSCRIPTION FILTER */
.subscription-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.subscription-filter-btn{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);text-align:center}
.subscription-filter-btn:hover,.subscription-filter-btn.active{border-color:var(--gold);background:rgba(214,179,90,.12);color:var(--gold2)}
.subscription-filter-btn b{display:block;font-size:18px;margin-bottom:2px}.subscription-filter-btn span{color:var(--muted);font-size:10px}.subscription-filter-btn small{display:block;margin-top:3px;font-size:10px;color:var(--gold2)}
.field select option,.search select option,.subscription-service-select option{background:#111b2a;color:#f7faff}
body.light .field select option,body.light .search select option,body.light .subscription-service-select option{background:#fff;color:#17191d}
@media(max-width:600px){.subscription-filters{grid-template-columns:repeat(2,1fr)}}
/* SEARCH */

.search{
    display:flex;
    gap:8px;

    margin-bottom:15px;
}

.search input,
.search select{
    padding:10px;

    background:var(--panel2);

    border:1px solid var(--border);

    color:var(--text);

    border-radius:10px;
}

/* CALENDAR */

.calendar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.day{
    min-height:125px;

    background:var(--panel2);

    border:1px solid var(--border);

    border-radius:13px;

    padding:10px;
}

.day.today{
    border-color:var(--gold);
}

.day-head{
    display:flex;
    justify-content:space-between;

    font-size:10px;

    margin-bottom:7px;
}

.day-head b{
    color:var(--gold2);
}

.event{
    padding:7px;

    border-radius:7px;

    background:var(--panel);

    font-size:9px;

    margin-top:5px;

    border-right:3px solid var(--gold);
}

.event.over{
    border-right-color:var(--red);
}

/* LIST */

.list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.list-item{
    background:var(--panel2);

    border-radius:10px;

    padding:10px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.muted{
    color:var(--muted);
}

.money{
    color:var(--gold2);
    font-weight:800;
}

/* MODAL */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.67);

    backdrop-filter:blur(5px);

    display:grid;

    place-items:center;

    padding:15px;

    z-index:100;
}

.modal-box{
    width:min(800px,100%);

    max-height:92vh;

    overflow:auto;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:20px;

    box-shadow:0 30px 90px #0008;
}

.modal-head{
    padding:16px 20px;

    border-bottom:1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.modal-head h3{
    margin:0;
}

.modal-body{
    padding:20px;
}

.modal-foot{
    padding:14px 20px;

    border-top:1px solid var(--border);

    display:flex;

    gap:8px;
}

/* TOAST */

.toast{
    position:fixed;

    bottom:20px;
    left:20px;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:12px;

    padding:13px 16px;

    z-index:200;

    box-shadow:var(--shadow);
}

.toast.ok{
    border-color:rgba(53,201,138,.5);
}

.toast.err{
    border-color:rgba(239,98,98,.5);
}

.empty{
    text-align:center;

    padding:30px 10px;

    color:var(--muted);
}


/* RESPONSIVE */

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .cols{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:800px){

    .sidebar{
        width:72px;
        padding:15px 7px;
    }

    .brand-name,
    .brand-sub,
    .nav-title,
    .nav span{
        display:none;
    }

    .brand{
        justify-content:center;
    }

    .nav button{
        justify-content:center;
    }

    .main{
        width:calc(100% - 72px);
        margin-right:72px;
    }

    .content{
        padding:16px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:520px){

    .stats{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:1fr;
    }

    .page-head{
        flex-direction:column;
        align-items:flex-start;
    }

}


/* BADGEIFY BLUE IDENTITY + MOBILE COMPACT UI */
.logo-icon{
    overflow:hidden;
    background:linear-gradient(135deg,#1877f2,#0b1f3a);
    border:1px solid rgba(90,167,255,.35);
    box-shadow:0 8px 24px rgba(24,119,242,.18);
}
.brand-logo-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    border-radius:inherit;
}
.gold-btn{
    box-shadow:0 8px 22px rgba(24,119,242,.18);
}
.nav button:hover,.nav button.active{
    box-shadow:inset 0 0 0 1px rgba(24,119,242,.10);
}
@media(max-width:800px){
    .sidebar{
        width:58px;
        padding:10px 5px;
    }
    .brand{
        padding:4px 2px 14px;
    }
    .brand .logo-icon{
        width:38px;
        height:38px;
    }
    .nav button{
        min-height:42px;
        padding:8px 4px;
        margin:2px 0;
        border-radius:9px;
    }
    .nav i{
        width:auto;
        font-size:15px;
    }
    .main{
        width:calc(100% - 58px);
        margin-right:58px;
    }
    .topbar{
        height:58px;
        padding:0 10px;
    }
    .icon-btn{
        width:36px;
        height:36px;
    }
    .content{
        padding:11px;
    }
    .page-head{
        gap:9px;
        margin-bottom:12px;
    }
    .page-head h1,.page-title{
        font-size:18px!important;
    }
    .card{
        border-radius:12px;
    }
    .stats{
        gap:8px;
    }
    .stat-card{
        padding:11px!important;
        min-height:0!important;
    }
    .stat-card .stat-value{
        font-size:20px!important;
    }
    .btn,.gold-btn,.ghost-btn,.red-btn,.mini-btn{
        padding:8px 10px;
        border-radius:9px;
        font-size:12px;
    }
    .field label{
        font-size:10px;
    }
    .field input,.field select,.field textarea,
    .search input,.search select{
        padding:9px 10px;
        font-size:12px;
    }
    .modal{
        padding:8px;
    }
    .modal-box{
        max-height:95vh;
        border-radius:15px;
    }
    .modal-head{
        padding:12px 14px!important;
    }
    .list-item{
        padding:8px;
        gap:7px;
    }
}
@media(max-width:520px){
    .login{padding:12px;}
    .login-box{padding:22px 16px;border-radius:18px;}
    .logo{margin-bottom:20px;}
    .logo-icon{width:42px;height:42px;}
    .logo-title{font-size:19px;}
    .logo-sub{font-size:9px;}
    .top-actions{gap:4px;}
    .top-actions .ghost-btn{padding:7px 8px;font-size:11px;}
    .calendar{gap:6px;}
    .day{min-height:105px;padding:8px;}
}

/* BADGEIFY PREMIUM UI REFRESH */
:root{
 --bg:#060b14;
 --panel:#0d1420;
 --panel2:#111b2a;
 --border:rgba(255,255,255,.075);
 --text:#f7faff;
 --muted:#8f9bad;
 --gold:#1877f2;
 --gold2:#63b3ff;
 --blue:#42a5f5;
 --shadow:0 20px 60px rgba(0,0,0,.35);
}
body{
 background:
 radial-gradient(circle at 85% -10%,rgba(24,119,242,.13),transparent 32%),
 radial-gradient(circle at 10% 100%,rgba(66,165,245,.06),transparent 30%),
 var(--bg);
}
.sidebar{
 background:linear-gradient(180deg,rgba(13,20,32,.98),rgba(7,12,20,.98));
 border-left:1px solid rgba(99,179,255,.10);
 box-shadow:-12px 0 45px rgba(0,0,0,.16);
}
.brand{
 padding-bottom:24px;
}
.brand .logo-icon,.login .logo-icon{
 position:relative;
 box-shadow:0 0 0 1px rgba(99,179,255,.15),0 12px 30px rgba(24,119,242,.22);
}
.brand-logo-image{
 object-fit:cover;
}
.brand-name,.logo-title{
 letter-spacing:.4px;
}
.brand-sub,.logo-sub{
 letter-spacing:1px;
}
.topbar{
 background:rgba(6,11,20,.78);
 border-bottom:1px solid rgba(255,255,255,.06);
}
.content{
 padding-top:30px;
}
.page-head h1{
 font-weight:800;
 letter-spacing:-.3px;
}
.card,.stat{
 background:linear-gradient(145deg,rgba(17,27,42,.96),rgba(11,18,29,.96));
 border:1px solid rgba(255,255,255,.07);
 box-shadow:0 14px 45px rgba(0,0,0,.20);
}
.card-head{
 background:linear-gradient(90deg,rgba(24,119,242,.045),transparent);
}
.stat{
 position:relative;
 overflow:hidden;
}
.stat:before{
 content:"";
 position:absolute;
 width:100px;height:100px;
 left:-35px;top:-45px;
 background:rgba(24,119,242,.08);
 border-radius:50%;
 filter:blur(2px);
}
.stat-icon{
 background:rgba(24,119,242,.12);
 color:#63b3ff;
 box-shadow:inset 0 0 0 1px rgba(99,179,255,.08);
}
.gold-btn{
 background:linear-gradient(135deg,#42a5f5,#1877f2);
 color:#fff;
 border:0;
 box-shadow:0 10px 28px rgba(24,119,242,.22);
}
.gold-btn:hover{
 transform:translateY(-1px);
 box-shadow:0 14px 32px rgba(24,119,242,.30);
}
.ghost-btn,.icon-btn,.mini-btn{
 background:rgba(255,255,255,.025);
}
.field input,.field select,.field textarea,.search input,.search select{
 background:rgba(255,255,255,.025);
 border-color:rgba(255,255,255,.08);
}
.table th{
 background:rgba(24,119,242,.035);
}
.table tr:hover td{
 background:rgba(24,119,242,.045);
}
.badge.due{
 background:rgba(24,119,242,.13);
 color:#63b3ff;
}
.modal-box{
 background:linear-gradient(145deg,#0e1725,#0a111c);
 border-color:rgba(99,179,255,.12);
}
.login-box{
 background:linear-gradient(145deg,rgba(15,24,38,.98),rgba(9,15,25,.98));
 border-color:rgba(99,179,255,.12);
}

/* =========================================
   UI HELPERS
========================================= */

function esc(value){

    return String(value ?? "")
    .replace(/[&<>"']/g,function(x){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[x];

    });

}


function money(value){

    return new Intl.NumberFormat(
        state.lang==="ar"?"ar-EG":"en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ).format(Number(value||0));

}


function dateOnly(value){

    if(!value) return null;

    const p=
    String(value)
    .slice(0,10)
    .split("-")
    .map(Number);

    return new Date(
        p[0],
        p[1]-1,
        p[2]
    );

}


function isoDate(date){

    const y=date.getFullYear();

    const m=
    String(date.getMonth()+1)
    .padStart(2,"0");

    const d=
    String(date.getDate())
    .padStart(2,"0");

    return `${y}-${m}-${d}`;

}


function formatDate(value){

    const d=dateOnly(value);

    if(!d) return "-";

    return new Intl.DateTimeFormat(
        state.lang==="ar"?"ar-EG":"en-GB",
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    ).format(d);

}


function monthKey(date){

    return date.getFullYear()
    +"-"
    +String(date.getMonth()+1).padStart(2,"0");

}


function clampDay(year,month,day){

    return Math.min(
        Number(day||1),
        new Date(year,month+1,0).getDate()
    );

}


/* =========================================
   PAYMENT DATE
========================================= */

/*
    لا يوجد تاريخ بداية
    ولا يوجد تاريخ تجديد.

    يوم الدفع فقط هو الأساس.
*/

function subscriptionDueDate(subscription){

    const now=new Date();

    const day=
    Number(
        subscription.payment_day
        ||subscription.renewal_day
        ||1
    );

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        clampDay(
            now.getFullYear(),
            now.getMonth(),
            day
        )
    );

}


function paymentExistsForPeriod(
    subscription,
    dueDate
){

    const key=monthKey(dueDate);

    return state.payments.some(function(payment){

        return Number(payment.subscription_id)
        ===Number(subscription.id)

        &&
        payment.paid_month===key;

    });

}


function getPaymentState(subscription){

    if(subscription.status==="inactive"){

        return {
            type:"inactive",
            text:t("inactive")
        };

    }

    const due=
    subscriptionDueDate(subscription);

    if(
        paymentExistsForPeriod(
            subscription,
            due
        )
    ){

        return {
            type:"paid",
            text:t("paid")
        };

    }

    const today=
    dateOnly(isoDate(new Date()));

    const diff=
    Math.round(
        (today-due)/86400000
    );

    if(diff>0){

        return {
            type:"overdue",
            text:
            state.lang==="ar"
            ?
            `${t("overdue")} ${diff} يوم`
            :
            `${diff} days overdue`
        };

    }

    if(diff===0){

        return {
            type:"due",
            text:t("dueToday")
        };

    }

    return {
        type:"upcoming",
        text:t("upcoming")
    };

}


function statusBadge(subscription){

    const st=
    getPaymentState(subscription);

    return `
    <span class="badge ${st.type}">
        ${esc(st.text)}
    </span>
    `;

}

    .select("*");

    return result.data||[];

}

function showToast(message,error=false){

    const el=
    document.getElementById("toast");

    el.textContent=message;

    el.className=
    "toast "
    +(error?"err":"ok");

    el.classList.remove("hidden");

    setTimeout(function(){

        el.classList.add("hidden");

    },3000);

}


async function savePortalWhatsAppMessages(){

    const customerMessage =
        document.getElementById("msgCustomerPortal").value;

    const traderMessage =
        document.getElementById("msgTraderPortal").value;

    const values = {
        wa_customer_portal: customerMessage,
        wa_trader_portal: traderMessage
    };

    try{

        for(const [key,value] of Object.entries(values)){

            const result =
                await db
                .from("app_settings")
                .upsert(
                    {
                        setting_key:key,
                        setting_value:value,
                        updated_at:new Date().toISOString()
                    },
                    {onConflict:"setting_key"}
                );

            if(result.error)
                throw result.error;

            // تحديث الذاكرة فوراً
            state.settings[key] = value;
        }

        // إعادة تحميل الإعدادات من Supabase للتأكد
        await loadData();
        render();

        showToast("تم حفظ رسائل روابط العملاء والتجار");

    }catch(error){

        showToast(error.message,true);

    }

}

function whatsappNumber(phone){

    let number=
    String(phone||"")
    .replace(/\D/g,"");

    if(!number)
        return "";

    if(number.startsWith("0"))
        number="20"+number.substring(1);

    return number;

}


function getWhatsAppTemplates(){

    return {

        welcome:
        state.settings.wa_welcome
        ||
        "السلام عليكم {{client_name}}\nأهلاً بك في {{company_name}}.",

        payment:
        state.settings.wa_payment_reminder
        ||
        "السلام عليكم {{client_name}}\nنذكرك بموعد دفع اشتراك {{service_name}} بقيمة {{amount}} {{currency}}.",

        due:
        state.settings.wa_due_reminder
        ||
        "السلام عليكم {{client_name}}\nاليوم موعد دفع اشتراك {{service_name}} بقيمة {{amount}} {{currency}}.",

        overdue:
        state.settings.wa_overdue_reminder
        ||
        "السلام عليكم {{client_name}}\nاشتراك {{service_name}} متأخر عن السداد. المبلغ المطلوب {{amount}} {{currency}}.",

        confirmed:
        state.settings.wa_payment_confirmed
        ||
        "تم تأكيد استلام دفعتك يا {{client_name}} بقيمة {{amount}} {{currency}}.\nشكراً لتعاملك معنا.",

        renewal:
        state.settings.wa_renewal
        ||
        "تم تجديد اشتراك {{service_name}} للعميل {{client_name}}."
    };

}


function buildWhatsAppMessage(
    template,
    customer,
    subscription
){

    const service=
    subscription?
    getService(subscription.app_service_id):
    null;

    const due=
    subscription?
    subscriptionDueDate(subscription):
    null;

    const values={

        client_name:
        customer?.client_name||"",

        phone:
        customer?.phone||"",

        service_name:
        service?.service_name||"",

        amount:
        subscription?
        money(subscription.monthly_fee):
        "",

        currency:
        subscription?.currency
        ||
        state.settings.currency
        ||
        "EGP",

        due_date:
        due?
        formatDate(due):
        "",

        page_name:
        subscription?.page_name||"",

        platform:
        subscription?.platform||"",

        company_name:
        state.settings.company_name
        ||
        "BADGEIFY"

    };

    return template.replace(
        /{{(\w+)}}/g,
        function(_,key){

            return values[key] ?? "";

        }
    );

}


function sendWhatsApp(
    customerId,
    subscriptionId,
    type
){

    const customer=
    getCustomer(customerId);

    const subscription=
    getSubscription(subscriptionId);

    if(!customer?.phone){

        showToast(
            state.lang==="ar"
            ?"لا يوجد رقم للعميل"
            :"Customer has no phone number",
            true
        );

        return;

    }

    const templates=
    getWhatsAppTemplates();

    const message=
    buildWhatsAppMessage(
        templates[type]||templates.payment,
        customer,
        subscription
    );

    const number=
    whatsappNumber(customer.phone);

    window.open(
        "https://wa.me/"
        +number
        +"?text="
        +encodeURIComponent(message),
        "_blank"
    );

}

function renderCalendar(){

    const active=
    state.subscriptions
    .filter(x=>x.status!=="inactive");

    let html="";

    for(
        let i=0;
        i<30;
        i++
    ){

        const date=
        new Date();

        date.setHours(0,0,0,0);

        date.setDate(
            date.getDate()+i
        );

        const dateString=
        isoDate(date);

        const subscriptions=
        active.filter(
            x=>
            isoDate(
                subscriptionDueDate(x)
            )===dateString
        );

        html+=`

        <div class="day
        ${i===0?"today":""}">

            <div class="day-head">

                <b>
                ${i===0
                ?t("today")
                :new Intl.DateTimeFormat(
                    state.lang==="ar"
                    ?"ar-EG"
                    :"en",
                    {weekday:"short"}
                ).format(date)}
                </b>

                <span>
                ${date.getDate()}/${date.getMonth()+1}
                </span>

            </div>

            ${
            subscriptions.length
            ?
            subscriptions.map(function(s){

                const st=
                getPaymentState(s);

                const c=
                getCustomer(s.customer_id);

                return `

                <div
                class="event
                ${st.type==="overdue"?"over":""}"
                onclick="openPaymentModal(${s.id})">

                <b>
                ${esc(c?.client_name||"-")}

                ${esc(
                    getService(
                        s.app_service_id
                    )?.service_name
                    ||
                    s.platform
                    ||
                    "-"
                )}

                </span>

                </div>

                `;

            }).join("")
            :
            `<span class="muted">—</span>`
            }

        </div>

        `;

    }

    return html;

}

async function saveVisaCard(id){
    const name=document.getElementById("visaCardName").value.trim();
    const number=document.getElementById("visaCardNumber").value.replace(/\D/g,"");
    const old4=document.getElementById("visaCardLast4").value.trim();
    const last4=(number?number.slice(-4):old4).replace(/\D/g,"").slice(-4);
    if(!name){showToast(t("cardName"),true);return;}
    if(last4.length!==4){showToast("اكتب رقم الفيزا بشكل صحيح",true);return;}
    try{
      let result;
      if(id) result=await db.from("visa_cards").update({card_name:name,last4:last4}).eq("id",id);
      else result=await db.from("visa_cards").insert({card_name:name,last4:last4});
      if(result.error)throw result.error;
      closeModal();await refresh();showToast(t("saved"));
    }catch(error){showToast(error.message,true);}
}
async function deleteVisaCard(id){
    if(!confirm(state.lang==="ar"?"هل تريد حذف هذه الفيزا؟":"Delete this card?"))return;
    try{
      const result=await db.from("visa_cards").delete().eq("id",id);
      if(result.error)throw result.error;
      await refresh();showToast(t("deleted"));
    }catch(error){showToast(error.message,true);}
}

function sendCustomerWhatsApp(customerId){

    const customer = getCustomer(customerId);

    if(!customer){
        showToast("العميل غير موجود", true);
        return;
    }

    if(!customer.phone){
        showToast("لا يوجد رقم هاتف للعميل", true);
        return;
    }

    let number = String(customer.phone)
        .replace(/\D/g,"");

    if(number.startsWith("0")){
        number = "20" + number.substring(1);
    }

    if(!number){
        showToast("رقم الهاتف غير صحيح", true);
        return;
    }

    const message =
        "السلام عليكم " +
        (customer.client_name || "") +
        "\n\n" +
        "أهلاً بك في BADGEIFY.";

    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);

    window.open(url, "_blank");
}

async function saveCustomer(id){

    const data={

        client_name:
        document.getElementById(
            "customerName"
        ).value.trim(),

        client_type:
        document.getElementById(
            "customerType"
        ).value,

        phone:
        document.getElementById(
            "customerPhone"
        ).value.trim(),

        trader_id:
        document.getElementById(
            "customerTrader"
        ).value
        ?
        Number(
            document.getElementById(
                "customerTrader"
            ).value
        )
        :
        null,

        status:
        document.getElementById(
            "customerStatus"
        ).value,

        notes:
        document.getElementById(
            "customerNotes"
        ).value

    };

    if(!data.client_name){

        showToast(
            t("name"),
            true
        );

        return;

    }

    try{

        let result;

        if(id){

            result=
            await db
            .from("customers")
            .update(data)
            .eq("id",id);

        }else{

            result=
            await db
            .from("customers")
            .insert(data);

        }

        if(result.error)
            throw result.error;

        await logActivity(
            id?"UPDATE":"CREATE",
            "customer",
            id,
            data.client_name
        );

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


async function deleteCustomer(id){

    if(
        !confirm(
            state.lang==="ar"
            ?
            "هل تريد حذف العميل وكل اشتراكاته؟"
            :
            "Delete customer and subscriptions?"
        )
    )
    return;

    try{

        const result=
        await db
        .from("customers")
        .delete()
        .eq("id",id);

        if(result.error)
            throw result.error;

        await refresh();

        showToast(t("deleted"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


/* =========================================
   SUBSCRIPTIONS
========================================= */

function renderSubscriptions(){
    const rows=state.subscriptions.filter(function(x){return x.status!=="inactive";});
    function servicesForSubscription(subscription){
        const childRows=state.subscriptionServices.filter(function(row){
            return String(row.subscription_id)===String(subscription.id);
        });
        if(childRows.length){
            return childRows.map(function(row){
                return getService(row.app_service_id||row.service_id);
            }).filter(Boolean);
        }
        const service=getService(subscription.app_service_id);
        return service?[service]:[];
    }
    const selectedService=document.getElementById("subscriptionServiceFilter")?.value||"";
    const selectedStatus=state.subscriptionFilterStatus||"all";

    let filteredRows=selectedService?rows.filter(function(subscription){
        return servicesForSubscription(subscription).some(function(service){
            return String(service.id)===String(selectedService);
        });
    }):rows;

    if(selectedStatus!=="all"){
        filteredRows=filteredRows.filter(function(subscription){
            return getPaymentState(subscription).type===selectedStatus;
        });
    }

    const counts={
        all:rows.length,
        upcoming:rows.filter(x=>getPaymentState(x).type==="upcoming").length,
        due:rows.filter(x=>getPaymentState(x).type==="due").length,
        overdue:rows.filter(x=>getPaymentState(x).type==="overdue").length,
        paid:rows.filter(x=>getPaymentState(x).type==="paid").length
    };

    const totals={
        all:rows.reduce((sum,x)=>sum+Number(x.monthly_fee||0),0),
        upcoming:rows.filter(x=>getPaymentState(x).type==="upcoming").reduce((sum,x)=>sum+Number(x.monthly_fee||0),0),
        due:rows.filter(x=>getPaymentState(x).type==="due").reduce((sum,x)=>sum+Number(x.monthly_fee||0),0),
        overdue:rows.filter(x=>getPaymentState(x).type==="overdue").reduce((sum,x)=>sum+Number(x.monthly_fee||0),0),
        paid:rows.filter(x=>getPaymentState(x).type==="paid").reduce((sum,x)=>sum+Number(x.monthly_fee||0),0)
    };
    /*
     * ترتيب الاشتراكات:
     * 1) الأقدم في التأخير أولاً (7 أيام قبل يومين مثلاً)
     * 2) المستحق اليوم
     * 3) القادم، والأقرب أولاً
     * 4) المدفوع في النهاية
     *
     * ترتيب العملاء المجمعين يعتمد على أسوأ/أقرب اشتراك
     * داخل كل عميل، مع الحفاظ على تجميع خدمات العميل في بطاقة واحدة.
     */
    function subscriptionSortInfo(subscription){
        const paymentState=getPaymentState(subscription);
        const due=subscriptionDueDate(subscription);
        const today=dateOnly(isoDate(new Date()));
        const diff=due ? Math.round((today-due)/86400000) : 999999;

        if(paymentState.type==="overdue"){
            return {
                rank:0,
                distance:diff,
                dueTime:due ? due.getTime() : Number.MAX_SAFE_INTEGER
            };
        }

        if(paymentState.type==="due"){
            return {
                rank:1,
                distance:0,
                dueTime:due ? due.getTime() : Number.MAX_SAFE_INTEGER
            };
        }

        if(paymentState.type==="upcoming"){
            return {
                rank:2,
                distance:Math.abs(diff),
                dueTime:due ? due.getTime() : Number.MAX_SAFE_INTEGER
            };
        }

        return {
            rank:3,
            distance:0,
            dueTime:due ? due.getTime() : Number.MAX_SAFE_INTEGER
        };
    }

    filteredRows.sort(function(a,b){
        const A=subscriptionSortInfo(a);
        const B=subscriptionSortInfo(b);

        if(A.rank!==B.rank){
            return A.rank-B.rank;
        }

        if(A.rank===0){
            if(A.distance!==B.distance){
                return B.distance-A.distance;
            }
        }else if(A.rank===2){
            if(A.distance!==B.distance){
                return A.distance-B.distance;
            }
        }

        return A.dueTime-B.dueTime;
    });

    const grouped={};
    filteredRows.forEach(function(subscription){
        const key=String(subscription.customer_id);
        if(!grouped[key]){
            grouped[key]={customer:getCustomer(subscription.customer_id),subscriptions:[]};
        }
        grouped[key].subscriptions.push(subscription);
    });
    const groups=Object.values(grouped);

    /*
     * بعد التجميع، نرتب كل عميل حسب أهم اشتراك بداخله.
     * مثال: عميل لديه اشتراك متأخر 7 أيام وآخر قادم،
     * يظل العميل نفسه في مكان المتأخر 7 أيام.
     */
    groups.forEach(function(group){
        group.subscriptions.sort(function(a,b){
            const A=subscriptionSortInfo(a);
            const B=subscriptionSortInfo(b);

            if(A.rank!==B.rank){
                return A.rank-B.rank;
            }

            if(A.rank===0){
                if(A.distance!==B.distance){
                    return B.distance-A.distance;
                }
            }else if(A.rank===2){
                if(A.distance!==B.distance){
                    return A.distance-B.distance;
                }
            }

            return A.dueTime-B.dueTime;
        });
    });

    groups.sort(function(a,b){
        const A=subscriptionSortInfo(a.subscriptions[0]);
        const B=subscriptionSortInfo(b.subscriptions[0]);

        if(A.rank!==B.rank){
            return A.rank-B.rank;
        }

        if(A.rank===0){
            if(A.distance!==B.distance){
                return B.distance-A.distance;
            }
        }else if(A.rank===2){
            if(A.distance!==B.distance){
                return A.distance-B.distance;
            }
        }

        return A.dueTime-B.dueTime;
    });

    document.getElementById("content").innerHTML=`
    <div class="page-head">
        <div><h1>${t("subscriptions")}</h1></div>
        <button class="gold-btn" onclick="openSubscriptionModal()">
            <i class="fa-solid fa-plus"></i> ${t("newSubscription")}
        </button>
    </div>
    <div class="card">
        <div class="card-body">
            <div class="subscription-filters">
                <button class="subscription-filter-btn ${selectedStatus==="all"?"active":""}" onclick="setSubscriptionStatusFilter('all')"><b>${counts.all}</b><span>${t("allSubscriptions")}</span><small>${money(totals.all)} ${esc(state.settings.currency||"EGP")}</small></button>
                <button class="subscription-filter-btn ${selectedStatus==="upcoming"?"active":""}" onclick="setSubscriptionStatusFilter('upcoming')"><b>${counts.upcoming}</b><span>${t("upcomingSubscriptions")}</span><small>${money(totals.upcoming)} ${esc(state.settings.currency||"EGP")}</small></button>
                <button class="subscription-filter-btn ${selectedStatus==="due"?"active":""}" onclick="setSubscriptionStatusFilter('due')"><b>${counts.due}</b><span>${t("dueToday")}</span><small>${money(totals.due)} ${esc(state.settings.currency||"EGP")}</small></button>
                <button class="subscription-filter-btn ${selectedStatus==="overdue"?"active":""}" onclick="setSubscriptionStatusFilter('overdue')"><b>${counts.overdue}</b><span>${t("overdue")}</span><small>${money(totals.overdue)} ${esc(state.settings.currency||"EGP")}</small></button>
                <button class="subscription-filter-btn ${selectedStatus==="paid"?"active":""}" onclick="setSubscriptionStatusFilter('paid')"><b>${counts.paid}</b><span>${t("paid")}</span><small>${money(totals.paid)} ${esc(state.settings.currency||"EGP")}</small></button>
            </div>

            <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
                <label style="font-weight:700">فلترة حسب الخدمة</label>
                <select id="subscriptionServiceFilter" onchange="renderSubscriptions()" style="min-width:220px">
                    <option value="">كل الخدمات</option>
                    ${state.services.map(function(service){
                        return `<option value="${service.id}" ${String(selectedService)===String(service.id)?"selected":""}>${esc(service.service_name)}</option>`;
                    }).join("")}
                </select>
                <span class="muted">عدد العملاء: ${groups.length}</span>
            </div>
            <div class="table-wrap">
            <table class="table">
            <thead><tr>
                <th>العميل</th><th>الخدمات</th><th>المنصة / الصفحة</th>
                <th>إجمالي الاشتراك الشهري</th><th>أيام الدفع</th><th>الحالة</th><th>${t("actions")}</th>
            </tr></thead>
            <tbody>
            ${
                groups.length
                ?
                groups.map(function(group){
                    const customer=group.customer;
                    const subs=group.subscriptions;
                    const total=subs.reduce(function(sum,s){return sum+Number(s.monthly_fee||0);},0);
                    const currencies=[...new Set(subs.map(function(s){return s.currency||"EGP";}))].join(" / ");
                    const serviceNames=[...new Set(subs.flatMap(servicesForSubscription).map(function(service){return service.service_name;}))];
                    const platforms=subs.map(function(s){return (s.platform||"-")+(s.page_name?" - "+s.page_name:"");});
                    const paymentDays=subs.map(function(s){return s.payment_day||"-";});
                    const statusHtml=subs.map(function(s){return statusBadge(s);}).join(" ");
                    const actions=subs.map(function(s){
                        const status=getPaymentState(s);
                        return `
                        <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap;">
                            <span class="muted" style="min-width:95px">
                                ${esc(servicesForSubscription(s).map(function(service){return service.service_name;}).join(" + ")||"-")}
                            </span>
                            ${status.type!=="paid"?`
                            <button class="mini-btn pay" onclick="openPaymentModal(${s.id})" title="${t("confirmPayment")}">
                                <i class="fa-solid fa-check"></i>
                            </button>`:""}
                            ${customer?.phone?`
                            <button class="mini-btn wa" onclick="sendWhatsApp(${customer.id},${s.id},'${status.type==="overdue"?"overdue":status.type==="due"?"due":"payment"}')" title="WhatsApp">
                                <i class="fa-brands fa-whatsapp"></i>
                            </button>`:""}
                            ${customer?`
                            <button class="mini-btn" title="رابط العميل" onclick="openCustomerPortal(${customer.id})">
                                <i class="fa-solid fa-link"></i>
                            </button>`:""}
                            <button class="mini-btn" onclick="openSubscriptionModal(${s.id})" title="${t("edit")}">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="mini-btn" onclick="deleteSubscription(${s.id})" title="${t("delete")}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>`;
                    }).join("");

                    return `
                    <tr>
                        <td>
                            <strong>${esc(customer?.client_name||"-")}</strong>
                            ${customer?.phone?`<div class="muted">${esc(customer.phone)}</div>`:""}
                        </td>
                        <td>
                            ${serviceNames.length?serviceNames.map(function(name){
                                return `<span class="badge" style="margin:2px;display:inline-block;">${esc(name)}</span>`;
                            }).join(""):"-"}
                        </td>
                        <td>${platforms.map(function(value){return `<div>${esc(value)}</div>`;}).join("")}</td>
                        <td class="money">${money(total)} ${esc(currencies)}</td>
                        <td>${paymentDays.map(function(day){return `<div>${esc(day)}</div>`;}).join("")}</td>
                        <td>${statusHtml}</td>
                        <td>${actions}</td>
                    </tr>`;
                }).join("")
                :
                `<tr><td colspan="7"><div class="empty">${t("noData")}</div></td></tr>`
            }
            </tbody></table></div>
        </div>
    </div>`;
}

function setSubscriptionStatusFilter(status){
    state.subscriptionFilterStatus=status||"all";
    renderSubscriptions();
}

async function saveSubscription(id){

    /*
     * =========================================
     * الحصول على العميل
     * =========================================
     */

    const customerId =
        Number(
            document.getElementById(
                "subCustomer"
            ).value
        );


    if(!customerId){

        showToast(
            t("customer"),
            true
        );

        return;

    }


    /*
     * =========================================
     * الحصول على كل صفوف الخدمات
     * =========================================
     */

    const serviceRows =
        Array.from(
            document.querySelectorAll(
                ".subscription-service-row"
            )
        );


    const services = [];


    /*
     * =========================================
     * قراءة الخدمات
     * =========================================
     */

    for(const row of serviceRows){

        const serviceSelect =
            row.querySelector(
                ".subscription-service-select"
            );


        const priceInput =
            row.querySelector(
                ".subscription-service-price"
            );


        const serviceId =
            serviceSelect
            ? Number(
                serviceSelect.value
            )
            : null;


        const price =
            priceInput
            ? Number(
                priceInput.value || 0
            )
            : 0;


        /*
         * لو الصف فاضي نتجاهله
         */

        if(!serviceId)
            continue;


        services.push({

            app_service_id:
                serviceId,

            price:
                price

        });

    }


    /*
     * =========================================
     * لازم خدمة واحدة على الأقل
     * =========================================
     */

    if(!services.length){

        showToast(
            "اختر خدمة واحدة على الأقل",
            true
        );

        return;

    }


    /*
     * =========================================
     * منع تكرار نفس الخدمة
     * =========================================
     */

    const serviceIds =
        services.map(
            x =>
                x.app_service_id
        );


    const uniqueServiceIds =
        new Set(
            serviceIds
        );


    if(
        uniqueServiceIds.size
        !== serviceIds.length
    ){

        showToast(
            "لا يمكن إضافة نفس الخدمة مرتين داخل الاشتراك",
            true
        );

        return;

    }


    /*
     * =========================================
     * أول خدمة
     *
     * نحفظها في subscriptions.app_service_id
     * للحفاظ على توافق النظام القديم
     * =========================================
     */

    const firstService =
        services[0];


    /*
     * =========================================
     * حساب إجمالي الخدمات
     * =========================================
     */

    const totalFee =
        services.reduce(

            function(total,item){

                return total +
                    Number(
                        item.price || 0
                    );

            },

            0

        );


    /*
     * =========================================
     * بيانات الاشتراك الأساسي
     * =========================================
     */

    const data = {

        customer_id:
            customerId,


        app_service_id:
            firstService.app_service_id,


        platform:
            document.getElementById(
                "subPlatform"
            ).value,


        page_name:
            document.getElementById(                "subPage"
            ).value,

        monthly_fee:
            totalFee,


        payment_day:
            Number(
                document.getElementById(
                    "subPaymentDay"
                ).value || 1
            ),


        status:
            document.getElementById(
                "subStatus"
            ).value,


        page_link:
            document.getElementById(
                "subPageLink"
            ).value,


        notes:
            document.getElementById(
                "subNotes"
            ).value,


        currency:
            state.settings.currency || "EGP",

        visa_card_id:
            document.getElementById("subVisaCard").value
            ? Number(document.getElementById("subVisaCard").value)
            : null,

        visa_name:
            getVisaCard(document.getElementById("subVisaCard").value)?.card_name || null,

        visa_last4:
            getVisaCard(document.getElementById("subVisaCard").value)?.last4 || null

    };


    try{

        let subscriptionId;


        /*
         * =========================================
         * تعديل اشتراك موجود
         * =========================================
         */

        if(id){

            const result =
                await db
                .from("subscriptions")
                .update(data)
                .eq("id",id)
                .select()
                .single();


            if(result.error)
                throw result.error;


            subscriptionId =
                result.data.id;


            /*
             * حذف الخدمات التابعة القديمة
             */

            const deleteServices =
                await db
                .from("subscription_services")
                .delete()
                .eq(
                    "subscription_id",
                    subscriptionId
                );


            if(deleteServices.error)
                throw deleteServices.error;

        }


        /*
         * =========================================
         * إنشاء اشتراك جديد
         * =========================================
         */

        else{

            const result =
                await db
                .from("subscriptions")
                .insert(data)
                .select()
                .single();


            if(result.error)
                throw result.error;


            subscriptionId =
                result.data.id;

        }


        /*
         * =========================================
         * تجهيز الخدمات التابعة للاشتراك
         * =========================================
         */

        const serviceData =
            services.map(

                function(service){

                    return {

                        subscription_id:
                            subscriptionId,


                        app_service_id:
                            service.app_service_id,


                        price:
                            service.price,


                        status:
                            data.status,


                        notes:
                            data.notes || ""

                    };

                }

            );


        /*
         * =========================================
         * حفظ الخدمات
         * =========================================
         */

        const servicesResult =
            await db
            .from("subscription_services")
            .insert(
                serviceData
            );


        if(servicesResult.error)
            throw servicesResult.error;


        /*
         * =========================================
         * إغلاق النافذة
         * =========================================
         */

        closeModal();


        /*
         * تحديث البيانات
         */

        await refresh();


        /*
         * رسالة نجاح
         */

        showToast(
            t("saved")
        );


    }catch(error){

        console.error(
            "saveSubscription error:",
            error
        );


        showToast(
            error.message,
            true
        );

    }

}

async function deleteSubscription(id){

    if(!confirm(
        state.lang==="ar"
        ?"هل تريد حذف الاشتراك؟"
        :"Delete subscription?"
    ))
    return;

    try{

        const result=
        await db
        .from("subscriptions")
        .delete()
        .eq("id",id);

        if(result.error)
            throw result.error;

        await refresh();

        showToast(t("deleted"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

function renderTraders(){

    document.getElementById("content")
    .innerHTML=`

    <div class="page-head">

        <div>

            <h1>${t("traders")}</h1>

        </div>

        <button
        class="gold-btn"
        onclick="openTraderModal()">

        <i class="fa-solid fa-plus"></i>

        ${t("newTrader")}

        </button>

    </div>


    <div
    class="grid"
    style="
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr))
    ">

    ${
    state.traders.slice().sort(function(A,B){

        function traderRank(trader){

            const customerIds=state.customers
                .filter(function(c){
                    return Number(c.trader_id)===Number(trader.id);
                })
                .map(function(c){
                    return Number(c.id);
                });

            const subs=state.subscriptions.filter(function(s){
                return customerIds.includes(Number(s.customer_id))
                    && s.status!=="inactive";
            });

            let best={rank:4,value:0};

            subs.forEach(function(s){

                const st=getPaymentState(s);

                if(st.type==="overdue"){

                    const due=subscriptionDueDate(s);
                    const today=dateOnly(isoDate(new Date()));
                    const days=Math.max(0,Math.round((today-due)/86400000));

                    if(best.rank>0 || (best.rank===0 && days> -best.value))
                        best={rank:0,value:-days};

                }else if(st.type==="due"){

                    if(best.rank>1)
                        best={rank:1,value:0};

                }else if(st.type==="upcoming"){

                    const due=subscriptionDueDate(s);
                    const today=dateOnly(isoDate(new Date()));
                    const days=Math.round((due-today)/86400000);

                    if(best.rank>2 || (best.rank===2 && days<best.value))
                        best={rank:2,value:days};

                }else if(st.type==="paid"){

                    if(best.rank>3)
                        best={rank:3,value:0};

                }

            });

            return best;
        }

        const a=traderRank(A);
        const b=traderRank(B);

        if(a.rank!==b.rank)
            return a.rank-b.rank;

        if(a.value!==b.value)
            return a.value-b.value;

        return Number(A.id)-Number(B.id);

    }).map(function(trader){

        const count=
        state.customers
        .filter(
            c=>
            Number(c.trader_id)
            ===Number(trader.id)
        ).length;

        return `

        <div class="card">

            <div class="card-body">

                <h3>
                ${esc(trader.trader_name)}
                </h3>

                <div class="muted">
                ${esc(trader.phone||"-")}
                </div>

                <div
                class="money"
                style="margin-top:10px">

                ${count}
                ${t("customers")}

                </div>

                <div
                class="actions"
                style="margin-top:12px">

                    <button
                    class="mini-btn"
                    onclick="openTraderAccount(${trader.id})">

                    ${t("open")}

                    </button>


                  <button
class="mini-btn"
title="رابط التاجر"
onclick="openTraderPortal(${trader.id})">

<i class="fa-solid fa-link"></i>

</button>

                    <button
                    class="mini-btn"
                    onclick="openTraderModal(${trader.id})">

                    <i class="fa-solid fa-pen"></i>

                    </button>

                    <button
                    class="mini-btn"
                    onclick="deleteTrader(${trader.id})">

                    <i class="fa-solid fa-trash"></i>

                    </button>

                </div>

            </div>

        </div>

        `;

    }).join("")
    ||

async function sendTraderPortalWhatsApp(
    phone,
    url,
    traderName
){

    let template = "";

    try{
        const result =
            await db
            .from("app_settings")
            .select("setting_value,updated_at")
            .eq("setting_key","wa_trader_portal")
            .order("updated_at",{ascending:false})
            .limit(1);

        if(result.error)
            throw result.error;

        template =
            result.data?.[0]?.setting_value
            || state.settings.wa_trader_portal
            || "";
    }catch(error){
        template = state.settings.wa_trader_portal || "";
    }

    if(!template){
        template =
            "مرحباً {{trader_name}}\n\nهذا هو رابط حساب التاجر الخاص بك:\n{{portal_link}}\n\nيمكنك فتح الرابط لمتابعة العملاء والاشتراكات الخاصة بك.";
    }

    const message = buildPortalMessage(
        template,
        {
            client_name: "",
            trader_name: traderName || "",
            portal_link: url,
            company_name: state.settings.company_name || "BADGEIFY"
        }
    );

    openWhatsAppBusiness(phone, message);

}

function openTraderAccount(traderId){

    const trader=getTrader(traderId);

    const customers=state.customers.filter(
        c=>Number(c.trader_id)===Number(traderId)
    );

    const customerIds=customers.map(c=>Number(c.id));

    const subscriptions=state.subscriptions.filter(
        s=>customerIds.includes(Number(s.customer_id)) && s.status!=="inactive"
    );

    const total=subscriptions.reduce(
        (sum,s)=>sum+Number(s.monthly_fee||0),0
    );

    const payments=state.payments.filter(function(p){
        const s=getSubscription(p.subscription_id);
        return s && customerIds.includes(Number(s.customer_id));
    });

    const paid=payments.reduce(
        (sum,p)=>sum+Number(p.amount||0),0
    );

    function servicesForSubscription(subscription){
        const childRows=state.subscriptionServices.filter(function(row){
            return String(row.subscription_id)===String(subscription.id);
        });

        if(childRows.length){
            return childRows
                .map(function(row){
                    return getService(row.app_service_id||row.service_id);
                })
                .filter(Boolean);
        }

        const service=getService(subscription.app_service_id);
        return service?[service]:[];
    }

    openModal(
        `${t("trader")} — ${esc(trader?.trader_name||"-")}`,

        `
        <div class="stats grid" style="grid-template-columns:repeat(3,1fr)">

            <div class="stat">
                <h2>${customers.length}</h2>
                <p>${t("customers")}</p>
            </div>

            <div class="stat">
                <h2>${money(total)}</h2>
                <p>${t("expected")}</p>
            </div>

            <div class="stat">
                <h2>${money(paid)}</h2>
                <p>${t("paid")}</p>
            </div>

        </div>

        <div class="card" style="margin-top:15px">

            <div class="card-head">
                <h3>${t("customers")}</h3>
                <span class="muted">${customers.length} ${t("customers")}</span>
            </div>

            <div class="card-body">

                ${
                customers.length
                ?
                customers.map(function(c){

                    const customerSubscriptions=subscriptions.filter(function(s){
                        return Number(s.customer_id)===Number(c.id);
                    });

                    const customerTotal=customerSubscriptions.reduce(
                        (sum,s)=>sum+Number(s.monthly_fee||0),0
                    );

                    return `
                    <div class="card" style="margin-bottom:14px;border-color:rgba(24,119,242,.22);">

                        <div class="card-head" style="background:rgba(24,119,242,.05)">

                            <div>
                                <h3>${esc(c.client_name||"-")}</h3>
                                ${c.phone?`<div class="muted">${esc(c.phone)}</div>`:""}
                            </div>

                            <div style="text-align:left">
                                <div class="money">
                                    ${money(customerTotal)} ${esc(state.settings.currency||"EGP")}
                                </div>

                                </div>
                            </div>

                        </div>

                        <div class="card-body">

                            ${
                            customerSubscriptions.length
                            ?
                            customerSubscriptions.map(function(s){

                                const services=servicesForSubscription(s);
                                const paymentState=getPaymentState(s);

                                const serviceNames=services
                                    .map(function(service){return service.service_name;})
                                    .filter(Boolean)
                                    .join(" + ");

                                return `

async function saveCustomerInvoice(){

    const customerId=
    Number(
        document.getElementById(
            "invoiceCustomer"
        ).value
    );

    const subscriptionId=
    document.getElementById(
        "invoiceSubscription"
    ).value
    ||
    null;

    const amount=
    Number(
        document.getElementById(
            "invoiceAmount"
        ).value||0
    );

    const discount=
    Number(
        document.getElementById(
            "invoiceDiscount"
        ).value||0
    );

    const total=
    Math.max(
        0,
        amount-discount
    );

    if(!customerId){

        showToast(
            t("customer"),
            true
        );

        return;

    }

    try{

        const number=
        generateInvoiceNumber();

        const result=
        await db
        .from("invoices")
        .insert({

            invoice_number:number,

            customer_id:
            customerId,

            trader_id:null,

            subscription_id:
            subscriptionId,

            invoice_type:"customer",

            invoice_date:
            isoDate(new Date()),

            subtotal:amount,

            discount:discount,

            total:total,

            currency:
            state.settings.currency||"EGP",

            status:
            document.getElementById(
                "invoiceStatus"
            ).value,

            notes:
            document.getElementById(
                "invoiceNotes"
            ).value

        })
        .select()
        .single();

        if(result.error)
            throw result.error;


        if(subscriptionId){

            const s=
            getSubscription(
                subscriptionId
            );

            await db
            .from("invoice_items")
            .insert({

                invoice_id:
                result.data.id,

                subscription_id:
                subscriptionId,

                service_name:
                getService(
                    s?.app_service_id
                )?.service_name
                ||
                "Service",

                quantity:1,

                unit_price:amount,

                discount:discount,

                total:total

            });

        }

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

function calculateTraderInvoice(){

    const checks=
    document.querySelectorAll(
        ".traderInvoiceCheck:checked"
    );

    let total=0;

    checks.forEach(function(check){

        total+=
        Number(
            check.dataset.amount||0
        );

    });

    document.getElementById(
        "traderInvoiceTotal"
    ).textContent=
    `${t("total")}: ${money(total)} ${state.settings.currency||"EGP"}`;

}


async function createTraderInvoice(){

    const traderId=
    Number(
        document.getElementById(
            "combinedTrader"
        ).value
    );

    const checks=
    [...document.querySelectorAll(
        ".traderInvoiceCheck:checked"
    )];

    if(!traderId){

        showToast(
            t("chooseTrader"),
            true
        );

        return;

    }

    if(!checks.length){

        showToast(
            t("selectSubscriptions"),
            true
        );

        return;

    }

    const subscriptions=
    checks.map(
        check=>
        getSubscription(
            check.value
        )
    ).filter(Boolean);

    const subtotal=
    subscriptions.reduce(
        (sum,s)=>
        sum+Number(s.monthly_fee||0),
        0
    );

    try{

        const number=
        generateInvoiceNumber("TR");

        const invoice=
        await db
        .from("invoices")
        .insert({

            invoice_number:number,

            customer_id:null,

            trader_id:traderId,

            subscription_id:null,

            invoice_type:"trader",

            invoice_date:
            isoDate(new Date()),

            subtotal:subtotal,

            discount:0,

            total:subtotal,

            currency:
            state.settings.currency||"EGP",

            status:"unpaid",

            notes:
            "Combined trader invoice"

        })
        .select()
        .single();

        if(invoice.error)
            throw invoice.error;


        const items=
        subscriptions.map(function(s){

            return {

                invoice_id:
                invoice.data.id,

                subscription_id:
                s.id,

                service_name:
                getService(
                    s.app_service_id
                )?.service_name
                ||
                "Service",

                description:
                getCustomer(
                    s.customer_id
                )?.client_name
                ||
                "",

                quantity:1,

                unit_price:
                Number(s.monthly_fee||0),

                discount:0,

                total:
                Number(s.monthly_fee||0)

            };

        });


        const itemsResult=
        await db
        .from("invoice_items")
        .insert(items);

        if(itemsResult.error)
            throw itemsResult.error;


        await logActivity(
            "CREATE",
            "trader_invoice",
            invoice.data.id,
            number
        );

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


function generateInvoiceNumber(prefix="INV"){

    const date=
    new Date();

    return prefix
    +"-"
    +date.getFullYear()
    +String(
        date.getMonth()+1
    ).padStart(2,"0")
    +"-"
    +Date.now()
    .toString()
    .slice(-6);

}

        /* البحث عن رابط فعال */

        let result = await db
            .from("customer_portal_tokens")
            .select("id,token,is_active")
            .eq("customer_id", customerId)
            .eq("is_active", true)
            .order("id", {ascending:false})

   PORTAL WHATSAPP MESSAGES
========================================= */

function buildPortalMessage(template, values){

    return String(template || "").replace(
        /{{(client_name|trader_name|portal_link|company_name)}}/g,
        function(_, key){
            return values[key] ?? "";
        }
    );

}

function openWhatsAppBusiness(number, message){

    number = whatsappNumber(number);

    if(!number){
        showToast("رقم الهاتف غير صحيح", true);
        return;
    }

    const encodedMessage =
        encodeURIComponent(message || "");

    const normalUrl =
        "https://wa.me/"
        + number
        + "?text="
        + encodedMessage;

    if(/Android/i.test(navigator.userAgent)){

        const businessIntent =
            "intent://send"
            + "?phone=" + number
            + "&text=" + encodedMessage
            + "#Intent;"
            + "scheme=whatsapp;"
            + "package=com.whatsapp.w4b;"
            + "end";

        let fallbackTimer =
            setTimeout(function(){
                window.location.href = normalUrl;
            },1800);

        try{
            window.location.href = businessIntent;
        }catch(error){
            clearTimeout(fallbackTimer);
            window.location.href = normalUrl;
        }

    }else{

        window.open(
            normalUrl,
            "_blank"
        );

    }

}


/* إرسال رابط العميل على واتساب */

async function sendPortalWhatsApp(customerId, link){

    const customer = getCustomer(customerId);

    if(!customer){
        showToast("العميل غير موجود", true);
        return;
    }

    if(!customer.phone){
        showToast("لا يوجد رقم هاتف للعميل", true);
        return;
    }

    let template = "";

    try{
        const result =
            await db
            .from("app_settings")
            .select("setting_value,updated_at")
            .eq("setting_key","wa_customer_portal")
            .order("updated_at",{ascending:false})
            .limit(1);

        if(result.error)
            throw result.error;

        template =
            result.data?.[0]?.setting_value
            || state.settings.wa_customer_portal
            || "";
    }catch(error){
        template = state.settings.wa_customer_portal || "";
    }

    if(!template){
        template =
            "السلام عليكم {{client_name}}\n\nيمكنك متابعة اشتراكاتك والمدفوعات الخاصة بك من خلال بوابة العميل:\n\n{{portal_link}}\n\nBADGEIFY";
    }

    const message = buildPortalMessage(
        template,
        {
            client_name: customer.client_name || "",
            trader_name: "",
            portal_link: link,
            company_name: state.settings.company_name || "BADGEIFY"
        }
    );

    openWhatsAppBusiness(customer.phone, message);

}

            });

        html+=`</div>`;

        html+=`<div class="notification-recipient-section"><div class="notification-recipient-section-title">التجار المفعّلون</div>`;

function urlBase64ToUint8Array(base64String){
    const padding="=".repeat((4-base64String.length%4)%4);
    const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
    const rawData=atob(base64);
    return Uint8Array.from([...rawData].map(char=>char.charCodeAt(0)));
}

function getSubscriptionDueDate(sub){
    if(!sub) return null;
    if(sub.due_date) return new Date(sub.due_date+"T00:00:00");

    const day=Number(sub.payment_day||0);
    if(!day) return null;

    const now=new Date();
    const d=new Date(now.getFullYear(),now.getMonth(),day);
    if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate())){
        d.setMonth(d.getMonth()+1);
    }
    return d;
}

function getSubscriptionAlertState(sub){
    if(!sub || String(sub.status||"").toLowerCase()==="paid") return null;

    const due=getSubscriptionDueDate(sub);
    if(!due || Number.isNaN(due.getTime())) return null;

    const today=new Date();
    const a=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const b=new Date(due.getFullYear(),due.getMonth(),due.getDate());
    const diff=Math.round((b-a)/86400000);

    if(diff<0) return {type:"overdue",days:Math.abs(diff)};
    if(diff===0) return {type:"today",days:0};
    if(diff===1) return {type:"tomorrow",days:1};
    if(diff===2) return {type:"two_days",days:2};
    return null;
}

function buildDueAlerts(){
    const alerts=[];
    (state.subscriptions||[]).forEach(function(sub){
        const alert=getSubscriptionAlertState(sub);
        if(!alert) return;

        const customer=getCustomer(sub.customer_id);
        const name=customer?.client_name || "عميل";
        const amount=Number(sub.monthly_fee||0);
        const currency=sub.currency || state.settings.currency || "EGP";

        let body="";
        if(alert.type==="overdue"){
            body=`اشتراك ${name} متأخر عن السداد منذ ${alert.days} يوم.`;
        }else if(alert.type==="today"){
            body=`اشتراك ${name} مستحق السداد اليوم.`;
        }else if(alert.type==="tomorrow"){
            body=`اشتراك ${name} مستحق السداد غدًا.`;
        }else{
            body=`اشتراك ${name} مستحق السداد بعد يومين.`;
        }

        alerts.push({
            id:String(sub.id)+"_"+alert.type,
            title:"تنبيه BADGEIFY",
            body:amount ? body+" المبلغ: "+amount+" "+currency : body
        });
    });
    return alerts;
}

async function showAutomaticDueNotifications(){
    if(!("Notification" in window) || Notification.permission!=="granted") return;

    const alerts=buildDueAlerts();
    if(!alerts.length) return;

    const sentKey="badgeify_sent_due_notifications_"+new Date().toISOString().slice(0,10);
    const sent=JSON.parse(localStorage.getItem(sentKey)||"[]");
    const reg=await navigator.serviceWorker.ready;

    for(const alert of alerts){
        if(sent.includes(alert.id)) continue;

        if(reg.active){
            reg.active.postMessage({
                type:"SHOW_NOTIFICATION",
                title:alert.title,
                body:alert.body,
                tag:"badgeify-"+alert.id
            });
        }
        sent.push(alert.id);
    }

    localStorage.setItem(sentKey,JSON.stringify(sent));
}
