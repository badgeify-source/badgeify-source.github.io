<style>

:root{
    --bg:#090b0f;
    --panel:#11151b;
    --panel2:#171c23;
    --border:#252c35;
    --text:#f4f5f7;
    --muted:#9299a5;
    --gold:#1877f2;
    --gold2:#5aa7ff;
    --green:#35c98a;
    --red:#ef6262;
    --blue:#42a5f5;
    --shadow:0 18px 50px rgba(0,0,0,.28);
}

body.light{
    --bg:#f3f4f6;
    --panel:#ffffff;
    --panel2:#f0f2f5;
    --border:#dfe3e8;
    --text:#17191d;
    --muted:#69717d;
    --shadow:0 12px 35px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Cairo,sans-serif;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;

    background:
    radial-gradient(
        circle at 20% 20%,
        rgba(24,119,242,.14),
        transparent 35%
    ),
    var(--bg);
}

.login-box{
    width:min(430px,100%);
    padding:35px;

    background:var(--panel);
    border:1px solid var(--border);
    border-radius:25px;

    box-shadow:var(--shadow);
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:30px;
}

.logo-icon{
    width:48px;
    height:48px;

    border-radius:15px;

    display:grid;
    place-items:center;

    background:
    linear-gradient(
        135deg,
        var(--gold2),
        var(--gold)
    );

    color:#111;
    font-size:22px;
    font-weight:900;
}

.logo-title{
    font-size:22px;
    font-weight:800;
}

.logo-sub{
    color:var(--muted);
    font-size:11px;
}

.field{
    margin-bottom:14px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:11px;
    margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    padding:11px 12px;

    border:1px solid var(--border);
    border-radius:10px;

    outline:none;

    background:var(--panel2);
    color:var(--text);
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:var(--blue);
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.full{
    grid-column:1/-1;
}


/* SALEH FINANCE - PROFESSIONAL FORMS */
.finance-modal-shell{padding:2px 0}.finance-form-intro{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:18px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(24,119,242,.10),rgba(255,193,7,.06));border-radius:15px}.finance-form-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(24,119,242,.13);color:#5aa7ff;font-size:18px}.finance-form-intro h4{margin:0 0 4px;font-size:15px}.finance-form-intro p{margin:0;color:var(--muted);font-size:11px}.finance-section-title{grid-column:1/-1;font-size:11px;color:var(--gold2);font-weight:800;padding:4px 2px 0;border-bottom:1px solid var(--border);padding-bottom:8px}.finance-field{position:relative}.finance-field label{font-size:11px;font-weight:700}.finance-field input,.finance-field select,.finance-field textarea{transition:.2s;min-height:43px}.finance-field textarea{min-height:90px}.finance-field input:focus,.finance-field select:focus,.finance-field textarea:focus{box-shadow:0 0 0 3px rgba(24,119,242,.10);border-color:#1877f2}.finance-required label:after{content:' *';color:#ef6262}.finance-modal-actions{width:100%;justify-content:flex-start}.finance-modal-actions button{min-width:105px;font-weight:800}.modal-box.finance-modal{width:min(760px,100%);border-radius:24px}.modal-box.finance-modal .modal-head{padding:18px 22px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}.modal-box.finance-modal .modal-body{padding:20px 22px}.modal-box.finance-modal .modal-foot{padding:15px 22px;background:rgba(0,0,0,.06)}
@media(max-width:800px){.modal-box.finance-modal{width:100%;border-radius:18px}.modal-box.finance-modal .modal-body{padding:16px}.finance-form-intro{padding:12px}.finance-modal-actions{flex-direction:column-reverse}.finance-modal-actions button{width:100%}}

/* APP */

.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;

    right:0;
    top:0;
    bottom:0;

    width:270px;

    background:var(--panel);
    border-left:1px solid var(--border);

    padding:20px 15px;

    z-index:20;

    overflow:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;

    padding:7px 8px 22px;
}

.brand .logo-icon{
    width:44px;
    height:44px;
}

.brand-name{
    font-weight:800;
    font-size:20px;
}

.brand-sub{
    color:var(--muted);
    font-size:10px;
}

.nav-title{
    color:var(--muted);
    font-size:10px;
    margin:15px 10px 7px;
}

.nav button{
    width:100%;

    border:0;

    background:transparent;
    color:var(--muted);

    padding:11px 13px;

    border-radius:11px;

    display:flex;
    align-items:center;
    gap:11px;

    text-align:right;

    margin:3px 0;
}

.nav button:hover,
.nav button.active{
    background:rgba(24,119,242,.12);
    color:var(--gold2);
}

.nav i{
    width:19px;
    text-align:center;
}

.main{
    width:calc(100% - 270px);
    margin-right:270px;
}

.topbar{
    height:74px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 28px;

    position:sticky;
    top:0;

    background:rgba(9,11,15,.90);

    backdrop-filter:blur(15px);

    z-index:10;
}

body.light .topbar{
    background:rgba(243,244,246,.90);
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-btn,
.ghost-btn,
.gold-btn,
.red-btn,
.mini-btn{
    border:1px solid var(--border);

    border-radius:10px;

    background:var(--panel);
    color:var(--text);

    padding:9px 12px;
}

.icon-btn{
    width:42px;
    height:42px;
    padding:0;
}

.gold-btn{
    background:
    linear-gradient(
        135deg,
        var(--gold2),
        var(--gold)
    );

    border-color:transparent;

    color:#111;
    font-weight:800;
}

.red-btn{
    background:var(--red);
    color:white;
    border-color:transparent;
}

.ghost-btn:hover,
.icon-btn:hover,
.mini-btn:hover{
    border-color:var(--gold);
}

.content{
    max-width:1500px;
    margin:auto;
    padding:28px;
}

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:20px;
}

.page-head h1{
    margin:0;
    font-size:27px;
}

.page-head p{
    margin:5px 0 0;

    color:var(--muted);
    font-size:12px;
}

.page-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

/* CARDS */

.grid{
    display:grid;
    gap:16px;
}

.stats{
    grid-template-columns:repeat(4,1fr);
}

.stat{
    background:var(--panel);

    border:1px solid var(--border);

    border-radius:17px;

    padding:20px;

    box-shadow:var(--shadow);
}

.stat-icon{
    width:42px;
    height:42px;

    border-radius:12px;

    display:grid;
    place-items:center;

    background:rgba(214,179,90,.12);

    color:var(--gold2);

    margin-bottom:13px;
}

.stat h2{
    margin:0;
    font-size:26px;
}

.stat p{
    margin:4px 0 0;

    color:var(--muted);
    font-size:11px;
}

.card{
    background:var(--panel);

    border:1px solid var(--border);

    border-radius:17px;

    box-shadow:var(--shadow);
}

.card-head{
    padding:16px 18px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.card-head h3{
    margin:0;
    font-size:14px;
}

.card-body{
    padding:18px;
}

.cols{
    grid-template-columns:1.4fr 1fr;
}

/* TABLE */

.table-wrap{
    overflow:auto;
}

.table{
    width:100%;
    border-collapse:collapse;
    min-width:760px;
}

.table th,
.table td{
    padding:12px;

    border-bottom:1px solid var(--border);

    text-align:right;

    font-size:11px;

    vertical-align:middle;
}

.table th{
    color:var(--muted);
}

.table tr:hover td{
    background:rgba(214,179,90,.035);
}

.actions{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.mini-btn{
    padding:6px 8px;
    font-size:10px;
}

.mini-btn.wa{
    color:#36d995;
}

.mini-btn.pay{
    color:var(--gold2);
}

.badge{
    display:inline-flex;

    padding:5px 9px;

    border-radius:999px;

    font-size:9px;

    font-weight:700;
}

.badge.paid{
    background:rgba(53,201,138,.13);
    color:var(--green);
}

.badge.overdue{
    background:rgba(239,98,98,.13);
    color:var(--red);
}

.badge.due{
    background:rgba(214,179,90,.13);
    color:var(--gold2);
}

.badge.upcoming{
    background:rgba(93,168,255,.12);
    color:var(--blue);
}

.badge.inactive{
    background:rgba(140,150,165,.13);
    color:var(--muted);
}


/* BADGEIFY SUBSCRIPTION FILTER */
.subscription-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.subscription-filter-btn{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);text-align:center}
.subscription-filter-btn:hover,.subscription-filter-btn.active{border-color:var(--gold);background:rgba(214,179,90,.12);color:var(--gold2)}
.subscription-filter-btn b{display:block;font-size:18px;margin-bottom:2px}.subscription-filter-btn span{color:var(--muted);font-size:10px}.subscription-filter-btn small{display:block;margin-top:3px;font-size:10px;color:var(--gold2)}
.field select option,.search select option,.subscription-service-select option{background:#111b2a;color:#f7faff}
body.light .field select option,body.light .search select option,body.light .subscription-service-select option{background:#fff;color:#17191d}
@media(max-width:600px){.subscription-filters{grid-template-columns:repeat(2,1fr)}}
/* SEARCH */

.search{
    display:flex;
    gap:8px;

    margin-bottom:15px;
}

.search input,
.search select{
    padding:10px;

    background:var(--panel2);

    border:1px solid var(--border);

    color:var(--text);

    border-radius:10px;
}

/* CALENDAR */

.calendar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.day{
    min-height:125px;

    background:var(--panel2);

    border:1px solid var(--border);

    border-radius:13px;

    padding:10px;
}

.day.today{
    border-color:var(--gold);
}

.day-head{
    display:flex;
    justify-content:space-between;

    font-size:10px;

    margin-bottom:7px;
}

.day-head b{
    color:var(--gold2);
}

.event{
    padding:7px;

    border-radius:7px;

    background:var(--panel);

    font-size:9px;

    margin-top:5px;

    border-right:3px solid var(--gold);
}

.event.over{
    border-right-color:var(--red);
}

/* LIST */

.list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.list-item{
    background:var(--panel2);

    border-radius:10px;

    padding:10px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.muted{
    color:var(--muted);
}

.money{
    color:var(--gold2);
    font-weight:800;
}

/* MODAL */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.67);

    backdrop-filter:blur(5px);

    display:grid;

    place-items:center;

    padding:15px;

    z-index:100;
}

.modal-box{
    width:min(800px,100%);

    max-height:92vh;

    overflow:auto;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:20px;

    box-shadow:0 30px 90px #0008;
}

.modal-head{
    padding:16px 20px;

    border-bottom:1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.modal-head h3{
    margin:0;
}

.modal-body{
    padding:20px;
}

.modal-foot{
    padding:14px 20px;

    border-top:1px solid var(--border);

    display:flex;

    gap:8px;
}

/* TOAST */

.toast{
    position:fixed;

    bottom:20px;
    left:20px;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:12px;

    padding:13px 16px;

    z-index:200;

    box-shadow:var(--shadow);
}

.toast.ok{
    border-color:rgba(53,201,138,.5);
}

.toast.err{
    border-color:rgba(239,98,98,.5);
}

.empty{
    text-align:center;

    padding:30px 10px;

    color:var(--muted);
}


/* RESPONSIVE */

@media(max-width:1100px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .cols{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:800px){

    .sidebar{
        width:72px;
        padding:15px 7px;
    }

    .brand-name,
    .brand-sub,
    .nav-title,
    .nav span{
        display:none;
    }

    .brand{
        justify-content:center;
    }

    .nav button{
        justify-content:center;
    }

    .main{
        width:calc(100% - 72px);
        margin-right:72px;
    }

    .content{
        padding:16px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:520px){

    .stats{
        grid-template-columns:1fr;
    }

    .calendar{
        grid-template-columns:1fr;
    }

    .page-head{
        flex-direction:column;
        align-items:flex-start;
    }

}


/* BADGEIFY BLUE IDENTITY + MOBILE COMPACT UI */
.logo-icon{
    overflow:hidden;
    background:linear-gradient(135deg,#1877f2,#0b1f3a);
    border:1px solid rgba(90,167,255,.35);
    box-shadow:0 8px 24px rgba(24,119,242,.18);
}
.brand-logo-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    border-radius:inherit;
}
.gold-btn{
    box-shadow:0 8px 22px rgba(24,119,242,.18);
}
.nav button:hover,.nav button.active{
    box-shadow:inset 0 0 0 1px rgba(24,119,242,.10);
}
@media(max-width:800px){
    .sidebar{
        width:58px;
        padding:10px 5px;
    }
    .brand{
        padding:4px 2px 14px;
    }
    .brand .logo-icon{
        width:38px;
        height:38px;
    }
    .nav button{
        min-height:42px;
        padding:8px 4px;
        margin:2px 0;
        border-radius:9px;
    }
    .nav i{
        width:auto;
        font-size:15px;
    }
    .main{
        width:calc(100% - 58px);
        margin-right:58px;
    }
    .topbar{
        height:58px;
        padding:0 10px;
    }
    .icon-btn{
        width:36px;
        height:36px;
    }
    .content{
        padding:11px;
    }
    .page-head{
        gap:9px;
        margin-bottom:12px;
    }
    .page-head h1,.page-title{
        font-size:18px!important;
    }
    .card{
        border-radius:12px;
    }
    .stats{
        gap:8px;
    }
    .stat-card{
        padding:11px!important;
        min-height:0!important;
    }
    .stat-card .stat-value{
        font-size:20px!important;
    }
    .btn,.gold-btn,.ghost-btn,.red-btn,.mini-btn{
        padding:8px 10px;
        border-radius:9px;
        font-size:12px;
    }
    .field label{
        font-size:10px;
    }
    .field input,.field select,.field textarea,
    .search input,.search select{
        padding:9px 10px;
        font-size:12px;
    }
    .modal{
        padding:8px;
    }
    .modal-box{
        max-height:95vh;
        border-radius:15px;
    }
    .modal-head{
        padding:12px 14px!important;
    }
    .list-item{
        padding:8px;
        gap:7px;
    }
}
@media(max-width:520px){
    .login{padding:12px;}
    .login-box{padding:22px 16px;border-radius:18px;}
    .logo{margin-bottom:20px;}
    .logo-icon{width:42px;height:42px;}
    .logo-title{font-size:19px;}
    .logo-sub{font-size:9px;}
    .top-actions{gap:4px;}
    .top-actions .ghost-btn{padding:7px 8px;font-size:11px;}
    .calendar{gap:6px;}
    .day{min-height:105px;padding:8px;}
}

/* BADGEIFY PREMIUM UI REFRESH */
:root{
 --bg:#060b14;
 --panel:#0d1420;
 --panel2:#111b2a;
 --border:rgba(255,255,255,.075);
 --text:#f7faff;
 --muted:#8f9bad;
 --gold:#1877f2;
 --gold2:#63b3ff;
 --blue:#42a5f5;
 --shadow:0 20px 60px rgba(0,0,0,.35);
}
body{
 background:
 radial-gradient(circle at 85% -10%,rgba(24,119,242,.13),transparent 32%),
 radial-gradient(circle at 10% 100%,rgba(66,165,245,.06),transparent 30%),
 var(--bg);
}
.sidebar{
 background:linear-gradient(180deg,rgba(13,20,32,.98),rgba(7,12,20,.98));
 border-left:1px solid rgba(99,179,255,.10);
 box-shadow:-12px 0 45px rgba(0,0,0,.16);
}
.brand{
 padding-bottom:24px;
}
.brand .logo-icon,.login .logo-icon{
 position:relative;
 box-shadow:0 0 0 1px rgba(99,179,255,.15),0 12px 30px rgba(24,119,242,.22);
}
.brand-logo-image{
 object-fit:cover;
}
.brand-name,.logo-title{
 letter-spacing:.4px;
}
.brand-sub,.logo-sub{
 letter-spacing:1px;
}
.topbar{
 background:rgba(6,11,20,.78);
 border-bottom:1px solid rgba(255,255,255,.06);
}
.content{
 padding-top:30px;

/* =========================================
   UI HELPERS
========================================= */

function esc(value){

    return String(value ?? "")
    .replace(/[&<>"']/g,function(x){

        return {
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[x];

    });

}


function money(value){

    return new Intl.NumberFormat(
        state.lang==="ar"?"ar-EG":"en-US",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ).format(Number(value||0));

}


function dateOnly(value){

    if(!value) return null;

    const p=
    String(value)
    .slice(0,10)
    .split("-")
    .map(Number);

    return new Date(
        p[0],
        p[1]-1,
        p[2]
    );

}


function isoDate(date){

    const y=date.getFullYear();

    const m=
    String(date.getMonth()+1)
    .padStart(2,"0");

    const d=
    String(date.getDate())
    .padStart(2,"0");

    return `${y}-${m}-${d}`;

}


function formatDate(value){

    const d=dateOnly(value);

    if(!d) return "-";

    return new Intl.DateTimeFormat(
        state.lang==="ar"?"ar-EG":"en-GB",
        {
            year:"numeric",
            month:"short",
            day:"numeric"
        }
    ).format(d);

}


function monthKey(date){

    return date.getFullYear()
    +"-"
    +String(date.getMonth()+1).padStart(2,"0");

}


function clampDay(year,month,day){

    return Math.min(
        Number(day||1),
        new Date(year,month+1,0).getDate()
    );

}


/* =========================================
   PAYMENT DATE
========================================= */

/*
    لا يوجد تاريخ بداية
    ولا يوجد تاريخ تجديد.

    يوم الدفع فقط هو الأساس.
*/

function subscriptionDueDate(subscription){

    const now=new Date();

    const day=
    Number(
        subscription.payment_day
        ||subscription.renewal_day
        ||1
    );

    return new Date(
        now.getFullYear(),
        now.getMonth(),
        clampDay(
            now.getFullYear(),
            now.getMonth(),
            day
        )
    );

}


function paymentExistsForPeriod(
    subscription,
    dueDate
){

    const key=monthKey(dueDate);

    return state.payments.some(function(payment){

        return Number(payment.subscription_id)
        ===Number(subscription.id)

        &&
        payment.paid_month===key;

    });

}


function periodDueDate(subscription, year, month){
    const day=Number(subscription.payment_day || subscription.renewal_day || 1);
    return new Date(year, month, clampDay(year, month, day));
}

function getSubscriptionPeriods(subscription){
    if(!subscription || subscription.status==="inactive") return [];
    const now=new Date();
    const currentStart=new Date(now.getFullYear(),now.getMonth(),1);
    const currentKey=monthKey(now);

    let startDate=subscription.created_at ? dateOnly(subscription.created_at) : null;
    const payments=state.payments.filter(function(payment){
        return Number(payment.subscription_id)===Number(subscription.id);
    });

    payments.forEach(function(payment){
        const key=String(payment.paid_month||"");
        if(/^\d{4}-\d{2}$/.test(key)){
            const parts=key.split("-").map(Number);
            const d=new Date(parts[0],parts[1]-1,1);
            if(!startDate || d<new Date(startDate.getFullYear(),startDate.getMonth(),1)) startDate=d;
        }
    });

    if(!startDate) startDate=new Date(now.getFullYear(),now.getMonth()-1,1);
    else startDate=new Date(startDate.getFullYear(),startDate.getMonth(),1);
    if(startDate>currentStart) startDate=currentStart;

    const periods=[];
    let cursor=new Date(startDate);

    while(cursor<=currentStart){
        const key=monthKey(cursor);
        const due=periodDueDate(subscription,cursor.getFullYear(),cursor.getMonth());
        const paid=payments.some(function(payment){return String(payment.paid_month||"")===key;});
        const today=dateOnly(isoDate(new Date()));

        let type="upcoming";
        let text=t("upcoming");

        if(paid){
            type="paid";
            text=t("paid");
        }else{
            const diff=Math.round((today-due)/86400000);
            if(diff>0){
                type="overdue";
                text=state.lang==="ar" ? t("overdue")+" "+diff+" يوم" : diff+" days overdue";
            }else if(diff===0){
                type="due";
                text=t("dueToday");
            }
        }

        if(key===currentKey || !paid){
            periods.push({
                periodKey:key,
                dueDate:due,
                periodType:type,
                periodText:text,
                monthLabel:new Intl.DateTimeFormat(state.lang==="ar"?"ar-EG":"en-US",{year:"numeric",month:"long"}).format(due)
            });
        }

        cursor.setMonth(cursor.getMonth()+1);
    }

    return periods;
}

function getCurrentSubscriptionPeriod(subscription){
    const key=monthKey(new Date());
    const periods=getSubscriptionPeriods(subscription);
    return periods.find(function(p){return p.periodKey===key;}) || periods[periods.length-1] || null;
}

function getPaymentState(subscription){

    if(subscription.status==="inactive"){

        return {
            type:"inactive",
            text:t("inactive")
        };

    }

    const due=
    subscriptionDueDate(subscription);

    if(
        paymentExistsForPeriod(
            subscription,
            due
        )
    ){

        return {
            type:"paid",
            text:t("paid")
        };

    }

    const today=
    dateOnly(isoDate(new Date()));

    const diff=
    Math.round(
        (today-due)/86400000
    );

    if(diff>0){

        return {
            type:"overdue",
            text:
            state.lang==="ar"
            ?
            `${t("overdue")} ${diff} يوم`
            :
            `${diff} days overdue`
        };

    }

    if(diff===0){

        return {
            type:"due",
            text:t("dueToday")
        };

    }

    return {
        type:"upcoming",
        text:t("upcoming")
    };

}


function statusBadge(subscription){

    const st=
    getPaymentState(subscription);

    return `
    <span class="badge ${st.type}">
        ${esc(st.text)}
    </span>
    `;

}

async function loadTable(table){

    const result=
    await db
    .from(table)
    .select("*");

    if(result.error)
        throw result.error;

    return result.data||[];

}


async function loadData(){

    const result=

        loadTable("traders"),
        loadTable("app_services"),
        loadTable("subscriptions"),
        loadTable("subscription_services"),
        loadTable("subscription_payments"),
        loadTable("invoices"),

        loadTable("followups"),
        loadTable("activity_logs"),

    state.customers=result[0];
    state.visaCards=result[1];
    state.traders=result[2];
    state.services=result[3];
    state.subscriptions=result[4];

    state.followups=result[9];
    state.logs=result[10];

async function savePortalWhatsAppMessages(){

    const customerMessage =

    const traderMessage =
        document.getElementById("msgTraderPortal").value;

    const values = {
        wa_customer_portal: customerMessage,
        wa_trader_portal: traderMessage
    };

    try{

        for(const [key,value] of Object.entries(values)){

            const result =
                await db
                .from("app_settings")
                .upsert(
                    {
                        setting_key:key,
                        setting_value:value,
                        updated_at:new Date().toISOString()
                    },
                    {onConflict:"setting_key"}
                );

            if(result.error)
                throw result.error;

            // تحديث الذاكرة فوراً
            state.settings[key] = value;
        }

        // إعادة تحميل الإعدادات من Supabase للتأكد
        await loadData();
        render();

        showToast("تم حفظ رسائل روابط العملاء والتجار");

    }catch(error){

        showToast(error.message,true);

    }

}

function sendWhatsApp(
    customerId,
    subscriptionId,
    type
){

    const customer =
        state.customers.find(
            function(x){
                return String(x.id)===String(customerId);
            }
        );

    const subscription =
        state.subscriptions.find(
            function(x){
                return String(x.id)===String(subscriptionId);
            }
        );

    if(!customer){
        showToast(
            "العميل غير موجود",
            true
        );
        return;
    }

    const rawPhone =
        String(customer.phone || "").replace(/\\D/g,"");

    let number = rawPhone;

    if(number.startsWith("0")){
        number =
            "20" + number.substring(1);
    }

    if(!number || number.length < 10){
        showToast(
            "رقم هاتف العميل غير صحيح",
            true
        );
        return;
    }

    let template = "";

    if(type==="overdue"){
        template =
            state.settings.wa_overdue_reminder ||
            "السلام عليكم {{client_name}}\\nاشتراك {{service_name}} متأخر عن السداد. المبلغ المطلوب {{amount}} {{currency}}.";
    }else if(type==="due"){
        template =
            state.settings.wa_due_reminder ||
            "السلام عليكم {{client_name}}\\nاليوم موعد دفع اشتراك {{service_name}} بقيمة {{amount}} {{currency}}.";
    }else{
        template =
            state.settings.wa_payment_reminder ||
            "السلام عليكم {{client_name}}\\nنذكرك بموعد دفع اشتراك {{service_name}} بقيمة {{amount}} {{currency}}.";
    }

    const service =
        subscription
        ? state.services.find(function(x){
            return String(x.id)===String(subscription.app_service_id);
        })
        : null;

    const amount =
        subscription
        ? money(subscription.monthly_fee)
        : "";

    const currency =
        subscription?.currency ||
        state.settings.currency ||
        "EGP";

    const values = {
        client_name: customer.client_name || "",
        phone: customer.phone || "",
        service_name: service?.service_name || "",
        amount: amount,
        currency: currency,
        page_name: subscription?.page_name || "",
        platform: subscription?.platform || "",
        company_name: state.settings.company_name || "BADGEIFY"
    };

    const message =
        String(template).replace(
            /{{(\\w+)}}/g,
            function(_,key){
                return values[key] ?? "";
            }
        );

    const encodedMessage =
        encodeURIComponent(String(message || ""));

    const normalUrl =
        "https://wa.me/" +
        number +
        "?text=" +
        encodedMessage;

    /*
       عند إرسال رسالة الاشتراك من الموبايل:
       إجبار Android على فتح WhatsApp Business
       بدل WhatsApp العادي.
    */
    if(/Android/i.test(navigator.userAgent)){
        const businessIntent =
            "intent://send" +
            "?phone=" + number +
            "&text=" + encodedMessage +
            "#Intent;" +
            "scheme=whatsapp;" +
            "package=com.whatsapp.w4b;" +
            "end";

        let fallbackTimer = setTimeout(function(){
            window.location.href = normalUrl;
        }, 1500);

        try{
            window.location.href = businessIntent;
        }catch(error){
            clearTimeout(fallbackTimer);
            window.location.href = normalUrl;
        }
    }else{
        window.location.href = normalUrl;
    }

}

window.sendWhatsApp = sendWhatsApp;

function renderDashboard(){

    const active=
    state.subscriptions
    .filter(x=>x.status!=="inactive");

    const overdue=
    active
    .filter(
        x=>getPaymentState(x).type==="overdue"
    );

    const paid=
    state.payments
    .filter(
        x=>String(x.paid_month||"")
        ===monthKey(new Date())
    );

    const expected=
    active.reduce(
        (sum,x)=>
        sum+Number(x.monthly_fee||0),
        0
    );

    const paidAmount=
    paid.reduce(
        (sum,x)=>
        sum+Number(x.amount||0),
        0
    );

    const remainingAmount=
    Math.max(
        0,
        expected-paidAmount
    );

    const today=
    new Date();

    today.setHours(0,0,0,0);

    const currentMonthKey=
    monthKey(today);

    const previousMonthDate=
    new Date(
        today.getFullYear(),
        today.getMonth()-1,
        1
    );

    const previousMonthKey=
    monthKey(previousMonthDate);

    function isSubscriptionStartedInOrBefore(
        subscription,
        targetYear,
        targetMonth
    ){

        if(!subscription.created_at)
            return true;

        const created=
        dateOnly(subscription.created_at);

        if(!created)
            return true;

        return new Date(
            created.getFullYear(),
            created.getMonth(),
            1
        ) <=
        new Date(
            targetYear,
            targetMonth,
            1
        );

    }

    let overdueThisMonthAmount=0;
    let overduePreviousMonthAmount=0;

    active.forEach(function(subscription){

        const currentDue=
        periodDueDate(
            subscription,
            today.getFullYear(),
            today.getMonth()
        );

        const currentPaid=
        state.payments.some(function(payment){
            return Number(payment.subscription_id)
            ===Number(subscription.id)
            &&
            String(payment.paid_month||"")
            ===currentMonthKey;
        });

        if(
            currentDue<today
            &&
            !currentPaid
            &&
            isSubscriptionStartedInOrBefore(
                subscription,
                today.getFullYear(),
                today.getMonth()
            )
        ){

            overdueThisMonthAmount +=
            Number(subscription.monthly_fee||0);

        }

        const previousDue=
        periodDueDate(
            subscription,
            previousMonthDate.getFullYear(),
            previousMonthDate.getMonth()
        );

        const previousPaid=
        state.payments.some(function(payment){
            return Number(payment.subscription_id)
            ===Number(subscription.id)
            &&
            String(payment.paid_month||"")
            ===previousMonthKey;
        });

        if(
            !previousPaid
            &&
            isSubscriptionStartedInOrBefore(
                subscription,
                previousMonthDate.getFullYear(),
                previousMonthDate.getMonth()
            )
        ){

            overduePreviousMonthAmount +=
            Number(subscription.monthly_fee||0);

        }

    });

    document.getElementById("content")
    .innerHTML=`

    <div class="page-head">

        <div>

            <h1>${t("dashboard")}</h1>

            <p>
            BADGEIFY CRM
            </p>

        </div>

        <div class="page-actions">

            <button
            class="gold-btn"
            onclick="openCustomerModal()">

            <i class="fa-solid fa-user-plus"></i>

            ${t("newCustomer")}

            </button>

            <button
            class="ghost-btn"
            onclick="openSubscriptionModal()">

            <i class="fa-solid fa-plus"></i>

            ${t("newSubscription")}

            </button>

        </div>

    </div>


    <div class="grid stats">

function renderCalendar(){

    const active=
    state.subscriptions
    .filter(x=>x.status!=="inactive");

    let html="";

    for(
        let i=0;
        i<30;
        i++
    ){

        const date=
        new Date();

        date.setHours(0,0,0,0);

        date.setDate(
            date.getDate()+i
        );

        const dateString=
        isoDate(date);

        const subscriptions=
        active.filter(
            x=>
            isoDate(
                subscriptionDueDate(x)
            )===dateString
        );

        html+=`

        <div class="day
        ${i===0?"today":""}">

            <div class="day-head">

                <b>
                ${i===0
                ?t("today")
                :new Intl.DateTimeFormat(
                    state.lang==="ar"
                    ?"ar-EG"
                    :"en",
                    {weekday:"short"}
                ).format(date)}
                </b>

                <span>
                ${date.getDate()}/${date.getMonth()+1}
                </span>

            </div>

            ${
            subscriptions.length
            ?
            subscriptions.map(function(s){

                const st=
                getPaymentState(s);

                const c=
                getCustomer(s.customer_id);

                return `

                <div
                class="event
                ${st.type==="overdue"?"over":""}"
                onclick="openPaymentModal(${s.id},'${s._periodKey}')">

                <b>
                ${esc(c?.client_name||"-")}
                </b>

                <br>

                <span class="muted">

                ${esc(
                    getService(
                        s.app_service_id
                    )?.service_name
                    ||
                    s.platform
                    ||
                    "-"
                )}

                </span>

                </div>

                `;

            }).join("")
            :
            `<span class="muted">—</span>`
            }

        </div>

        `;

    }

    return html;

}


function renderRecentPayments(){

    const rows=

    .sort(
        (a,b)=>
        String(b.payment_date)

    if(!rows.length)
        return `<div class="empty">${t("noData")}</div>`;

    return `

    <div class="list">

    ${
    rows.map(function(payment){

        const s=
        getSubscription(
            payment.subscription_id

        const c=
        getCustomer(
            s?.customer_id

        return `

        <div class="list-item">

async function saveVisaCard(id){
    const name=document.getElementById("visaCardName").value.trim();
    const number=document.getElementById("visaCardNumber").value.replace(/\D/g,"");
    const old4=document.getElementById("visaCardLast4").value.trim();
    const last4=(number?number.slice(-4):old4).replace(/\D/g,"").slice(-4);
    if(!name){showToast(t("cardName"),true);return;}
    if(last4.length!==4){showToast("اكتب رقم الفيزا بشكل صحيح",true);return;}
    try{
      let result;
      if(id) result=await db.from("visa_cards").update({card_name:name,last4:last4}).eq("id",id);
      else result=await db.from("visa_cards").insert({card_name:name,last4:last4});
      if(result.error)throw result.error;
      closeModal();await refresh();showToast(t("saved"));
    }catch(error){showToast(error.message,true);}
}
async function deleteVisaCard(id){
    if(!confirm(state.lang==="ar"?"هل تريد حذف هذه الفيزا؟":"Delete this card?"))return;
    try{
      const result=await db.from("visa_cards").delete().eq("id",id);
      if(result.error)throw result.error;
      await refresh();showToast(t("deleted"));
    }catch(error){showToast(error.message,true);}
}

function sendCustomerWhatsApp(customerId){

    const customer = getCustomer(customerId);

    if(!customer){
        showToast("العميل غير موجود", true);
        return;
    }

    if(!customer.phone){
        showToast("لا يوجد رقم هاتف للعميل", true);
        return;
    }

    let number = String(customer.phone)
        .replace(/\D/g,"");

    if(number.startsWith("0")){
        number = "20" + number.substring(1);
    }

    if(!number){
        showToast("رقم الهاتف غير صحيح", true);
        return;
    }

    const message =
        "السلام عليكم " +
        (customer.client_name || "") +
        "\n\n" +
        "أهلاً بك في BADGEIFY.";

    const url =
        "https://wa.me/" +
        number +
        "?text=" +
        encodeURIComponent(message);

    window.open(url, "_blank");
}

async function saveCustomer(id){

    const data={

        client_name:
        document.getElementById(
            "customerName"
        ).value.trim(),

        client_type:
        document.getElementById(
            "customerType"
        ).value,

        phone:
        document.getElementById(
            "customerPhone"
        ).value.trim(),

        trader_id:
        Number(document.getElementById("customerTrader").value) || null,

        status:
        document.getElementById(
            "customerStatus"
        ).value,

        notes:
        document.getElementById(
            "customerNotes"
        ).value

    };

    if(!data.client_name){

        showToast(
            t("name"),
            true
        );

        return;

    }

    try{

        let result;

        if(id){

            result=
            await db
            .from("customers")
            .update(data)
            .eq("id",id);

        }else{

            result=
            await db
            .from("customers")
            .insert(data);

        }

        if(result.error)
            throw result.error;

        await logActivity(
            id?"UPDATE":"CREATE",
            "customer",
            id,
            data.client_name
        );

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

function periodStatusBadge(row){
    return '<span class="badge '+row._periodType+'">'+esc(row._periodText)+'</span><small class="muted" style="margin-right:6px">'+esc(row._periodLabel)+'</small>';
}

function renderSubscriptions(){
    const baseSubscriptions=state.subscriptions.filter(function(x){return x.status!=="inactive";});
    let rows=[];
    baseSubscriptions.forEach(function(subscription){
        getSubscriptionPeriods(subscription).forEach(function(period){
            rows.push(Object.assign({},subscription,{
                _periodKey:period.periodKey,
                _periodDueDate:period.dueDate,
                _periodType:period.periodType,
                _periodText:period.periodText,
                _periodLabel:period.monthLabel
            }));
        });
    });
    function servicesForSubscription(subscription){
        const childRows=state.subscriptionServices.filter(function(row){
            return String(row.subscription_id)===String(subscription.id);
        });
        if(childRows.length){
            return childRows.map(function(row){
                return getService(row.app_service_id||row.service_id);
            }).filter(Boolean);
        }
        const service=getService(subscription.app_service_id);
        return service?[service]:[];
    }
    const selectedService=document.getElementById("subscriptionServiceFilter")?.value||"";
    const selectedStatus=state.subscriptionFilterStatus||"all";

    let filteredRows=selectedService?rows.filter(function(subscription){
        return servicesForSubscription(subscription).some(function(service){
            return String(service.id)===String(selectedService);
        });
    }):rows;

    if(selectedStatus!=="all"){
        filteredRows=filteredRows.filter(function(subscription){
            return subscription._periodType===selectedStatus;
        });
    }

    const counts={
        all:rows.length,
        upcoming:rows.filter(x=>x._periodType==="upcoming").length,
        due:rows.filter(x=>x._periodType==="due").length,
        overdue:rows.filter(x=>x._periodType==="overdue").length,
        paid:rows.filter(x=>x._periodType==="paid").length
    };

    const totals={
        all:rows.reduce((sum,x)=>sum+Number(x.monthly_fee||0),0),
        upcoming:rows.filter(x=>x._periodType==="upcoming").reduce((sum,x)=>sum+Number(x.monthly_fee||0),0),
        due:rows.filter(x=>x._periodType==="due").reduce((sum,x)=>sum+Number(x.monthly_fee||0),0),
        overdue:rows.filter(x=>x._periodType==="overdue").reduce((sum,x)=>sum+Number(x.monthly_fee||0),0),
        paid:rows.filter(x=>x._periodType==="paid").reduce((sum,x)=>sum+Number(x.monthly_fee||0),0)
    };
    /*
     * ترتيب الاشتراكات:
     * 1) الأقدم في التأخير أولاً (7 أيام قبل يومين مثلاً)
     * 2) المستحق اليوم
     * 3) القادم، والأقرب أولاً
     * 4) المدفوع في النهاية
     *
     * ترتيب العملاء المجمعين يعتمد على أسوأ/أقرب اشتراك
     * داخل كل عميل، مع الحفاظ على تجميع خدمات العميل في بطاقة واحدة.
     */
    function subscriptionSortInfo(subscription){
        const paymentState={type:subscription._periodType};
        const due=subscription._periodDueDate || subscriptionDueDate(subscription);
        const today=dateOnly(isoDate(new Date()));
        const diff=due ? Math.round((today-due)/86400000) : 999999;

        if(paymentState.type==="overdue"){
            return {
                rank:0,
                distance:diff,
                dueTime:due ? due.getTime() : Number.MAX_SAFE_INTEGER
            };
        }

        if(paymentState.type==="due"){
            return {
                rank:1,
                distance:0,
                dueTime:due ? due.getTime() : Number.MAX_SAFE_INTEGER
            };
        }

        if(paymentState.type==="upcoming"){
            return {
                rank:2,
                distance:Math.abs(diff),
                dueTime:due ? due.getTime() : Number.MAX_SAFE_INTEGER
            };
        }

        return {
            rank:3,
            distance:0,
            dueTime:due ? due.getTime() : Number.MAX_SAFE_INTEGER
        };
    }

    filteredRows.sort(function(a,b){
        const A=subscriptionSortInfo(a);
        const B=subscriptionSortInfo(b);

        if(A.rank!==B.rank){
            return A.rank-B.rank;
        }

        if(A.rank===0){
            if(A.distance!==B.distance){
                return B.distance-A.distance;
            }
        }else if(A.rank===2){
            if(A.distance!==B.distance){
                return A.distance-B.distance;
            }
        }

        return A.dueTime-B.dueTime;
    });

    const grouped={};
    filteredRows.forEach(function(subscription){
        const key=String(subscription.customer_id);
        if(!grouped[key]){
            grouped[key]={customer:getCustomer(subscription.customer_id),subscriptions:[]};
        }
        grouped[key].subscriptions.push(subscription);
    });
    const groups=Object.values(grouped);

    /*
     * بعد التجميع، نرتب كل عميل حسب أهم اشتراك بداخله.
     * مثال: عميل لديه اشتراك متأخر 7 أيام وآخر قادم،
     * يظل العميل نفسه في مكان المتأخر 7 أيام.
     */
    groups.forEach(function(group){
        group.subscriptions.sort(function(a,b){
            const A=subscriptionSortInfo(a);
            const B=subscriptionSortInfo(b);

            if(A.rank!==B.rank){
                return A.rank-B.rank;
            }

            if(A.rank===0){
                if(A.distance!==B.distance){
                    return B.distance-A.distance;
                }
            }else if(A.rank===2){
                if(A.distance!==B.distance){
                    return A.distance-B.distance;
                }
            }

            return A.dueTime-B.dueTime;
        });
    });

    groups.sort(function(a,b){
        const A=subscriptionSortInfo(a.subscriptions[0]);
        const B=subscriptionSortInfo(b.subscriptions[0]);

        if(A.rank!==B.rank){
            return A.rank-B.rank;
        }

        if(A.rank===0){
            if(A.distance!==B.distance){
                return B.distance-A.distance;
            }
        }else if(A.rank===2){
            if(A.distance!==B.distance){
                return A.distance-B.distance;
            }
        }

        return A.dueTime-B.dueTime;
    });

    document.getElementById("content").innerHTML=`
    <div class="page-head">
        <div><h1>${t("subscriptions")}</h1></div>
        <button class="gold-btn" onclick="openSubscriptionModal()">
            <i class="fa-solid fa-plus"></i> ${t("newSubscription")}
        </button>
    </div>
    <div class="card">
        <div class="card-body">
            <div class="subscription-filters">
                <button class="subscription-filter-btn ${selectedStatus==="all"?"active":""}" onclick="setSubscriptionStatusFilter('all')"><b>${counts.all}</b><span>${t("allSubscriptions")}</span><small>${money(totals.all)} ${esc(state.settings.currency||"EGP")}</small></button>
                <button class="subscription-filter-btn ${selectedStatus==="upcoming"?"active":""}" onclick="setSubscriptionStatusFilter('upcoming')"><b>${counts.upcoming}</b><span>${t("upcomingSubscriptions")}</span><small>${money(totals.upcoming)} ${esc(state.settings.currency||"EGP")}</small></button>
                <button class="subscription-filter-btn ${selectedStatus==="due"?"active":""}" onclick="setSubscriptionStatusFilter('due')"><b>${counts.due}</b><span>${t("dueToday")}</span><small>${money(totals.due)} ${esc(state.settings.currency||"EGP")}</small></button>
                <button class="subscription-filter-btn ${selectedStatus==="overdue"?"active":""}" onclick="setSubscriptionStatusFilter('overdue')"><b>${counts.overdue}</b><span>${t("overdue")}</span><small>${money(totals.overdue)} ${esc(state.settings.currency||"EGP")}</small></button>
                <button class="subscription-filter-btn ${selectedStatus==="paid"?"active":""}" onclick="setSubscriptionStatusFilter('paid')"><b>${counts.paid}</b><span>${t("paid")}</span><small>${money(totals.paid)} ${esc(state.settings.currency||"EGP")}</small></button>
            </div>

            <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
                <label style="font-weight:700">فلترة حسب الخدمة</label>
                <select id="subscriptionServiceFilter" onchange="renderSubscriptions()" style="min-width:220px">
                    <option value="">كل الخدمات</option>
                    ${state.services.map(function(service){
                        return `<option value="${service.id}" ${String(selectedService)===String(service.id)?"selected":""}>${esc(service.service_name)}</option>`;
                    }).join("")}
                </select>
                <span class="muted">عدد العملاء: ${groups.length}</span>
            </div>
            <div class="table-wrap">
            <table class="table">
            <thead><tr>
                <th>العميل</th><th>الخدمات</th><th>المنصة / الصفحة</th>
                <th>إجمالي الاشتراك الشهري</th><th>أيام الدفع</th><th>الحالة</th><th>${t("actions")}</th>
            </tr></thead>
            <tbody>
            ${
                groups.length
                ?
                groups.map(function(group){
                    const customer=group.customer;
                    const subs=group.subscriptions;
                    // إجمالي الاشتراك الشهري يعتمد على الاشتراك نفسه
                    // وليس على عدد الشهور المتأخرة، حتى لا يظهر 0
                    // عند فلترة الاشتراكات القديمة، ولا يتضاعف السعر
                    // إذا كان للاشتراك أكثر من شهر متأخر.
                    const uniqueSubscriptions={};
                    subs.forEach(function(s){
                        const key=String(s.id);
                        if(!uniqueSubscriptions[key]){
                            uniqueSubscriptions[key]=s;
                        }
                    });
                    const total=Object.values(uniqueSubscriptions)
                        .reduce(function(sum,s){
                            return sum+Number(s.monthly_fee||0);
                        },0);
                    const currencies=[...new Set(subs.map(function(s){return s.currency||"EGP";}))].join(" / ");
                    const serviceNames=[...new Set(subs.flatMap(servicesForSubscription).map(function(service){return service.service_name;}))];
                    const platforms=subs.map(function(s){return (s.platform||"-")+(s.page_name?" - "+s.page_name:"");});
                    const paymentDays=subs.map(function(s){return s.payment_day||"-";});
                    const statusHtml=subs.map(function(s){return '<div style="margin-bottom:4px">'+periodStatusBadge(s)+'</div>';}).join("");
                    const actions=subs.map(function(s){
                        const status={type:s._periodType};
                        return `
                        <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;flex-wrap:wrap;">
                            <span class="muted" style="min-width:95px">
                                ${esc(servicesForSubscription(s).map(function(service){return service.service_name;}).join(" + ")||"-")}
                            </span>
                            ${status.type!=="paid"?`
                            <button class="mini-btn pay" onclick="openPaymentModal(${s.id},'${s._periodKey}')" title="${t("confirmPayment")}">
                                <i class="fa-solid fa-check"></i>
                            </button>`:""}
                            ${customer?.phone?`
                            <button class="mini-btn wa" onclick="sendWhatsApp(${customer.id},${s.id},'${status.type==="overdue"?"overdue":status.type==="due"?"due":"payment"}')" title="WhatsApp">
                                <i class="fa-brands fa-whatsapp"></i>
                            </button>`:""}
                            ${customer?`
                            <button class="mini-btn" title="رابط العميل" onclick="openCustomerPortal(${customer.id})">
                                <i class="fa-solid fa-link"></i>
                            </button>`:""}
                            <button class="mini-btn" onclick="openSubscriptionModal(${s.id})" title="${t("edit")}">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="mini-btn" onclick="deleteSubscription(${s.id})" title="${t("delete")}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>`;
                    }).join("");

                    return `
                    <tr>
                        <td>
                            <strong>${esc(customer?.client_name||"-")}</strong>
                            ${customer?.phone?`<div class="muted">${esc(customer.phone)}</div>`:""}
                        </td>
                        <td>
                            ${serviceNames.length?serviceNames.map(function(name){
                                return `<span class="badge" style="margin:2px;display:inline-block;">${esc(name)}</span>`;
                            }).join(""):"-"}
                        </td>
                        <td>${platforms.map(function(value){return `<div>${esc(value)}</div>`;}).join("")}</td>
                        <td class="money">${money(total)} ${esc(currencies)}</td>
                        <td>${paymentDays.map(function(day){return `<div>${esc(day)}</div>`;}).join("")}</td>
                        <td>${statusHtml}</td>
                        <td>${actions}</td>
                    </tr>`;
                }).join("")
                :
                `<tr><td colspan="7"><div class="empty">${t("noData")}</div></td></tr>`
            }
            </tbody></table></div>
        </div>
    </div>`;
}

function setSubscriptionStatusFilter(status){
    state.subscriptionFilterStatus=status||"all";
    renderSubscriptions();
}

async function addAnotherSubscriptionFromCurrent(subscriptionId){
    const source=getSubscription(subscriptionId);
    if(!source || !source.customer_id){ showToast("تعذر تحديد العميل",true); return; }
    closeModal();
    await openSubscriptionModal(null,source.customer_id,source);
}
window.addAnotherSubscriptionFromCurrent=addAnotherSubscriptionFromCurrent;

        subscriptionServiceRowHTML(

}
    function removeSubscriptionServiceRow(button){

        document.getElementById(
            "subscriptionServicesContainer"
        );


    if(!container)
        return;


    const rows =
        container.querySelectorAll(
            ".subscription-service-row"
        );


    /*
     * لازم يكون فيه خدمة واحدة على الأقل
     */

        showToast(

        );

        return;

    }


    const row =
        button.closest(
            ".subscription-service-row"
        );


    if(row){

        row.remove();

    }


    updateSubscriptionTotal();

}
    function updateSubscriptionServicePrice(select){

    const row =
        select.closest(
            ".subscription-service-row"
        );


    if(!row)
        return;


    const service =
        getService(select.value);


    if(service){

        const priceInput =
            row.querySelector(
                ".subscription-service-price"
            );


        if(priceInput){

            priceInput.value =
                Number(
                    service.default_price || 0
                );

        }

    }


    updateSubscriptionTotal();

}
    function updateSubscriptionTotal(){

    const inputs =
        document.querySelectorAll(
            ".subscription-service-price"
        );


    let total = 0;


    inputs.forEach(function(input){

        total +=
            Number(
                input.value || 0
            );

    });


    const totalInput =
        document.getElementById(
            "subTotalFee"
        );


    if(totalInput){

        totalInput.value =
            total.toFixed(2);

    }

}
    window.addSubscriptionServiceRow =
        addSubscriptionServiceRow;

    window.removeSubscriptionServiceRow =
        removeSubscriptionServiceRow;

    window.updateSubscriptionServicePrice =
        updateSubscriptionServicePrice;

    window.updateSubscriptionTotal =
        updateSubscriptionTotal;

    const s =
        id

        : (

            : {

     * =========================================
     */

    const customerFieldHtml = presetCustomerId
        ? '<div style="padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);"><strong>' + esc(fixedCustomer?.client_name || "-") + '</strong><div class="muted" style="font-size:9px;margin-top:3px">سيتم إضافة الخدمة كاشتراك جديد لهذا العميل</div></div>' + '<select id="subCustomer" style="display:none"><option value="' + fixedCustomerId + '" selected>' + esc(fixedCustomer?.client_name || "") + '</option></select>'
        : '<select id="subCustomer"><option value="">' + t("choose") + '</option>' + state.customers.map(function(c){ return '<option value="' + c.id + '" ' + (Number(s.customer_id) === Number(c.id) ? "selected" : "") + '>' + esc(c.client_name) + '</option>'; }).join("") + '</select>';

    /*
     * =========================================
     * فتح النافذة
     * =========================================
     */

    openModal(

        id
        ? t("edit")
        : t("newSubscription"),

            <!-- =========================
                 العميل
            ========================== -->

            <div class="field">

                <label>
                    ${t("customer")}
                </label>


                ${customerFieldHtml}

            </div>


            <!-- =========================
                 يوم الدفع
            ========================== -->

            <div class="field">

                <label>
                    ${t("paymentDay")}

                    type="number"
                    min="1"
                    max="31"
                    value="${esc(s.payment_day || 1)}"
                >

            </div>


            <!-- =========================
                 الحالة
            ========================== -->

            <div class="field">

                <label>
                    ${t("status")}
                </label>


                <select id="subStatus">

                    <option value="active">
                        ${t("active")}
                    </option>


                    <option value="inactive">
                        ${t("inactive")}
                    </option>

                </select>

            </div>


            <!-- =========================
                 المنصة
            ========================== -->

            <div class="field">

                <label>
                    ${t("platform")}
                </label>


                <input
                    id="subPlatform"
                    value="${esc(s.platform || "")}"
                >

            </div>


            <!-- =========================
                 الصفحة
            ========================== -->

            <div class="field">

                <label>
                    ${t("page")}
                </label>


                <input
                    id="subPage"
                    value="${esc(s.page_name || "")}"
                >

            </div>


            <!-- =========================
                 رابط الصفحة
            ========================== -->

            <div class="field">

                <label>
                    ${t("pageLink")}
                </label>


                <input
                    id="subPageLink"
                    value="${esc(s.page_link || "")}"
                >

            </div>


            <div class="field full">
                <label>${t("selectVisa")}</label>
                <select id="subVisaCard">
                    <option value="">${t("choose")}</option>
                    ${(state.visaCards||[]).map(function(card){
                        return `<option value="${card.id}" ${Number(s.visa_card_id)===Number(card.id)?"selected":""}>${esc(card.card_name)} — ${maskVisaCard(card)}</option>`;
                    }).join("")}
                </select>
                <div class="muted" style="font-size:9px;margin-top:5px">عند الاختيار سيظهر اسم الفيزا وآخر 4 أرقام فقط.</div>
            </div>

            <!-- =========================
                 الخدمات

            <div class="field full">

     * حساب إجمالي الخدمات
     */

async function saveSubscription(id){

    /*
     * =========================================
     * الحصول على العميل
     * =========================================
     */

    const customerId =
        Number(
            document.getElementById(
                "subCustomer"
            ).value
        );


    if(!customerId){

        showToast(
            t("customer"),
            true
        );

        return;

    }


    /*
     * =========================================
     * الحصول على كل صفوف الخدمات
     * =========================================
     */

    const serviceRows =
        Array.from(
            document.querySelectorAll(
                ".subscription-service-row"
            )
        );


    const services = [];


    /*
     * =========================================
     * قراءة الخدمات
     * =========================================
     */

    for(const row of serviceRows){

        const serviceSelect =
            row.querySelector(
                ".subscription-service-select"
            );


        const priceInput =
            row.querySelector(
                ".subscription-service-price"
            );


        const serviceId =
            serviceSelect
            ? Number(
                serviceSelect.value
            )
            : null;


        const price =
            priceInput
            ? Number(
                priceInput.value || 0
            )
            : 0;


        /*
         * لو الصف فاضي نتجاهله
         */

        if(!serviceId)
            continue;


        services.push({

            app_service_id:
                serviceId,

            price:
                price

        });

    }


    /*
     * =========================================
     * لازم خدمة واحدة على الأقل
     * =========================================
     */

    if(!services.length){

        showToast(
            "اختر خدمة واحدة على الأقل",
            true
        );

        return;

    }


    /*
     * =========================================
     * منع تكرار نفس الخدمة
     * =========================================
     */

    const serviceIds =
        services.map(
            x =>
                x.app_service_id
        );


    const uniqueServiceIds =
        new Set(
            serviceIds
        );


    if(
        uniqueServiceIds.size
        !== serviceIds.length
    ){

        showToast(
            "لا يمكن إضافة نفس الخدمة مرتين داخل الاشتراك",
            true
        );

        return;

    }


    /*
     * =========================================
     * أول خدمة
     *
     * نحفظها في subscriptions.app_service_id
     * للحفاظ على توافق النظام القديم
     * =========================================
     */

    const firstService =
        services[0];


    /*
     * =========================================
     * حساب إجمالي الخدمات
     * =========================================
     */

    const totalFee =
        services.reduce(

            function(total,item){

                return total +
                    Number(
                        item.price || 0
                    );

            },

            0

        );


    /*
     * =========================================
     * بيانات الاشتراك الأساسي
     * =========================================
     */

    const data = {

        customer_id:
            customerId,


        app_service_id:
            firstService.app_service_id,


        platform:
            document.getElementById(
                "subPlatform"
            ).value,


        page_name:
            document.getElementById(                "subPage"
            ).value,

        monthly_fee:
            totalFee,


        payment_day:
            Number(
                document.getElementById(
                    "subPaymentDay"
                ).value || 1
            ),


        status:
            document.getElementById(
                "subStatus"
            ).value,


        page_link:
            document.getElementById(
                "subPageLink"
            ).value,


        notes:
            document.getElementById(
                "subNotes"
            ).value,


        currency:
            state.settings.currency || "EGP",

        visa_card_id:
            document.getElementById("subVisaCard").value
            ? Number(document.getElementById("subVisaCard").value)
            : null,

        visa_name:
            getVisaCard(document.getElementById("subVisaCard").value)?.card_name || null,

        visa_last4:
            getVisaCard(document.getElementById("subVisaCard").value)?.last4 || null

    };


    try{

        let subscriptionId;


        /*
         * =========================================
         * تعديل اشتراك موجود
         * =========================================
         */

        if(id){

            const result =
                await db
                .from("subscriptions")
                .update(data)
                .eq("id",id)
                .select()
                .single();


            if(result.error)
                throw result.error;


            subscriptionId =
                result.data.id;


            /*
             * حذف الخدمات التابعة القديمة
             */

            const deleteServices =
                await db
                .from("subscription_services")
                .delete()
                .eq(
                    "subscription_id",
                    subscriptionId
                );


            if(deleteServices.error)
                throw deleteServices.error;

        }


        /*
         * =========================================
         * إنشاء اشتراك جديد
         * =========================================
         */

        else{

            const result =
                await db
                .from("subscriptions")
                .insert(data)
                .select()
                .single();


            if(result.error)
                throw result.error;


            subscriptionId =
                result.data.id;

        }


        /*
         * =========================================
         * تجهيز الخدمات التابعة للاشتراك
         * =========================================
         */

        const serviceData =
            services.map(

                function(service){

                    return {

                        subscription_id:
                            subscriptionId,


                        app_service_id:
                            service.app_service_id,


                        price:
                            service.price,


                        status:
                            data.status,


                        notes:
                            data.notes || ""

                    };

                }

            );


        /*
         * =========================================
         * حفظ الخدمات
         * =========================================
         */

        const servicesResult =
            await db
            .from("subscription_services")
            .insert(
                serviceData
            );


        if(servicesResult.error)
            throw servicesResult.error;


        /*
         * =========================================
         * إغلاق النافذة
         * =========================================
         */

        closeModal();


        /*
         * تحديث البيانات
         */

        await refresh();


        /*
         * رسالة نجاح
         */

        showToast(
            t("saved")
        );


    }catch(error){

        console.error(
            "saveSubscription error:",
            error
        );


        showToast(
            error.message,
            true
        );

    }

}

async function deleteSubscription(id){

    if(!confirm(
        state.lang==="ar"
        ?"هل تريد حذف الاشتراك؟"
        :"Delete subscription?"
    ))
    return;

    try{

        const result=
        await db
        .from("subscriptions")
        .delete()
        .eq("id",id);

        if(result.error)
            throw result.error;

        await refresh();

        showToast(t("deleted"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}

function togglePaymentMethodDetails(){
    const method=document.getElementById("paymentMethod");
    const wrap=document.getElementById("paymentMethodDetailsWrap");
    const label=document.getElementById("paymentMethodDetailsLabel");
    if(!method||!wrap||!label)return;
    if(method.value==="instapay"){wrap.style.display="";label.textContent="رقم حساب / إنستا باي";}
    else if(method.value==="vodafone_cash"){wrap.style.display="";label.textContent="رقم محفظة فودافون كاش";}
    else if(method.value==="bank"){wrap.style.display="";label.textContent="بيانات التحويل البنكي";}
    else if(method.value==="visa"){wrap.style.display="";label.textContent="آخر 4 أرقام من البطاقة";}
    else if(method.value==="other"){wrap.style.display="";label.textContent="تفاصيل طريقة الدفع";}
    else{wrap.style.display="none";}
}

function paymentMethodLabel(method){
    const labels={cash:"كاش",instapay:"إنستا باي",vodafone_cash:"فودافون كاش",bank:"تحويل بنكي",visa:"فيزا",other:"أخرى"};
    return labels[method]||method||"-";
}

function getCustomerOutstandingForReceipt(customerId,paidSubscriptionId){
    const rows=[];
    (state.subscriptions||[]).forEach(function(s){
        if(String(s.customer_id)!==String(customerId))return;
        (getSubscriptionPeriods(s)||[]).forEach(function(p){
            if(p.periodType==="paid")return;
            if(String(s.id)===String(paidSubscriptionId)&&p.periodKey===getCurrentSubscriptionPeriod(s)?.periodKey)return;
            if(paymentExistsForPeriod(s,p.dueDate))return;
            rows.push({service:getService(s.app_service_id)?.service_name||s.page_name||"اشتراك",amount:Number(s.monthly_fee||0),dueDate:p.dueDate});
        });
    });
    return rows;
}

    msg+="المبلغ المدفوع: "+money(data.amount)+" "+(data.currency||"EGP")+"\n";
    msg+="طريقة الدفع: "+paymentMethodLabel(data.paymentMethod)+"\n";
    if(data.methodDetails){
        if(data.paymentMethod==="instapay")msg+="حساب إنستا باي: "+data.methodDetails+"\n";
        else if(data.paymentMethod==="vodafone_cash")msg+="محفظة فودافون كاش: "+data.methodDetails+"\n";
        else msg+="تفاصيل الدفع: "+data.methodDetails+"\n";

    msg+="واتسدد يوم: "+(data.paymentDate||"-")+"\n";

    if(data.outstanding&&data.outstanding.length){
        msg+="\nاشتراكات أخرى مستحقة:\n";

function getPaymentReceiptFileName(data){
    const clean=function(value){
        return String(value||"")
            .replace(/[\\/:*?"<>|]/g,"")
            .replace(/\\s+/g," ")
            .trim();
    };
    const customer=clean(data.customerName)||"عميل";
    const service=clean(data.serviceName)||"اشتراك";
    const date=clean(data.paymentDate)||isoDate(new Date());
    return "إيصال سداد - "+customer+" - "+service+" - "+date;
}

function sendPaymentReceiptWhatsApp(){
    const data=window._lastPaymentReceipt;
    if(!data){showToast("لا يوجد إيصال جاهز للإرسال",true);return;}
    let number=String(data.phone||"").replace(/\D/g,"");
    if(number.startsWith("0"))number="20"+number.substring(1);
    if(!number||number.length<10){showToast("رقم هاتف العميل غير صحيح",true);return;}
    window.location.href="https://wa.me/"+number+"?text="+encodeURIComponent(data.message);
}

async function confirmPayment(subscriptionId,periodKey){

    const s=
    getSubscription(subscriptionId);

    const customer=
    getCustomer(s.customer_id);

    const period=getSubscriptionPeriods(s).find(function(p){return p.periodKey===periodKey;}) || getCurrentSubscriptionPeriod(s);
    const due=period ? period.dueDate : subscriptionDueDate(s);

    if(
        paymentExistsForPeriod(
            s,
            due
        )
    ){

        closeModal();

        return;

    }

    const amount=
    Number(
        document.getElementById(
            "paymentAmount"
        ).value||0
    );

    const paymentDate=
    document.getElementById(
        "paymentDate"
    ).value;

    const notes=
    document.getElementById(
        "paymentNotes"
    ).value;

    const paymentMethod=document.getElementById("paymentMethod")?.value||"cash";
    const methodDetails=document.getElementById("paymentMethodDetails")?.value.trim()||"";
    const payerName=document.getElementById("payerName")?.value.trim()||customer?.client_name||"";

function renderTraders(){

        class="gold-btn"
        onclick="openTraderModal()">

        </button>

    </div>


    <div
    class="grid"
    style="
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr))
    ">

    ${
    state.traders.slice().sort(function(A,B){

        function traderRank(trader){

            const customerIds=state.customers
                .filter(function(c){
                    return Number(c.trader_id)===Number(trader.id);
                })
                .map(function(c){
                    return Number(c.id);
                });

            const subs=state.subscriptions.filter(function(s){
                return customerIds.includes(Number(s.customer_id))
                    && s.status!=="inactive";
            });

            let best={rank:4,value:0};

            subs.forEach(function(s){

                const st=getPaymentState(s);

                if(st.type==="overdue"){

                    const due=subscriptionDueDate(s);
                    const today=dateOnly(isoDate(new Date()));
                    const days=Math.max(0,Math.round((today-due)/86400000));

                    if(best.rank>0 || (best.rank===0 && days> -best.value))
                        best={rank:0,value:-days};

                }else if(st.type==="due"){

                    if(best.rank>1)
                        best={rank:1,value:0};

                }else if(st.type==="upcoming"){

                    const due=subscriptionDueDate(s);
                    const today=dateOnly(isoDate(new Date()));
                    const days=Math.round((due-today)/86400000);

                    if(best.rank>2 || (best.rank===2 && days<best.value))
                        best={rank:2,value:days};

                }else if(st.type==="paid"){

                    if(best.rank>3)
                        best={rank:3,value:0};

                }

            });

            return best;
        }

        const a=traderRank(A);
        const b=traderRank(B);

        if(a.rank!==b.rank)
            return a.rank-b.rank;

        if(a.value!==b.value)
            return a.value-b.value;

        return Number(A.id)-Number(B.id);

    }).map(function(trader){

        const count=
        state.customers
        .filter(
            c=>
            Number(c.trader_id)
            ===Number(trader.id)

                style="margin-top:12px">

                    ${t("open")}

                    </button>


                  <button
class="mini-btn"
title="رابط التاجر"
onclick="openTraderPortal(${trader.id})">

<i class="fa-solid fa-link"></i>

</button>

                    <button

async function createTraderInvoice(){

    const traderId=

        ".traderInvoiceCheck:checked"

                unit_price:

                total:

        );

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}


function generateInvoiceNumber(prefix="INV"){

    const date=
    new Date();

    return prefix
    +"-"
    +date.getFullYear()
    +String(
        date.getMonth()+1
    ).padStart(2,"0")
    +"-"
    +Date.now()
    .toString()
    .slice(-6);

}


/* =========================================
   INVOICE FILE NAME
   اسم الملف الافتراضي عند طباعة/حفظ PDF
========================================= */

function cleanInvoiceFileName(value){

    return String(value || "")
        .replace(/[\\/:*?"<>|]/g,"-")
        .replace(/[\x00-\x1F]/g,"")
        .replace(/\\s+/g," ")
        .trim()
        .replace(/^[. ]+|[. ]+$/g,"")
        .slice(0,180);

}

function getInvoiceFileName(invoice){

    const trader =
        getTrader(invoice.trader_id);

    const customer =
        getCustomer(invoice.customer_id);

    const items =
        state.invoiceItems.filter(
            x => Number(x.invoice_id) === Number(invoice.id)
        );

    if(
        invoice.invoice_type === "trader"
        || trader
    ){

        const customerNames =
            [...new Set(
                items.map(function(item){

                    return getCustomer(
                        item.customer_id
                    )?.client_name
                    || getCustomer(
                        getSubscription(
                            item.subscription_id
                        )?.customer_id
                    )?.client_name
                    || "";

                }).filter(Boolean)
            )];

        const names =
            customerNames.join(" - ")
            || "عملاء";

        return cleanInvoiceFileName(
            [
                trader?.trader_name || "تاجر",
                names,
                money(invoice.total),
                invoice.currency || "EGP"
            ].join(" - ")
        ) || ("فاتورة-" + invoice.id);

    }

    const subscription =
        getSubscription(
            invoice.subscription_id
        );

    const customerName =
        customer?.client_name
        || getCustomer(
            subscription?.customer_id
        )?.client_name
        || "عميل";

    const serviceName =
        getService(
            subscription?.app_service_id
        )?.service_name
        || "";

    const pageName =
        subscription?.page_name
        || "";

    const detail =
        pageName
        || serviceName
        || "اشتراك";

    return cleanInvoiceFileName(
        [
            customerName,
            detail
        ].filter(Boolean).join(" - ")
    ) || ("فاتورة-" + invoice.id);

}

async function saveFollowup(){

    const data={

        customer_id:
        Number(
            document.getElementById(
                "followCustomer"
            ).value
        ),

        followup_date:
        document.getElementById(
            "followDate"
        ).value,

        followup_type:
        document.getElementById(
            "followType"
        ).value,

        title:
        document.getElementById(
            "followTitle"
        ).value,

        notes:
        document.getElementById(
            "followNotes"
        ).value,

        status:"pending"

    };

    if(!data.customer_id)
        return;

    try{

        const result=
        await db
        .from("followups")
        .insert(data);

        if(result.error)
            throw result.error;

        closeModal();

        await refresh();

        showToast(t("saved"));

    }catch(error){

        showToast(
            error.message,
            true
        );

    }

}
