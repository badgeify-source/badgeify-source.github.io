<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>كشف حساب مباشر</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;--bg:#f1f5f9;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--green:#166534;--red:#991b1b;--gold:#a16207}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#eaf2ff 0,#f8fafc 240px,var(--bg) 100%);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:780px;margin:24px auto;padding:0 14px}
.top,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 8px 26px rgba(15,23,42,.07)}
.top{border-top:4px solid #c59a3d}
.brand{display:inline-block;font-size:12px;letter-spacing:1.5px;color:var(--gold);font-weight:800;background:#fffbeb;padding:5px 9px;border-radius:7px}
.muted{color:var(--muted);font-size:13px}
.title{font-size:24px;font-weight:800;margin:10px 0 2px;color:#172033}
.balances{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.balance{border:1px solid #bbf7d0;border-radius:15px;padding:15px;background:#dcfce7;color:var(--green)}
.balance.red{border-color:#fecaca;background:#fee2e2;color:var(--red)}
.balance small{display:block;font-size:13px;font-weight:700}
.balance strong{font-size:22px;display:block;margin-top:3px;overflow-wrap:anywhere}
.net{margin-top:12px;padding:14px;border:1px solid #fde68a;border-radius:13px;background:#fffbeb;color:#92400e;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:800}
button{border:0;border-radius:11px;padding:10px 15px;background:#1e293b;color:#fff;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.08)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.card h3{color:#172033}
.entry{border:1px solid #dbe3ee;border-right:4px solid #16a34a;border-radius:15px;padding:15px;margin-top:11px;background:#fff;box-shadow:0 3px 10px rgba(15,23,42,.04)}
.entryhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{display:inline-block;font-size:12px;padding:5px 10px;border-radius:99px;background:#dcfce7;color:#166534;font-weight:800;white-space:normal}
.pill.red{background:#fee2e2;color:#991b1b}
.amount{font-size:20px;font-weight:800;white-space:nowrap;color:#172033}
.details{font-size:13px;color:var(--muted);margin:7px 0;overflow-wrap:anywhere}
.numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.numbers div{background:#f1f5f9;border:1px solid #e2e8f0;padding:10px;border-radius:11px;font-size:12px;color:#475569}
.numbers div:nth-child(2){background:#ecfdf5;border-color:#bbf7d0;color:#166534}
.numbers div:nth-child(3){background:#fffbeb;border-color:#fde68a;color:#92400e}
.numbers b{display:block;color:#172033;font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.payment{font-size:12px;border-top:1px dashed #cbd5e1;padding-top:9px;margin-top:9px;color:#475569;overflow-wrap:anywhere}
.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;padding:14px;border-radius:12px}
.empty{text-align:center;color:var(--muted);padding:22px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 24px}
@media(max-width:520px){.wrap{margin:12px auto}.top,.card{padding:14px;border-radius:16px}.title{font-size:20px}.balance{padding:12px}.balance strong{font-size:18px}.amount{font-size:17px}.entry{padding:12px}.numbers{grid-template-columns:1fr 1fr}.numbers div:last-child{grid-column:1/-1}.entryhead{gap:7px}}
@media print{body{background:#fff}.wrap{max-width:none;margin:0;padding:0}.top,.card,.entry{box-shadow:none;break-inside:avoid}.actions{display:none}.top,.card{border-color:#cbd5e1}}
</style>
</head>
<body><main class="wrap">
<section class="top"><div class="brand">PERSONAL FINANCE</div><div class="title" id="personName">كشف حساب مباشر</div><div class="muted">كشف قراءة فقط — يتحدث عند إعادة تحميل البيانات</div><div id="updated" class="muted" style="margin-top:5px"></div>
<div class="balances"><div class="balance"><small>ليك عنده</small><strong id="lent">—</strong></div><div class="balance red"><small>عليك له</small><strong id="borrowed">—</strong></div></div><div class="net"><span>صافي الحساب</span><span id="net">—</span></div>
<div class="actions"><button onclick="loadStatement()">تحديث الكشف</button><button onclick="window.print()">طباعة</button></div></section>
<section class="card"><h3 style="margin:0">الحركات بالتفصيل</h3><div id="entries" class="empty">جاري تحميل كشف الحساب...</div></section>
<div class="footer">كشف حساب إلكتروني مباشر • لا يمكن تعديل الحركات من هذا الرابط</div>
</main>
<script>
const SUPABASE_URL="https://rsvzachgbqsucqgrwguv.supabase.co";
const SUPABASE_KEY="sb_publishable_jn8QNpKQ8v7awUj2wYANdw_wcliO986";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const token=new URLSearchParams(location.search).get('token');
const fmt=n=>new Intl.NumberFormat('ar-EG',{maximumFractionDigits:2}).format(Number(n||0))+' ج.م';
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>v?new Date(v+'T00:00:00').toLocaleDateString('ar-EG'):'—';
async function loadStatement(){
 const host=document.getElementById('entries');host.innerHTML='<div class="empty">جاري تحديث البيانات...</div>';
 if(!token){host.innerHTML='<div class="error">رابط كشف الحساب غير مكتمل.</div>';return;}
 const {data,error}=await db.rpc('get_person_loan_statement_share',{p_token:token});
 if(error||!data){host.innerHTML='<div class="error">الرابط غير صالح أو تم إيقافه. تواصل مع صاحب الحساب.</div>';return;}
 const lent=Number(data.lent_total||0),borrowed=Number(data.borrowed_total||0),net=lent-borrowed;
 document.getElementById('personName').textContent='كشف حساب — '+(data.person_name||'العميل');
 document.getElementById('lent').textContent=fmt(lent);document.getElementById('borrowed').textContent=fmt(borrowed);
 const netEl=document.getElementById('net');netEl.textContent=(net>0?'ليك '+fmt(net):net<0?'عليك '+fmt(-net):'الحساب متساوي');netEl.style.color=net<0?'#b42318':'#067647';
 document.getElementById('updated').textContent='آخر تحديث: '+new Date().toLocaleString('ar-EG');
 const loans=Array.isArray(data.loans)?data.loans:[];
 if(!loans.length){host.innerHTML='<div class="empty">لا توجد حركات مسجلة حتى الآن.</div>';return;}
 host.innerHTML=loans.map(l=>{
  const lent=String(l.direction||'lent')==='lent',paid=Number(l.paid||0),remaining=Number(l.remaining||0);
  const pays=(Array.isArray(l.payments)?l.payments:[]).map(p=>'<div class="payment">دفعة بتاريخ '+safe(date(p.date))+' — '+safe(fmt(p.amount))+(p.notes?' — '+safe(p.notes):'')+'</div>').join('');
  return '<article class="entry"><div class="entryhead"><div><span class="pill '+(lent?'':'red')+'">'+(lent?'أعطيته فلوس — ليك عنده':'أخذت منه فلوس — عليك له')+'</span><div class="details">'+safe(date(l.loan_date))+' • '+safe(l.account_name||'حساب مالي')+'</div></div><div class="amount">'+safe(fmt(l.amount))+'</div></div><div class="details">'+safe([l.purpose,l.notes].filter(Boolean).join(' — ')||'بدون تفاصيل إضافية')+'</div><div class="numbers"><div>أصل المبلغ<b>'+safe(fmt(l.amount))+'</b></div><div>'+(lent?'المحصل':'المسدد')+'<b>'+safe(fmt(paid))+'</b></div><div>المتبقي<b>'+safe(fmt(remaining))+'</b></div></div>'+pays+'</article>';
 }).join('');
}
loadStatement();
setInterval(loadStatement,60000);
</script></body></html>
